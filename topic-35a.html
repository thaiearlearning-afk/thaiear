<script>
window.ThaiEarTopic = {
  tier: "member",
  audioPrefix: "Buddhism_LI1",
  sentences: [
  { num: 1248, display: 1, preview: "เจดีย์", thai: "วัดนี้มีเจดีย์เก่าแก่ | สร้างมาตั้งแต่สมัยอยุธยาเลยครับ", english: "This temple has an ancient chedi — built right back in the Ayutthaya period.", gloss: [["วัดนี้", "this temple"], ["มี", "has"], ["เจดีย์", "chedi"], ["เก่าแก่", "ancient"], ["สร้าง", "built"], ["มา", "(durative)"], ["ตั้งแต่", "since"], ["สมัยอยุธยา", "Ayutthaya era"], ["เลย", "(emphasis)"], ["ครับ", "polite(m)"]], cultural: "A เจดีย์ (chedi) is the bell-shaped stupa enshrining relics or ashes. Ayutthaya was Thailand's capital c.1350–1767, so this marks the temple as centuries old. สร้างมาตั้งแต่ uses มา to stress the span continuing up to today." },
  { num: 1249, display: 2, preview: "พระพุทธรูป", thai: "พระพุทธรูปองค์ใหญ่ในโบสถ์ศักดิ์สิทธิ์มากนะคะ", english: "The big Buddha statue in the ordination hall is very sacred.", gloss: [["พระพุทธรูป", "Buddha statue"], ["องค์", "(classifier)"], ["ใหญ่", "big"], ["ใน", "in"], ["โบสถ์", "ordination hall"], ["ศักดิ์สิทธิ์", "sacred"], ["มาก", "very"], ["นะ", "(softener)"], ["คะ", "polite(f)"]], cultural: "องค์ is the classifier for Buddha images and revered persons. The โบสถ์ (ubosot) is a temple's most sacred building, where monks are ordained; its principal Buddha image is the spiritual heart of the compound." },
  { num: 1250, display: 3, preview: "ทำวัตรเย็น", thai: "พอเสียงระฆังดังขึ้น | ก็ถึงเวลาที่พระทำวัตรเย็นแล้วครับ", english: "When the temple bell rings, it's time for the monks' evening chanting service.", gloss: [["พอ", "as soon as"], ["เสียง", "sound"], ["ระฆัง", "bell"], ["ดังขึ้น", "rings"], ["ก็", "then"], ["ถึงเวลา", "it's time"], ["ที่", "that"], ["พระ", "monks"], ["ทำวัตรเย็น", "evening chanting"], ["แล้ว", "(already)"], ["ครับ", "polite(m)"]], cultural: "ทำวัตร is the twice-daily chanting service — ทำวัตรเช้า (morning) and ทำวัตรเย็น (evening). พอ…ก็ is the 'as soon as X, then Y' frame." },
  { num: 1251, display: 4, preview: "เจ้าอาวาส", thai: "หลวงพ่อเจ้าอาวาสที่วัดนี้ทั้งใจดีทั้งพูดเก่งเลยครับ", english: "The abbot at this temple is both kind and a wonderful speaker.", gloss: [["หลวงพ่อ", "venerable father"], ["เจ้าอาวาส", "abbot"], ["ที่วัดนี้", "at this temple"], ["ทั้ง", "both"], ["ใจดี", "kind"], ["ทั้ง", "and"], ["พูดเก่ง", "well-spoken"], ["เลย", "(emphasis)"], ["ครับ", "polite(m)"]], cultural: "หลวงพ่อ ('venerable father') is a warm, respectful way to address a senior monk; เจ้าอาวาส is the formal word for the abbot. ทั้ง…ทั้ง stacks two qualities: 'both…and…'." },
  { num: 1252, display: 5, preview: "แม่ชี", thai: "แม่ชีจะนุ่งขาวห่มขาวและใช้ชีวิตปฏิบัติธรรมอยู่ที่วัดค่ะ", english: "Nuns dress all in white and live a life of practice at the temple.", gloss: [["แม่ชี", "nun"], ["จะ", "(will)"], ["นุ่งขาวห่มขาว", "dress in white"], ["และ", "and"], ["ใช้ชีวิต", "live"], ["ปฏิบัติธรรม", "practising Dhamma"], ["อยู่ที่วัด", "at the temple"], ["ค่ะ", "polite(f)"]], cultural: "แม่ชี are Thai Buddhist nuns. They aren't fully ordained as monks are; they shave their heads, keep eight or more precepts, and wear white rather than the monks' ochre." },
  { num: 1253, display: 6, preview: "บิณฑบาต", thai: "ทุกเช้ามืดพระจะออกบิณฑบาตไปตามหมู่บ้านครับ", english: "Every dawn the monks go out on alms round through the villages.", gloss: [["ทุกเช้ามืด", "every dawn"], ["พระ", "monks"], ["จะ", "(will)"], ["ออก", "go out"], ["บิณฑบาต", "alms round"], ["ไปตาม", "through"], ["หมู่บ้าน", "the villages"], ["ครับ", "polite(m)"]], cultural: "บิณฑบาต is the dawn alms round: monks walk in silence with their bowls while lay people place food inside. Monks neither thank nor ask — the giving is the layperson's own chance to make merit." },
  { num: 1254, display: 7, preview: "ใส่บาตร", thai: "แม่ตื่นแต่เช้าไปใส่บาตรหน้าบ้านทุกวันพระค่ะ", english: "Mum gets up early to offer alms at the house gate every holy day.", gloss: [["แม่", "Mum"], ["ตื่นแต่เช้า", "wakes early"], ["ไป", "to"], ["ใส่บาตร", "offer alms"], ["หน้าบ้าน", "at the gate"], ["ทุกวันพระ", "every holy day"], ["ค่ะ", "polite(f)"]], cultural: "ใส่บาตร is 'putting food in the bowl' — offering to monks on their round. วันพระ ('monk day') falls about weekly on the lunar quarter-days and is the traditional day for merit-making." },
  { num: 1255, display: 8, preview: "ถอดรองเท้า", thai: "เวลาใส่บาตร | อย่าลืมถอดรองเท้าก่อนนะครับ", english: "When you offer alms, don't forget to take off your shoes first.", gloss: [["เวลา", "when"], ["ใส่บาตร", "offer alms"], ["อย่าลืม", "don't forget"], ["ถอดรองเท้า", "take off shoes"], ["ก่อน", "first"], ["นะ", "(softener)"], ["ครับ", "polite(m)"]], cultural: "Removing your shoes shows respect and humility — you stand barefoot, lower than the monk. Shoes come off before entering temple buildings for the same reason." },
  { num: 1256, display: 9, preview: "ถูกเนื้อต้องตัว", thai: "ตามพระวินัย | พระกับผู้หญิงห้ามถูกเนื้อต้องตัวกันเด็ดขาดครับ", english: "According to the Vinaya, a monk and a woman must never make physical contact at all.", gloss: [["ตาม", "according to"], ["พระวินัย", "the Vinaya"], ["พระ", "a monk"], ["กับ", "and"], ["ผู้หญิง", "a woman"], ["ห้าม", "must not"], ["ถูกเนื้อต้องตัว", "touch"], ["กัน", "each other"], ["เด็ดขาด", "at all"], ["ครับ", "polite(m)"]], cultural: "The Vinaya (พระวินัย) forbids a monk any physical contact with a woman, so women never hand things straight to a monk — they set the item down or place it on a receiving cloth. ถูกเนื้อต้องตัว is the set idiom for bodily contact." },
  { num: 1257, display: 10, preview: "ประเคน", thai: "เวลาถวายอาหารพระ | ต้องยกของขึ้นด้วยสองมือแล้วประเคนให้ท่านค่ะ", english: "To offer food to a monk, you lift it up with both hands and present it to him.", gloss: [["เวลา", "when"], ["ถวาย", "offer"], ["อาหารพระ", "food to a monk"], ["ต้อง", "must"], ["ยก", "lift"], ["ของ", "the item"], ["ขึ้น", "up"], ["ด้วยสองมือ", "with both hands"], ["แล้ว", "then"], ["ประเคน", "present"], ["ให้ท่าน", "to him"], ["ค่ะ", "polite(f)"]], cultural: "ประเคน is the formal act of offering something into a monk's hands (or, for a woman, onto a cloth he holds), raised respectfully with both hands. ถวาย is the humble verb 'to offer' used for monks and royalty." },
  { num: 1258, display: 11, preview: "ได้รับพร", thai: "หลังถวายอาหารพระแล้ว | เราก็จะได้รับพรเป็นภาษาบาลีจากท่านครับ", english: "After offering food to the monks, we receive a blessing in Pali from them.", gloss: [["หลัง", "after"], ["ถวายอาหารพระ", "offering food"], ["แล้ว", "(done)"], ["เรา", "we"], ["ก็", "then"], ["จะ", "(will)"], ["ได้รับ", "receive"], ["พร", "a blessing"], ["เป็นภาษาบาลี", "in Pali"], ["จากท่าน", "from him"], ["ครับ", "polite(m)"]], cultural: "Monks bless donors with a Pali chant of thanks (อนุโมทนา) after an offering; lay people often pour water (กรวดน้ำ) during it to dedicate the merit. ได้รับ is the neutral 'receive' passive." },
  { num: 1259, display: 12, preview: "ทำบุญ", thai: "คนไทยนิยมทำบุญตักบาตรในวันเกิดของตัวเองครับ", english: "Thais like to make merit and offer alms on their own birthday.", gloss: [["คนไทย", "Thais"], ["นิยม", "like to"], ["ทำบุญ", "make merit"], ["ตักบาตร", "offer alms"], ["ในวันเกิด", "on the birthday"], ["ของตัวเอง", "their own"], ["ครับ", "polite(m)"]], cultural: "Making merit on your birthday — offering alms, releasing animals, or a temple donation — is a common Thai way to mark the day and start it well." },
  { num: 1260, display: 13, preview: "จิตใจสบาย", thai: "ทำบุญบ่อยๆ | แล้วจิตใจสบายขึ้นเยอะเลยค่ะ", english: "Making merit often, the mind feels much more at ease.", gloss: [["ทำบุญ", "make merit"], ["บ่อยๆ", "often"], ["แล้ว", "and"], ["จิตใจ", "the mind"], ["สบายขึ้น", "feels lighter"], ["เยอะ", "a lot"], ["เลย", "(emphasis)"], ["ค่ะ", "polite(f)"]], cultural: "ทำบุญ covers any merit-making — giving, keeping precepts, or meditating; the felt result is often described as a lighter, calmer mind." },
  { num: 1261, display: 14, preview: "ศาลา", thai: "เขาบริจาคเงินสร้างศาลาหลังใหม่ให้วัดด้วยครับ", english: "He even donated money to build a new sala for the temple.", gloss: [["เขา", "he"], ["บริจาคเงิน", "donated money"], ["สร้าง", "to build"], ["ศาลา", "a sala"], ["หลัง", "(classifier)"], ["ใหม่", "new"], ["ให้วัด", "for the temple"], ["ด้วย", "too"], ["ครับ", "polite(m)"]], cultural: "A ศาลา (sala) is the open-sided hall in a temple compound, used for gatherings, teaching and resting — Westerners in Thailand usually just call it a 'sala'. หลัง is the classifier for buildings." },
  { num: 1262, display: 15, preview: "กรวดน้ำ", thai: "กรวดน้ำเสร็จแล้ว | เราจะอุทิศบุญให้ญาติที่เสียไปค่ะ", english: "Once the water libation is poured, we dedicate the merit to relatives who've passed away.", gloss: [["กรวดน้ำ", "pour libation"], ["เสร็จแล้ว", "once done"], ["เรา", "we"], ["จะ", "(will)"], ["อุทิศบุญ", "dedicate merit"], ["ให้ญาติ", "to relatives"], ["ที่เสียไป", "who've passed"], ["ค่ะ", "polite(f)"]], cultural: "กรวดน้ำ is the rite of slowly pouring water as the merit just made is dedicated to others — often deceased relatives — letting the merit symbolically 'flow' to them." },
  { num: 1263, display: 16, preview: "ปล่อยนกปล่อยปลา", thai: "ปล่อยนกปล่อยปลาถือว่าได้บุญและเป็นการให้ชีวิตครับ", english: "Releasing birds and fish is considered making merit and giving life.", gloss: [["ปล่อยนกปล่อยปลา", "releasing birds & fish"], ["ถือว่า", "is considered"], ["ได้บุญ", "merit"], ["และ", "and"], ["เป็นการ", "an act of"], ["ให้ชีวิต", "giving life"], ["ครับ", "polite(m)"]], cultural: "Releasing caged birds or fish (ปล่อยนกปล่อยปลา) is a popular merit act symbolising the gift of freedom and life. Vendors often sell animals outside temples for exactly this." },
  { num: 1264, display: 17, preview: "จุดธูป", thai: "ก่อนขอพร | ต้องจุดธูปสามดอกแล้วกราบพระค่ะ", english: "Before asking for a blessing, you light three incense sticks and prostrate to the Buddha.", gloss: [["ก่อน", "before"], ["ขอพร", "asking a blessing"], ["ต้อง", "must"], ["จุด", "light"], ["ธูป", "incense"], ["สามดอก", "three sticks"], ["แล้ว", "then"], ["กราบพระ", "bow to the Buddha"], ["ค่ะ", "polite(f)"]], cultural: "Three incense sticks (ธูปสามดอก) honour the Triple Gem — the Buddha, the Dhamma, and the Sangha. ดอก is the classifier for incense sticks and flowers; กราบ is the threefold prostration." },
  { num: 1265, display: 18, preview: "ปิดทอง", thai: "คนมาปิดทองพระพุทธรูป | เพื่อความเป็นสิริมงคลครับ", english: "People apply gold leaf to the Buddha statue for good fortune.", gloss: [["คน", "people"], ["มา", "come"], ["ปิดทอง", "apply gold leaf"], ["พระพุทธรูป", "the Buddha statue"], ["เพื่อ", "for"], ["ความเป็นสิริมงคล", "good fortune"], ["ครับ", "polite(m)"]], cultural: "Pressing tiny squares of gold leaf onto a Buddha image (ปิดทอง) is an act of devotion believed to bring สิริมงคล — auspiciousness and blessing." },
  { num: 1266, display: 19, preview: "เซียมซี", thai: "หลายคนชอบไปเสี่ยงเซียมซีดูดวงที่วัดด้วยนะคะ", english: "Many people like to shake the fortune sticks for a reading at the temple too.", gloss: [["หลายคน", "many people"], ["ชอบ", "like"], ["ไป", "to"], ["เสี่ยงเซียมซี", "shake fortune sticks"], ["ดูดวง", "tell fortunes"], ["ที่วัด", "at the temple"], ["ด้วย", "too"], ["นะ", "(softener)"], ["คะ", "polite(f)"]], cultural: "เซียมซี is fortune-telling with numbered bamboo sticks shaken from a cup; the number matches a printed slip read as your fortune — a Chinese-influenced folk practice common at Thai temples." },
  { num: 1267, display: 20, preview: "บนบาน", thai: "เขาไปบนบานขอให้สมหวัง | พอได้ดั่งใจก็กลับมาแก้บนค่ะ", english: "He went and made a wish for things to work out; when they did, he came back to give thanks.", gloss: [["เขา", "he"], ["ไป", "went"], ["บนบาน", "made a vow"], ["ขอให้สมหวัง", "for his wish"], ["พอ", "once"], ["ได้ดั่งใจ", "it came true"], ["ก็", "then"], ["กลับมา", "came back"], ["แก้บน", "to give thanks"], ["ค่ะ", "polite(f)"]], cultural: "บนบาน is vowing an offering to a sacred power in return for a wish; แก้บน is returning to fulfil that vow once the wish is granted — often with garlands, food, or whatever was promised." },
  { num: 1268, display: 21, preview: "สวดมนต์", thai: "ทุกวันพระชาวบ้านจะไปวัดฟังพระสวดมนต์กันครับ", english: "Every holy day the villagers go to the temple to listen to the monks chant.", gloss: [["ทุกวันพระ", "every holy day"], ["ชาวบ้าน", "villagers"], ["จะ", "(will)"], ["ไปวัด", "go to the temple"], ["ฟัง", "to hear"], ["พระ", "monks"], ["สวดมนต์", "chant"], ["กัน", "(together)"], ["ครับ", "polite(m)"]], cultural: "On วันพระ many lay people spend the day at the temple — offering food, hearing the monks chant, and keeping extra precepts." },
  { num: 1269, display: 22, preview: "ไหว้พระ", thai: "ก่อนนอนแม่จะสวดมนต์ไหว้พระสักบทหนึ่งทุกคืนค่ะ", english: "Before bed Mum chants a short verse of homage to the Buddha every night.", gloss: [["ก่อนนอน", "before bed"], ["แม่", "Mum"], ["จะ", "(will)"], ["สวดมนต์", "chant"], ["ไหว้พระ", "pay homage"], ["สัก", "(just about)"], ["บท", "a verse"], ["หนึ่ง", "one"], ["ทุกคืน", "every night"], ["ค่ะ", "polite(f)"]], cultural: "Many Thais chant a short evening homage before sleep. สัก before a quantity softens it to 'just a… / a … or so'." },
  { num: 1270, display: 23, preview: "นุ่งขาว", thai: "วันพระคนเฒ่าคนแก่ชอบนุ่งขาวไปทำบุญที่วัดค่ะ", english: "On holy days the elderly like to dress in white to make merit at the temple.", gloss: [["วันพระ", "holy days"], ["คนเฒ่าคนแก่", "the elderly"], ["ชอบ", "like to"], ["นุ่งขาว", "wear white"], ["ไปทำบุญ", "make merit"], ["ที่วัด", "at the temple"], ["ค่ะ", "polite(f)"]], cultural: "Older lay people often wear white — the colour of the precept-keeping laity — and spend วันพระ at the temple, a gentle step toward a more renunciate life." },
  { num: 1271, display: 24, preview: "เวียนเทียน", thai: "วันวิสาขบูชาคนนิยมไปเวียนเทียนรอบพระอุโบสถหรือเจดีย์กันค่ะ", english: "On Vesak Puja, people commonly do a candle procession around the ordination hall or a chedi.", gloss: [["วันวิสาขบูชา", "Vesak"], ["คน", "people"], ["นิยม", "commonly"], ["ไป", "go"], ["เวียนเทียน", "candle procession"], ["รอบ", "around"], ["พระอุโบสถ", "the ubosot"], ["หรือ", "or"], ["เจดีย์", "a chedi"], ["กัน", "(together)"], ["ค่ะ", "polite(f)"]], cultural: "Vesak (วิสาขบูชา / Vesak Puja) marks the Buddha's birth, awakening and passing — all on one full-moon day. เวียนเทียน is the candle procession: three clockwise circuits of the ubosot or a chedi, once each for the Buddha, Dhamma and Sangha." },
  { num: 1272, display: 25, preview: "เข้าพรรษา", thai: "เนื่องจากเป็นช่วงเข้าพรรษา | พระจึงไม่ค่อยเดินทางไปไหนสามเดือนครับ", english: "Because it's the rains-retreat period, the monks don't travel much anywhere for three months.", gloss: [["เนื่องจาก", "because"], ["เป็นช่วง", "it's the time of"], ["เข้าพรรษา", "the rains retreat"], ["พระ", "monks"], ["จึง", "therefore"], ["ไม่ค่อย", "rarely"], ["เดินทาง", "travel"], ["ไปไหน", "anywhere"], ["สามเดือน", "three months"], ["ครับ", "polite(m)"]], cultural: "เข้าพรรษา (the rains retreat, 'Buddhist Lent') is the three-month period when monks stay put in one temple — a custom from the Buddha's day to avoid trampling crops in the wet season. เนื่องจาก…จึง is the formal 'because…therefore' pair." },
  { num: 1273, display: 26, preview: "งดเหล้า", thai: "ส่วนชาวบ้านหลายคนจะตั้งใจงดเหล้าตลอดสามเดือนเข้าพรรษาเป็นการรักษาศีลค่ะ", english: "Many lay people, for their part, vow to give up alcohol throughout the three months of Buddhist Lent as a way of keeping the precepts.", gloss: [["ส่วน", "as for"], ["ชาวบ้าน", "lay folk"], ["หลายคน", "many"], ["จะ", "(will)"], ["ตั้งใจ", "resolve to"], ["งดเหล้า", "give up alcohol"], ["ตลอด", "throughout"], ["สามเดือน", "the three months"], ["เข้าพรรษา", "of Lent"], ["เป็นการ", "as a way of"], ["รักษาศีล", "keeping precepts"], ["ค่ะ", "polite(f)"]], cultural: "Many lay Thais vow to abstain from alcohol for the whole of เข้าพรรษา — the nationwide 'งดเหล้าเข้าพรรษา' campaign — as a way of keeping the precepts and building discipline." },
  { num: 1274, display: 27, preview: "ทอดกฐิน", thai: "ช่วงออกพรรษาคนนิยมไปทอดกฐินถวายผ้าให้พระครับ", english: "After the rains retreat people like to do the kathin, offering robes to the monks.", gloss: [["ช่วงออกพรรษา", "at the end of Lent"], ["คน", "people"], ["นิยม", "like to"], ["ไปทอดกฐิน", "do the kathin"], ["ถวายผ้า", "offer robes"], ["ให้พระ", "to monks"], ["ครับ", "polite(m)"]], cultural: "กฐิน (kathina) is the robe-offering held in the month after the rains retreat (ออกพรรษา); a community presents new robes and requisites to a temple's monks — one of the year's biggest merit events." },
  { num: 1275, display: 28, preview: "ศีลห้า", thai: "เวลาไปวัด | ยายจะถือศีลห้าอย่างเคร่งครัดเลยครับ", english: "When she goes to the temple, grandma keeps the five precepts strictly.", gloss: [["เวลาไปวัด", "when she goes to the temple"], ["ยาย", "grandma"], ["จะ", "(will)"], ["ถือศีลห้า", "keep the five precepts"], ["อย่างเคร่งครัด", "strictly"], ["เลย", "(emphasis)"], ["ครับ", "polite(m)"]], cultural: "The ศีลห้า (five precepts) are the basic lay ethics: refrain from killing, stealing, sexual misconduct, false speech, and intoxicants. 'Taking' them (ถือศีล) is a personal undertaking, not a command." },
  { num: 1276, display: 29, preview: "ศีลแปด", thai: "บางคนไปนอนวัดถือศีลแปดในวันสำคัญทางศาสนาค่ะ", english: "On important religious days some people stay overnight at the temple keeping the eight precepts.", gloss: [["บางคน", "some people"], ["ไปนอนวัด", "stay over at the temple"], ["ถือศีลแปด", "keep the eight precepts"], ["ในวันสำคัญ", "on important days"], ["ทางศาสนา", "religious"], ["ค่ะ", "polite(f)"]], cultural: "On major holy days some lay people keep the ศีลแปด (eight precepts) — the five plus no eating after noon, no entertainment or adornment, and no luxurious bedding — living briefly like a renunciate." },
  { num: 1277, display: 30, preview: "นั่งสมาธิ", thai: "เดินเบาๆ เงียบๆ นะคะ | พระกำลังนั่งสมาธิอยู่", english: "Walk softly and quietly — the monks are meditating.", gloss: [["เดิน", "walk"], ["เบาๆ", "softly"], ["เงียบๆ", "quietly"], ["นะ", "(softener)"], ["คะ", "polite(f)"], ["พระ", "the monks"], ["กำลัง", "(are)"], ["นั่งสมาธิ", "meditating"], ["อยู่", "(ongoing)"]], cultural: "กำลัง…อยู่ brackets an action in progress ('currently …-ing'). Quiet is expected around meditating monks and in temple halls." },
  { num: 1278, display: 31, preview: "โกนหัวโกนคิ้ว", thai: "ก่อนบวช | ผู้ชายต้องโกนหัวโกนคิ้วให้หมดก่อนครับ", english: "Before ordaining, a man must shave off all his hair and eyebrows first.", gloss: [["ก่อนบวช", "before ordaining"], ["ผู้ชาย", "a man"], ["ต้อง", "must"], ["โกนหัว", "shave his head"], ["โกนคิ้ว", "shave his eyebrows"], ["ให้หมด", "completely"], ["ก่อน", "first"], ["ครับ", "polite(m)"]], cultural: "Ordination candidates shave the head and — distinctively in the Thai tradition — the eyebrows too, a visible mark of renouncing vanity and worldly identity before becoming a monk." },
  { num: 1279, display: 32, preview: "ลาสิกขา", thai: "เขาบวชเณรตอนปิดเทอม | แล้วลาสิกขาก่อนเปิดเรียนครับ", english: "He ordained as a novice over the school break, then disrobed before term started.", gloss: [["เขา", "he"], ["บวชเณร", "ordained as a novice"], ["ตอนปิดเทอม", "over the break"], ["แล้ว", "then"], ["ลาสิกขา", "disrobed"], ["ก่อนเปิดเรียน", "before term"], ["ครับ", "polite(m)"]], cultural: "Short-term ordination is normal and honourable in Thailand — boys often ordain as เณร (novices) over the school holidays. ลาสิกขา is the formal, blameless act of leaving the monkhood for lay life." },
  { num: 1280, display: 33, preview: "เสนาสนะ", thai: "ที่วัด พระกับเณรจะช่วยกันดูแลความสะอาดของเสนาสนะทุกวันค่ะ", english: "At the temple, the monks and novices help keep the monastery lodgings clean every day.", gloss: [["ที่วัด", "at the temple"], ["พระ", "monks"], ["กับเณร", "and novices"], ["จะ", "(will)"], ["ช่วยกัน", "help each other"], ["ดูแล", "keep"], ["ความสะอาด", "clean"], ["ของเสนาสนะ", "the lodgings"], ["ทุกวัน", "every day"], ["ค่ะ", "polite(f)"]], cultural: "เสนาสนะ refers to the monks' dwellings and furnishings — huts (กุฏิ), halls and their fittings. Daily upkeep is itself part of monastic training, not mere chores." },
  { num: 1281, display: 34, preview: "กวาดลานวัด", thai: "ที่วัดป่า | ทุกคนต้องช่วยกันกวาดลานวัดและทำข้อวัตรตอนเช้าครับ", english: "At a forest temple, everyone helps sweep the temple grounds and do the morning duties.", gloss: [["ที่วัดป่า", "at a forest temple"], ["ทุกคน", "everyone"], ["ต้อง", "must"], ["ช่วยกัน", "help out"], ["กวาดลานวัด", "sweep the grounds"], ["และ", "and"], ["ทำข้อวัตร", "do the duties"], ["ตอนเช้า", "in the morning"], ["ครับ", "polite(m)"]], cultural: "วัดป่า (forest monasteries) keep a strict, simple routine; sweeping the grounds and the morning ข้อวัตร (set duties — chanting, chores, attending elders) are a shared daily discipline for monks and lay guests alike." },
  { num: 1282, display: 35, preview: "พระเครื่อง", thai: "พ่อห้อยพระเครื่องที่เช่ามาจากวัดดังไว้ตลอดเลยครับ", english: "Dad always wears an amulet he got from a famous temple.", gloss: [["พ่อ", "Dad"], ["ห้อย", "wears"], ["พระเครื่อง", "an amulet"], ["ที่เช่ามา", "he 'rented'"], ["จากวัดดัง", "from a famous temple"], ["ไว้", "(keeps on)"], ["ตลอด", "always"], ["เลย", "(emphasis)"], ["ครับ", "polite(m)"]], cultural: "พระเครื่อง are Buddhist amulets worn for protection and luck. Thais say they 'rent' (เช่า) rather than 'buy' an amulet, out of respect — it's deemed too sacred to be simply bought and sold." },
  { num: 1283, display: 36, preview: "ศาลพระภูมิ", thai: "หน้าบ้านคนไทยมักมีศาลพระภูมิให้กราบไหว้ทุกเช้าค่ะ", english: "In front of Thai houses there's usually a spirit house to pay respects to each morning.", gloss: [["หน้าบ้าน", "in front of the house"], ["คนไทย", "Thai people"], ["มักมี", "usually have"], ["ศาลพระภูมิ", "a spirit house"], ["ให้กราบไหว้", "to pay respects to"], ["ทุกเช้า", "every morning"], ["ค่ะ", "polite(f)"]], cultural: "A ศาลพระภูมิ is the small 'spirit house' on a post in many Thai yards, home to the guardian spirit of the land. Daily flowers, incense and drink keep the spirit content — a folk practice woven alongside Buddhism." },
  { num: 1284, display: 37, preview: "ถวายที่วัด", thai: "ถ้าใส่บาตรไม่ทันตอนเช้า | ก็ไปถวายที่วัดเอาก็ได้ค่ะ", english: "If you miss the morning alms round, you can just go and make the offering at the temple instead.", gloss: [["ถ้า", "if"], ["ใส่บาตร", "offering alms"], ["ไม่ทัน", "you miss"], ["ตอนเช้า", "in the morning"], ["ก็", "then"], ["ไปถวาย", "go and offer"], ["ที่วัด", "at the temple"], ["เอา", "(just)"], ["ก็ได้", "that's fine"], ["ค่ะ", "polite(f)"]], cultural: "ก็ได้ signals 'that's fine too / either works'. Miss the dawn alms round and you can simply take the offering to the temple instead — the merit is the same." },
  { num: 1285, display: 38, preview: "เตรียมตัว", thai: "ไปทำบุญที่วัดครั้งแรกต้องเตรียมตัวยังไงบ้างคะ", english: "Going to make merit at the temple for the first time, how should I prepare?", gloss: [["ไปทำบุญ", "making merit"], ["ที่วัด", "at the temple"], ["ครั้งแรก", "for the first time"], ["ต้อง", "should"], ["เตรียมตัว", "prepare"], ["ยังไงบ้าง", "how"], ["คะ", "polite(f)"]], cultural: "A common first-timer's question. Basic prep: dress modestly (shoulders and knees covered), bring flowers, incense or food to offer, and be ready to slip off your shoes." },
]
};
