  sentences: [
  { num: 137, display: 1, preview: "ประชุม", thai: "ประชุมวันจันทร์นี้นะคะ", english: "The meeting is this Monday.", gloss: [["ประชุม","meeting"],["วันจันทร์","Monday"],["นี้","this"],["นะ","softening particle"],["คะ","polite particle (female)"]], cultural: "Thai weekday names all begin with วัน (day): วันจันทร์ (Mon), วันอังคาร (Tue), and so on." },
  { num: 138, display: 2, preview: "ร้าน", thai: "ร้านนี้เปิดทุกวัน | ยกเว้นวันอังคารค่ะ", english: "This shop is open every day except Tuesday.", gloss: [["ร้าน","shop"],["เปิด","open"],["ทุกวัน","every day"],["ยกเว้น","except"],["วันอังคาร","Tuesday"],["ค่ะ","polite particle (female)"]], cultural: "" },
  { num: 139, display: 3, preview: "วันพุธ", thai: "วันพุธรถตู้ออกตีห้าครับ", english: "On Wednesday the van leaves at 5am.", gloss: [["วันพุธ","Wednesday"],["รถตู้","minivan"],["ออก","leave / depart"],["ตีห้า","5am"],["ครับ","polite particle (male)"]], cultural: "ตี + a number gives the small hours: ตีหนึ่ง = 1am up to ตีห้า = 5am." },
  { num: 140, display: 4, preview: "วันพฤหัส", thai: "วันพฤหัสนี้วันหยุดหรือเปล่าคะ", english: "Is this Thursday a day off?", gloss: [["วันพฤหัส","Thursday"],["นี้","this"],["วันหยุด","day off / holiday"],["หรือเปล่า","yes-no question marker"],["คะ","polite particle (female)"]], cultural: "Full form is วันพฤหัสบดี; วันพฤหัส is the everyday short form." },
  { num: 141, display: 5, preview: "หนังสือ", thai: "หนังสือต้องคืนภายในวันศุกร์นะคะ", english: "The book has to be returned by Friday.", gloss: [["หนังสือ","book"],["ต้อง","must"],["คืน","return (something)"],["ภายใน","within / by"],["วันศุกร์","Friday"],["นะ","softening particle"],["คะ","polite particle (female)"]], cultural: "" },
  { num: 142, display: 6, preview: "งาน", thai: "งานวันเสาร์เริ่มกี่โมง | แล้วก็เลิกกี่โมงคะ", english: "What time does Saturday's event start and finish?", gloss: [["งาน","event"],["วันเสาร์","Saturday"],["เริ่ม","start"],["กี่โมง","what time"],["แล้วก็","and then"],["เลิก","finish / end"],["คะ","polite particle (female)"]], cultural: "" },
  { num: 143, display: 7, preview: "วันอาทิตย์", thai: "วันอาทิตย์ควรไปวัดนะครับ", english: "You should go to the temple on Sunday.", gloss: [["วันอาทิตย์","Sunday"],["ควร","should"],["ไป","go"],["วัด","temple"],["นะ","softening particle"],["ครับ","polite particle (male)"]], cultural: "Many Thais make merit at the temple (วัด) at weekends and on Buddhist holy days." },
  { num: 144, display: 8, preview: "ตอนนี้", thai: "ตอนนี้กี่โมงแล้วคะ", english: "What time is it now?", gloss: [["ตอนนี้","now"],["กี่โมง","what time"],["แล้ว","already"],["คะ","polite particle (female)"]], cultural: "" },
  { num: 145, display: 9, preview: "บ่าย", thai: "บ่ายสามโมงครึ่งครับ", english: "Half past three in the afternoon.", gloss: [["บ่าย","afternoon"],["สามโมง","three o'clock"],["ครึ่ง","half (past)"],["ครับ","polite particle (male)"]], cultural: "Early-afternoon hours (1–4pm) are told as บ่าย + โมง." },
  { num: 146, display: 10, preview: "เที่ยง", thai: "เที่ยงแล้ว | ไปกินข้าวกันไหมคะ", english: "It's noon — shall we go and eat?", gloss: [["เที่ยง","noon"],["แล้ว","already"],["ไป","go"],["กินข้าว","eat (a meal)"],["กัน","together"],["ไหม","question particle"],["คะ","polite particle (female)"]], cultural: "" },
  { num: 147, display: 11, preview: "หนัง", thai: "หนังเริ่มสองทุ่มนะครับ", english: "The film starts at 8pm.", gloss: [["หนัง","film / movie"],["เริ่ม","start"],["สองทุ่ม","8pm"],["นะ","softening particle"],["ครับ","polite particle (male)"]], cultural: "ทุ่ม counts evening hours: หนึ่งทุ่ม = 7pm, สองทุ่ม = 8pm, up to ห้าทุ่ม = 11pm." },
  { num: 148, display: 12, preview: "เสาร์อาทิตย์", thai: "เสาร์อาทิตย์ไปรษณีย์ปิดครับ", english: "The post office is closed at weekends.", gloss: [["เสาร์อาทิตย์","weekend (Sat–Sun)"],["ไปรษณีย์","post office"],["ปิด","closed"],["ครับ","polite particle (male)"]], cultural: "" },
  { num: 149, display: 13, preview: "ธนาคาร", thai: "ธนาคารเปิดแปดโมงครึ่งถึงสามโมงครึ่งค่ะ", english: "The bank is open from 8:30 to 3:30.", gloss: [["ธนาคาร","bank"],["เปิด","open"],["แปดโมงครึ่ง","8:30am"],["ถึง","to / until"],["สามโมงครึ่ง","3:30pm"],["ค่ะ","polite particle (female)"]], cultural: "Morning hours use โมง after the number (แปดโมง = 8am); ครึ่ง adds the half-hour." },
  { num: 150, display: 14, preview: "เมื่อวาน", thai: "เมื่อวานไปหาแฟนมาค่ะ", english: "I went to see my boyfriend yesterday.", gloss: [["เมื่อวาน","yesterday"],["ไปหา","go to see / visit"],["แฟน","boyfriend / partner"],["มา","(and came back)"],["ค่ะ","polite particle (female)"]], cultural: "แฟน covers boyfriend, girlfriend, or partner — gender comes from context." },
  { num: 151, display: 15, preview: "แล้ว", thai: "แล้วเจอกันเดือนหน้านะคะ", english: "See you next month.", gloss: [["แล้ว","then"],["เจอกัน","see each other"],["เดือนหน้า","next month"],["นะ","softening particle"],["คะ","polite particle (female)"]], cultural: "" },
  { num: 152, display: 16, preview: "เดือนที่แล้ว", thai: "เดือนที่แล้วไปงานแต่งเพื่อนมาครับ", english: "Last month I went to a friend's wedding.", gloss: [["เดือนที่แล้ว","last month"],["ไป","go"],["งานแต่ง","wedding"],["เพื่อน","friend"],["มา","(and came back)"],["ครับ","polite particle (male)"]], cultural: "งานแต่ง is the everyday short form of งานแต่งงาน (wedding)." },
  { num: 153, display: 17, preview: "ทำงาน", thai: "ทำงานที่บริษัทนี้มาได้ห้าปีแล้วครับ", english: "I've worked at this company for five years now.", gloss: [["ทำงาน","work"],["บริษัท","company"],["มาได้","for (duration up to now)"],["ห้าปี","five years"],["แล้ว","already / now"],["ครับ","polite particle (male)"]], cultural: "...มาได้...แล้ว frames a duration that continues up to the present." },
  { num: 154, display: 18, preview: "ผม", thai: "ผมย้ายมาอยู่ที่นี่ | เมื่อสองปีที่แล้วครับ", english: "I moved here two years ago.", gloss: [["ผม","I (male)"],["ย้าย","move (home)"],["มาอยู่","come to live"],["ที่นี่","here"],["เมื่อ","when / ago"],["สองปีที่แล้ว","two years ago"],["ครับ","polite particle (male)"]], cultural: "" },
  { num: 155, display: 19, preview: "ผม", thai: "ผมรอรถไฟมาครึ่งชั่วโมงแล้วครับ", english: "I've been waiting for the train for half an hour.", gloss: [["ผม","I (male)"],["รอ","wait"],["รถไฟ","train"],["ครึ่งชั่วโมง","half an hour"],["แล้ว","already"],["ครับ","polite particle (male)"]], cultural: "" },
  { num: 156, display: 20, preview: "พรุ่งนี้", thai: "พรุ่งนี้ผมมีนัดหมอตอนบ่ายโมงครับ", english: "I have a doctor's appointment at 1pm tomorrow.", gloss: [["พรุ่งนี้","tomorrow"],["ผม","I (male)"],["มีนัด","have an appointment"],["หมอ","doctor"],["บ่ายโมง","1pm"],["ครับ","polite particle (male)"]], cultural: "บ่ายโมง = 1pm — the one บ่าย hour with no number before โมง." },
  { num: 157, display: 21, preview: "ขอ", thai: "ขอเลื่อนนัดเป็นอาทิตย์หน้าได้ไหมคะ", english: "Could I move the appointment to next week?", gloss: [["ขอ","may I / request"],["เลื่อน","postpone / move"],["นัด","appointment"],["อาทิตย์หน้า","next week"],["ได้ไหม","can I / is it possible"],["คะ","polite particle (female)"]], cultural: "" },
  { num: 158, display: 22, preview: "ผม", thai: "ผมไปฟิตเนสสัปดาห์ละสามครั้งครับ", english: "I go to the gym three times a week.", gloss: [["ผม","I (male)"],["ไป","go"],["ฟิตเนส","gym / fitness"],["สัปดาห์ละ","per week"],["สามครั้ง","three times"],["ครับ","polite particle (male)"]], cultural: "X ละ Y means Y per X (สัปดาห์ละสามครั้ง = three times a week)." },
  { num: 159, display: 23, preview: "พี่สาว", thai: "พี่สาวทำผมสองครั้งต่อเดือนค่ะ", english: "My older sister gets her hair done twice a month.", gloss: [["พี่สาว","older sister"],["ทำผม","get one's hair done"],["สองครั้ง","twice"],["ต่อเดือน","per month"],["ค่ะ","polite particle (female)"]], cultural: "Here ผม means 'hair', not the male pronoun 'I' (ทำผม = do/style hair). ต่อ works like ละ for 'per'." },
