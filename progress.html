<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1A1A1A; --text-secondary: #5A5A5A; --text-tertiary: #9A9A9A;
    --accent: #4B41AD; --accent-light: #EEEDFE; --accent-mid: #534AB7;
    --gold: #F0CC5C; --gold-dark: #C8A030; --purple-mid: #7F77DD;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font-ui: 'Inter', system-ui, sans-serif; --font-thai: 'Sarabun', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
  .page-wrap { max-width: 640px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
  .acct-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

  /* header: person icon + "Name's progress" */
  .prog-head { display: flex; align-items: center; gap: 12px; margin-bottom: 1.75rem; }
  .prog-head-icon { flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; background: var(--accent-light); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; }
  /* Premium subscriber → light-gold person icon (text-gold mark on the pale gold badge). */
  .prog-head-icon.premium-user { background: #FBF5DC; color: #B29234; }
  .prog-head-icon svg { width: 24px; height: 24px; }
  .prog-head-title { font-size: 25px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; color: #1C124E; }

  .btn { font-family: var(--font-ui); font-size: 14px; font-weight: 500; border-radius: var(--radius-sm); padding: 9px 18px; cursor: pointer; border: 0.5px solid var(--border-strong); transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-mid); }
  .btn-ghost { background: var(--surface); color: var(--text-secondary); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: #B00020; color: #fff; border-color: #B00020; }
  .btn-danger:hover { background: #8a0019; }
  .muted { font-size: 13px; color: var(--text-tertiary); }

  /* intro blurb */
  .prog-intro-wrap { position: relative; margin-bottom: 1.5rem; padding: 0.9rem 1.1rem;
    background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-md); }
  .prog-intro { font-size: 13.5px; color: var(--text-secondary); line-height: 1.65; margin: 0; overflow: hidden; }
  .prog-intro strong { color: var(--text-primary); font-weight: 500; }
  /* r136 (owner): collapsible like the topic-page intros — 2 lines + fade when closed. */
  .prog-intro-wrap:not(.open) .prog-intro { max-height: 3.3em; }
  .prog-intro-wrap:not(.open)::after { content: ''; position: absolute; left: 0.9rem; right: 0.9rem; bottom: 2.35em;
    height: 2.1em; background: linear-gradient(to bottom, rgba(255,255,255,0), var(--surface)); pointer-events: none; }
  .prog-intro-more { margin-top: 4px; font-family: var(--font-ui); font-size: 13px; font-weight: 500;
    color: var(--accent); background: none; border: 0; padding: 2px 0; cursor: pointer; }
  .prog-intro-more:hover { text-decoration: underline; }

  /* meditator + "Fluency loading…" with an animated 1→2→3 dot cycle (pure CSS, no JS) */
  .fluency-block { text-align: center; margin: 0.25rem 0 1.75rem; }
  .fluency-img { width: 195px; max-width: 55%; height: auto; display: block; margin: 0 auto 0.4rem; }   /* yak's own sizing (from playlists.html) — swapped with meditator 2026-08-01 */
  .fluency-text { font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: 0.02em; }
  /* fixed-width dots so the text never jitters as they cycle */
  .fluency-text .dots { display: inline-block; width: 1.1em; text-align: left; }
  /* Type the ellipsis one full stop at a time by revealing WIDTH (not `content`, which the app webview
     can't animate). steps(3, start) shows 1 → 2 → 3 dots; the opacity test proved the webview animates,
     so the earlier freeze was prefers-reduced-motion / jump-none — both removed here. */
  .fluency-text .dots::after {
    content: '...'; display: inline-block; width: 0; overflow: hidden;
    vertical-align: bottom; animation: fluency-dots 1.5s steps(3, start) infinite;
  }
  @keyframes fluency-dots { from { width: 0; } to { width: 1.05em; } }

  /* progress rows + bars */
  .prog-list { display: flex; flex-direction: column; gap: 0.85rem; }
  .prog-row { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 0.85rem 1rem; }
  .prog-row-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 0.55rem; }
  .prog-name-wrap { display: flex; align-items: center; gap: 9px; min-width: 0; flex-wrap: wrap; }
  .prog-name { font-size: 14px; font-weight: 500; }
  .prog-name a { color: var(--text-primary); text-decoration: none; }
  .prog-name a:hover { color: var(--accent); }
  .prog-goto { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; font-family: var(--font-ui); font-size: 11.5px; font-weight: 500; color: var(--accent); text-decoration: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); padding: 3px 9px; white-space: nowrap; transition: background 0.15s, border-color 0.15s; }
  .prog-goto:hover { background: var(--accent-light); border-color: var(--accent); }
  .prog-goto .lock { display: inline-flex; }
  .prog-goto .lock svg { width: 10px; height: 10px; }
  .prog-goto.premium .lock { color: var(--gold-dark); }
  .prog-goto.member .lock { color: var(--accent); }
  /* Premium rows: gold "Go to topic" (same text-gold as premium topic pages) + gold hover. */
  .prog-goto.premium { color: #B29234; }
  .prog-goto.premium:hover { background: #FBF5DC; border-color: var(--gold-dark); }
  .prog-num { font-size: 12.5px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .prog-bar { width: 100%; height: 9px; background: var(--bg); border: 0.5px solid var(--border); border-radius: 6px; overflow: hidden; }
  .prog-bar-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 6px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
  .prog-bar-fill.full { background: linear-gradient(90deg, var(--accent), var(--purple-mid)); }
  /* r140: a playlist row's sentence count, moved below its new progress bar — the top-right slot
     is the tally now, matching a topic row exactly. */
  .prog-plcount { font-size: 12px; color: var(--text-tertiary); margin-top: 5px; }
  /* Premium topic rows: gold progress bar (Thai-script gold; gold gradient when full). */
  .prog-row.premium .prog-bar-fill { background: #F0CC5C; }
  .prog-row.premium .prog-bar-fill.full { background: linear-gradient(90deg, #F0CC5C, #D4A82C); }

  /* filter pills — lifted from index.html's filter styling (approved design, r111) */
  .prog-tabs-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    padding: 10px 12px; margin-bottom: 1.1rem; }
  .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-tab { font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; padding: 6px 14px;
    border-radius: 20px; border: 0.5px solid var(--border-strong); background: var(--surface);
    color: var(--text-secondary); cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s; }
  .filter-tab:hover { border-color: var(--accent); color: var(--accent); }
  .filter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filter-tab.tab-free:not(.active):hover { border-color: var(--text-tertiary); color: var(--text-primary); }
  .filter-tab.tab-premium:not(.active):hover { border-color: var(--gold-dark); color: #B29234; }
  /* small "Playlists" divider inside the list */
  .prog-sub { font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-tertiary); margin: 1rem 0 0.1rem; padding-top: 0.9rem; border-top: 0.5px solid var(--border); }

  /* goal toggle */
  .goal-box { margin-top: 2rem; padding: 1.1rem 1.1rem 1.2rem; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); }
  .goal-box h2 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .goal-box p { font-size: 12.5px; color: var(--text-tertiary); margin-bottom: 0.9rem; }
  .goal-steps { display: flex; gap: 7px; flex-wrap: wrap; }
  .goal-step { font-family: var(--font-ui); font-size: 13px; font-weight: 500; min-width: 44px; padding: 7px 12px;
    border-radius: var(--radius-sm); border: 0.5px solid var(--border-strong); background: var(--surface);
    color: var(--text-secondary); cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .goal-step:hover:not([disabled]):not(.active) { border-color: var(--accent); color: var(--accent); }
  .goal-step.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .goal-step[disabled] { opacity: 0.4; cursor: default; }

  /* reset */
  .reset-box { margin-top: 1.75rem; padding-top: 1.25rem; border-top: 0.5px solid var(--border); }

  /* login box (logged out) */
  .login-box { max-width: 360px; margin: 1rem auto 0; text-align: center; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.75rem 1.5rem; }
  .login-btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; padding: 11px 18px; }

  /* modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,16,48,0.45); display: flex; align-items: center; justify-content: center; padding: 1.25rem; z-index: 1000; }
  .modal-card { background: var(--surface); border-radius: var(--radius-lg); max-width: 400px; width: 100%; padding: 1.5rem 1.5rem 1.35rem; box-shadow: 0 12px 40px rgba(0,0,0,0.2); }
  .modal-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 0.5rem; }
  .modal-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 1rem; line-height: 1.55; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions .btn { flex: 1; text-align: center; }

  @media (max-width: 600px) {
    .page-wrap { padding: 2rem 1rem 3rem; }
    .prog-head-title { font-size: 21px; }
  }
</style>
</head>
<body>

<!-- Top nav comes from the shared nav.js (do NOT inline it). -->
<div id="site-nav-root" style="min-height:54px;background:var(--surface);border-bottom:0.5px solid var(--border)"></div>

<div class="page-wrap">
  <div class="acct-eyebrow">ThaiEar</div>
  <div id="progress-root"><p class="muted">Loading…</p></div>
</div>

<script>
var PERSON_SVG =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>';

// Padlock for a locked "Go to topic" button (matches the index/nav padlock style).
var LOCK_SVG =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function bare(f) { return String(f || '').toLowerCase().replace(/\.html$/, ''); }

// The live topics, in display order, flattened so split topics (e.g. Food & drink 1/2)
// show as their own rows — exactly the pages that have audio. Built from topics.js so
// it stays in lockstep with the index grid; no second list to maintain.
function liveRows() {
  var T = window.ThaiEarTopics;
  if (!T) return [];
  // topics.js's liveSequence() already IS "every live, playable page in display order, split
  // parts as their own entries, tier resolved" — which is exactly this list. Using it directly
  // (instead of re-flattening t.parts here) means the progress page, the sentences page, the
  // index grid and the player's prev/next all read one function and can't drift apart.
  return T.liveSequence().map(function (u) {
    return { key: bare(u.page), name: u.name, page: u.page, access: u.access };
  });
}
function maxOf(topics) { var m = 0; for (var k in topics) { if (topics[k] > m) m = topics[k]; } return m; }

// On-brand confirmation modal (matches account.html).
function showModal(opts) {
  var ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML =
    '<div class="modal-card" role="dialog" aria-modal="true">' +
      '<h2>' + esc(opts.title) + '</h2>' +
      '<p>' + (opts.body || '') + '</p>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-ghost" id="modal-cancel">' + esc(opts.cancelText || 'Cancel') + '</button>' +
        '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" id="modal-ok">' + esc(opts.confirmText || 'Confirm') + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
  function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); }
  ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
  ov.querySelector('#modal-cancel').addEventListener('click', close);
  ov.querySelector('#modal-ok').addEventListener('click', function () { close(); opts.onConfirm(); });
}

// Filter pills (All / Premium / Member / Non-member / Playlists) — a pure DOM show/hide over the
// already-rendered rows, never a re-render, so real per-row progress state (built from `data` at
// render time, not held in the DOM) is never at risk. progFilter persists across re-renders (goal
// change, reset, auth refresh) and is reapplied at the end of render() so the chosen pill sticks.
var progFilter = 'all';
function applyProgFilter(f) {
  progFilter = f;
  var tabs = document.querySelectorAll('#prog-tabs .filter-tab');
  if (!tabs.length) return;
  tabs.forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-f') === f); });
  document.querySelectorAll('#prog-list [data-tier]').forEach(function (el) {
    var tier = el.getAttribute('data-tier');
    var show = f === 'all' ? true
      : f === 'playlist' ? (tier === 'playlist' || tier === 'playlist-head')
      : tier === f;
    el.style.display = show ? '' : 'none';
  });
}
document.addEventListener('click', function (e) {
  var t = e.target.closest && e.target.closest('.filter-tab');
  if (t) applyProgFilter(t.getAttribute('data-f'));
  // r136a: the collapsible intro's Read more / Show less (delegated — survives re-renders).
  // r140: and the state is now HOISTED out of the DOM, so a later render() cannot discard it.
  var m = e.target.closest && e.target.closest('.prog-intro-more');
  if (m) {
    var w = m.parentNode;
    introOpen = w.classList.toggle('open');
    m.textContent = introOpen ? 'Show less' : 'Read more';
  }
});

// Playlists section (bottom of the list, under a "Playlists" divider). Real data via
// ThaiEarAuth.playlists: load(force) resolves [{id,name,items:[...]}.], get() reads the resolved
// cache, peek() reads the localStorage copy synchronously (instant paint before load() resolves) —
// same pattern playlists.html uses. Kicked from the thaiear:auth handler below, not from render()
// itself, so goal/reset re-renders never trigger a refetch.
function refreshPlaylists() {
  var a = window.ThaiEarAuth;
  if (!a || !a.playlists) return;
  a.playlists.load(true).then(render).catch(function () { render(); });
}

function setGoalTo(step) {
  var a = window.ThaiEarAuth;
  if (!a || !a.setProgressGoal) return;
  a.setProgressGoal(step).then(render).catch(function (e) { console.warn('goal save failed', e); });
}
function resetAll() {
  var a = window.ThaiEarAuth;
  if (!a || !a.resetProgress) return;
  showModal({
    title: 'Reset all progress?',
    body: 'This clears every topic’s tally back to zero. This cannot be undone.',
    confirmText: 'Reset everything', cancelText: 'Keep my progress', danger: true,
    onConfirm: function () {
      a.resetProgress().then(render).catch(function (e) { console.warn('reset failed', e); });
    }
  });
}

function loggedOutHtml() {
  return (
    '<h1 class="prog-head-title" style="margin-bottom:1rem">Your progress</h1>' +
    '<div class="login-box">' +
      '<p style="margin-bottom:1.2rem">Sign in to track how many times you’ve listened to each topic and watch your progress bars fill up.</p>' +
      '<button class="btn btn-primary login-btn" onclick="ThaiEarAuth.signInWithGoogle()">Continue with Google</button>' +
      '<p class="muted" style="margin-top:0.9rem">Prefer email? <a href="account.html" style="color:var(--accent);text-decoration:none;font-weight:500">Sign in here →</a></p>' +
    '</div>'
  );
}

var loadErr = null;
// r140: the intro's expanded state, held OUTSIDE the DOM so render() can restore it — see the
// note where `intro` is built. Module-scope on purpose: render() is called from several places.
var introOpen = false;

/* r141 — REUSE THE IMAGE NODE ACROSS RENDERS.
   render() rebuilds this page by assigning root.innerHTML, which DESTROYS the old <img> and
   creates a fresh one. A brand-new <img> has nothing decoded yet, so it paints empty for a frame
   or two before the picture appears — and render() runs several times on a normal load (initial,
   again when loadProgress()/loadFlags() resolves, again when playlists.load() resolves, again on
   the thaiear:auth event). Two to four rebuilds = the two or three pulses the owner sees. It only
   shows on a COLD load: once the bitmap is warm the re-decode is instant, which is why it is not
   reproducible by poking at an already-open page.
   Keeping ONE element alive and moving it back in after each rebuild fixes it outright: a detached
   node holds its decoded bitmap, and re-inserting it neither re-fetches nor re-decodes. The markup
   emits a placeholder that this swaps for the real node, so the DOM shape is unchanged.
   ⚠ Do NOT "simplify" this back to an <img> tag in the template string — that IS the bug. */
var fluencyImgNode = null;
function mountFluencyImg() {
  var slot = document.getElementById('fluency-slot');
  if (!slot) return;                       // a loading/empty state that has no image — nothing to do
  if (!fluencyImgNode) {
    fluencyImgNode = document.createElement('img');
    fluencyImgNode.className = 'fluency-img';
    fluencyImgNode.src = 'yak.png';
    fluencyImgNode.alt = 'Thai guardian yak';
    fluencyImgNode.width = 200; fluencyImgNode.height = 260;   // keep the CLS reserve the attributes gave
  }
  slot.parentNode.replaceChild(fluencyImgNode, slot);
}

function render() {
  var root = document.getElementById('progress-root');
  if (!root) return;
  var a = window.ThaiEarAuth;
  if (!a || !a.isReady) { root.innerHTML = '<p class="muted">Loading…</p>'; return; }
  var user = a.getUser && a.getUser();
  if (!user) { root.innerHTML = loggedOutHtml(); return; }
  if (a.isProgressLoaded && !a.isProgressLoaded()) {
    // Show the real error instead of re-trying forever (avoids hammering the API).
    if (loadErr) {
      root.innerHTML = '<p class="muted">Couldn’t load your progress: ' +
        esc((loadErr && loadErr.message) || String(loadErr)) +
        '. Please refresh to try again.</p>';
      return;
    }
    root.innerHTML = '<p class="muted">Loading your progress…</p>';
    a.loadProgress().then(function () { loadErr = null; render(); })
                    .catch(function (e) { loadErr = e; render(); });
    return;
  }

  var data = (a.getProgressData && a.getProgressData()) || { goal: 5, topics: {} };
  var goal = data.goal || 5;
  var topics = data.topics || {};
  var rows = liveRows();
  // In the app, a premium-locked "Go to topic" opens the page (navigable preview) instead of steering
  // to subscribe.html (reader-app compliance). On the web it still routes to subscribe.
  var native = !!(a && a.isNative && a.isNative());

  var head =
    '<div class="prog-head">' +
      '<span class="prog-head-icon' + (a.isSubscribed && a.isSubscribed() ? ' premium-user' : '') + '">' + PERSON_SVG + '</span>' +
      '<h1 class="prog-head-title">' + esc(user.username) + '’s progress</h1>' +
    '</div>';

  /* r140 — the open/closed state comes from `introOpen`, NOT from whatever class happens to be on
     the node right now. render() rebuilds this markup, and it runs several times on a normal page
     load (initial, then again after loadProgress() and after playlists.load(), both network round
     trips). Any expansion the user made in that window was silently thrown away and the intro
     snapped shut — the owner's "it collapses a few times before it stays expanded", and precisely
     why waiting a few seconds before clicking made it behave. r136a made the HANDLER delegated so
     it survives re-renders; the STATE still had to survive them too. */
  var intro =
    '<div class="prog-intro-wrap' + (introOpen ? ' open' : '') + '"><p class="prog-intro">' +
    'This page is designed as a tool for you to track your learning. ' +
    'We recommend each time you listen to a topic or playlist in full to add <strong>“one progress”</strong> — ' +
    'this is found above the Dynamic mp3 player. Over time you can see which topics and playlists you know well and ' +
    'which need more attention. Change your progress goal or reset your progress at any time.</p>' +
    '<button type="button" class="prog-intro-more">' + (introOpen ? 'Show less' : 'Read more') + '</button></div>';

  var fluency =
    '<div class="fluency-block">' +
      '<span id="fluency-slot"></span>' +   // r141: replaced with the reused <img> after render
      '<div class="fluency-text">Fluency loading<span class="dots" aria-hidden="true"></span></div>' +
    '</div>';

  var tabs =
    '<div class="prog-tabs-box">' +
      '<div class="filter-tabs" id="prog-tabs">' +
        '<button class="filter-tab active" data-f="all" type="button">All</button>' +
        '<button class="filter-tab tab-premium" data-f="premium" type="button">Premium</button>' +
        '<button class="filter-tab" data-f="member" type="button">Member</button>' +
        '<button class="filter-tab tab-free" data-f="free" type="button">Non-member</button>' +
        '<button class="filter-tab" data-f="playlist" type="button">Playlists</button>' +
      '</div>' +
    '</div>';

  // Playlists section — always at the bottom of the list under a quiet "Playlists" divider,
  // shown for both the All and Playlists filters (data-tier="playlist"/"playlist-head").
  function plHtml() {
    var pl = (a.playlists && (a.playlists.get() || a.playlists.peek())) || [];
    /* r140 — PLAYLISTS NOW CARRY A REAL TALLY, like topics. These rows already existed but showed
       only "N sentences": the playlist player had no progress card, so there was never a count to
       show. It has one now, keyed 'pl-<id>' (player.js progressKey) in the same free-form
       progress.topics map topics use — so the same `topics[key]`, the same goal and the same bar
       apply here with no new plumbing.
       The sentence count moves under the bar rather than being dropped: it is the only place a
       playlist's size is visible on this page, and the top-right slot is now the tally, exactly as
       on a topic row. */
    var rowsHtml = pl.length ? pl.map(function (p) {
      var n = (p.items || []).length;
      var phref = 'playlists.html?pl=' + encodeURIComponent(p.id);
      var pc = topics['pl-' + p.id] || 0;
      var ppct = goal ? Math.min(100, Math.round((pc / goal) * 100)) : 0;
      var pfull = pc >= goal ? ' full' : '';
      return '<div class="prog-row" data-tier="playlist">' +
        '<div class="prog-row-top">' +
          '<span class="prog-name-wrap">' +
            '<span class="prog-name"><a href="' + phref + '">' + esc(p.name) + '</a></span>' +
            '<a class="prog-goto" href="' + phref + '">Open playlist</a>' +
          '</span>' +
          '<span class="prog-num">' + pc + ' / ' + goal + '</span>' +
        '</div>' +
        '<div class="prog-bar"><div class="prog-bar-fill' + pfull + '" style="width:' + ppct + '%"></div></div>' +
        '<div class="prog-plcount">' + n + ' sentence' + (n === 1 ? '' : 's') + '</div>' +
      '</div>';
    }).join('') : '<p class="muted" data-tier="playlist" style="padding:0.2rem 0.1rem 0.4rem">No playlists yet — add sentences from any topic page.</p>';
    return '<div class="prog-sub" data-tier="playlist-head">Playlists</div>' + rowsHtml;
  }

  var T = window.ThaiEarTopics;
  var list = '<div class="prog-list" id="prog-list">' + rows.map(function (r) {
    var c = topics[r.key] || 0;
    var pct = goal ? Math.min(100, Math.round((c / goal) * 100)) : 0;
    var full = c >= goal ? ' full' : '';

    // Same gating as the index cards: free or entitled → the topic page; otherwise
    // route to the right gate (premium → subscribe, member → join) and show a padlock.
    // Both the title link and the "Go to topic" button use this one destination.
    var access = r.access || 'free';
    var canOpen = !T || access === 'free' || (T.canAccess && T.canAccess(access));
    // Tier class on EVERY premium/member row (not only locked ones) so the "Go to topic" text
    // is gold for premium even when the visitor can open it. The lock span is still locked-only.
    var btnCls = 'prog-goto' + (access === 'premium' ? ' premium' : access === 'member' ? ' member' : '');
    var rowCls = 'prog-row' + (access === 'premium' ? ' premium' : access === 'member' ? ' member' : '');
    var href, lock = '';
    if (canOpen) {
      href = r.page;
    } else if (access === 'premium') {
      href = native ? r.page : 'subscribe.html';
      lock = '<span class="lock">' + LOCK_SVG + '</span>';
    } else {
      href = 'join.html?next=' + encodeURIComponent(r.page);
      lock = '<span class="lock">' + LOCK_SVG + '</span>';
    }

    return '<div class="' + rowCls + '" data-tier="' + access + '">' +
      '<div class="prog-row-top">' +
        '<span class="prog-name-wrap">' +
          '<span class="prog-name"><a href="' + href + '">' + esc(r.name) + '</a></span>' +
          '<a class="' + btnCls + '" href="' + href + '">' + lock + 'Go to topic</a>' +
        '</span>' +
        '<span class="prog-num">' + c + ' / ' + goal + '</span>' +
      '</div>' +
      '<div class="prog-bar"><div class="prog-bar-fill' + full + '" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }).join('') + plHtml() + '</div>';

  // Goal toggle — a step is disabled when it sits below your highest tally (a bar
  // must never overflow), exactly mirroring setProgressGoal's clamp in auth.js.
  var steps = (a.progressGoalSteps && a.progressGoalSteps()) || [5, 10, 20, 50, 100];
  var mc = maxOf(topics);
  var minStep = steps.filter(function (s) { return s >= mc; })[0] || steps[steps.length - 1];
  var toggle =
    '<div class="goal-box">' +
      '<h2>Goal per topic</h2>' +
      '<p>How many complete listens fills a bar. Raises automatically as you pass it.</p>' +
      '<div class="goal-steps">' +
        steps.map(function (s) {
          var disabled = s < minStep ? ' disabled' : '';
          var active = s === goal ? ' active' : '';
          return '<button class="goal-step' + active + '"' + disabled + ' onclick="setGoalTo(' + s + ')">' + s + '</button>';
        }).join('') +
      '</div>' +
    '</div>';

  var reset =
    '<div class="reset-box">' +
      '<button class="btn btn-ghost" onclick="resetAll()" style="font-size:13px;color:#B00020;border-color:rgba(176,0,32,0.35)">Reset all progress</button>' +
    '</div>';

  root.innerHTML = head + intro + fluency + tabs + list + toggle + reset;
  mountFluencyImg();                       // r141: move the ONE <img> back in — never re-created
  applyProgFilter(progFilter);   // reapply the chosen pill to the freshly-built rows (display only)
}

// On any auth change (login/logout/token refresh) clear a prior load error, refresh playlists
// (real data — see refreshPlaylists above) and re-render.
window.addEventListener('thaiear:auth', function () { loadErr = null; refreshPlaylists(); render(); });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
else render();
</script>
<script src="topics.js" defer></script>
<script src="nav.js" defer></script>
</body>
</html>
