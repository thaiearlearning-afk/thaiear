<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1A1A1A; --text-secondary: #5A5A5A; --text-tertiary: #9A9A9A;
    --accent: #4B41AD; --accent-light: #EEEDFE; --accent-mid: #534AB7;
    --gold: #F0CC5C; --gold-dark: #C8A030; --purple-mid: #7F77DD;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font-ui: 'Inter', system-ui, sans-serif; --font-thai: 'Sarabun', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
  .page-wrap { max-width: 640px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
  .acct-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

  /* header: person icon + "Name's progress" */
  .prog-head { display: flex; align-items: center; gap: 12px; margin-bottom: 1.75rem; }
  .prog-head-icon { flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; background: var(--accent-light); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; }
  .prog-head-icon svg { width: 24px; height: 24px; }
  .prog-head-title { font-size: 25px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; color: #1C124E; }

  .btn { font-family: var(--font-ui); font-size: 14px; font-weight: 500; border-radius: var(--radius-sm); padding: 9px 18px; cursor: pointer; border: 0.5px solid var(--border-strong); transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-mid); }
  .btn-ghost { background: var(--surface); color: var(--text-secondary); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: #B00020; color: #fff; border-color: #B00020; }
  .btn-danger:hover { background: #8a0019; }
  .muted { font-size: 13px; color: var(--text-tertiary); }

  /* intro blurb */
  .prog-intro { font-size: 13.5px; color: var(--text-secondary); line-height: 1.65; margin-bottom: 1.5rem;
    padding: 0.9rem 1.1rem; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-md); }
  .prog-intro strong { color: var(--text-primary); font-weight: 500; }

  /* meditator + "Fluency loading…" with an animated 1→2→3 dot cycle (pure CSS, no JS) */
  .fluency-block { text-align: center; margin: 0.25rem 0 1.75rem; }
  .fluency-img { width: 150px; max-width: 42%; height: auto; display: block; margin: 0 auto 0.4rem; }
  .fluency-text { font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: 0.02em; }
  /* fixed-width dots so the text never jitters as they cycle */
  .fluency-text .dots { display: inline-block; width: 1.1em; text-align: left; }
  /* Type the ellipsis one full stop at a time by revealing WIDTH (not `content`, which the app webview
     can't animate). steps(3, start) shows 1 → 2 → 3 dots; the opacity test proved the webview animates,
     so the earlier freeze was prefers-reduced-motion / jump-none — both removed here. */
  .fluency-text .dots::after {
    content: '...'; display: inline-block; width: 0; overflow: hidden;
    vertical-align: bottom; animation: fluency-dots 1.5s steps(3, start) infinite;
  }
  @keyframes fluency-dots { from { width: 0; } to { width: 1.05em; } }

  /* progress rows + bars */
  .prog-list { display: flex; flex-direction: column; gap: 0.85rem; }
  .prog-row { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 0.85rem 1rem; }
  .prog-row-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 0.55rem; }
  .prog-name-wrap { display: flex; align-items: center; gap: 9px; min-width: 0; flex-wrap: wrap; }
  .prog-name { font-size: 14px; font-weight: 500; }
  .prog-name a { color: var(--text-primary); text-decoration: none; }
  .prog-name a:hover { color: var(--accent); }
  .prog-goto { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; font-family: var(--font-ui); font-size: 11.5px; font-weight: 500; color: var(--accent); text-decoration: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); padding: 3px 9px; white-space: nowrap; transition: background 0.15s, border-color 0.15s; }
  .prog-goto:hover { background: var(--accent-light); border-color: var(--accent); }
  .prog-goto .lock { display: inline-flex; }
  .prog-goto .lock svg { width: 10px; height: 10px; }
  .prog-goto.premium .lock { color: var(--gold-dark); }
  .prog-goto.member .lock { color: var(--accent); }
  .prog-num { font-size: 12.5px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .prog-bar { width: 100%; height: 9px; background: var(--bg); border: 0.5px solid var(--border); border-radius: 6px; overflow: hidden; }
  .prog-bar-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 6px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
  .prog-bar-fill.full { background: linear-gradient(90deg, var(--accent), var(--purple-mid)); }

  /* goal toggle */
  .goal-box { margin-top: 2rem; padding: 1.1rem 1.1rem 1.2rem; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); }
  .goal-box h2 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .goal-box p { font-size: 12.5px; color: var(--text-tertiary); margin-bottom: 0.9rem; }
  .goal-steps { display: flex; gap: 7px; flex-wrap: wrap; }
  .goal-step { font-family: var(--font-ui); font-size: 13px; font-weight: 500; min-width: 44px; padding: 7px 12px;
    border-radius: var(--radius-sm); border: 0.5px solid var(--border-strong); background: var(--surface);
    color: var(--text-secondary); cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .goal-step:hover:not([disabled]):not(.active) { border-color: var(--accent); color: var(--accent); }
  .goal-step.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .goal-step[disabled] { opacity: 0.4; cursor: default; }

  /* reset */
  .reset-box { margin-top: 1.75rem; padding-top: 1.25rem; border-top: 0.5px solid var(--border); }

  /* login box (logged out) */
  .login-box { max-width: 360px; margin: 1rem auto 0; text-align: center; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.75rem 1.5rem; }
  .login-btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; padding: 11px 18px; }

  /* modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,16,48,0.45); display: flex; align-items: center; justify-content: center; padding: 1.25rem; z-index: 1000; }
  .modal-card { background: var(--surface); border-radius: var(--radius-lg); max-width: 400px; width: 100%; padding: 1.5rem 1.5rem 1.35rem; box-shadow: 0 12px 40px rgba(0,0,0,0.2); }
  .modal-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 0.5rem; }
  .modal-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 1rem; line-height: 1.55; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions .btn { flex: 1; text-align: center; }

  @media (max-width: 600px) {
    .page-wrap { padding: 2rem 1rem 3rem; }
    .prog-head-title { font-size: 21px; }
  }
</style>
</head>
<body>

<!-- Top nav comes from the shared nav.js (do NOT inline it). -->
<div id="site-nav-root" style="min-height:54px;background:var(--surface);border-bottom:0.5px solid var(--border)"></div>

<div class="page-wrap">
  <div class="acct-eyebrow">ThaiEar</div>
  <div id="progress-root"><p class="muted">Loading…</p></div>
</div>

<script>
var PERSON_SVG =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>';

// Padlock for a locked "Go to topic" button (matches the index/nav padlock style).
var LOCK_SVG =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function bare(f) { return String(f || '').toLowerCase().replace(/\.html$/, ''); }

// The live topics, in display order, flattened so split topics (e.g. Food & drink 1/2)
// show as their own rows — exactly the pages that have audio. Built from topics.js so
// it stays in lockstep with the index grid; no second list to maintain.
function liveRows() {
  var T = window.ThaiEarTopics;
  if (!T) return [];
  var rows = [];
  T.topics.forEach(function (t) {
    if (t.parts) {
      t.parts.forEach(function (part) {
        if (part && typeof part === 'object' && part.page) {
          // A split part uses its OWN access tier when set (member first part, premium rest),
          // else the parent topic's — same rule as the index grid (accessFor in topics.js).
          rows.push({ key: bare(part.page), name: part.name || t.name, page: part.page, access: T.accessFor(t, part) });
        }
      });
    } else if (T.liveTopics[t.id]) {
      rows.push({ key: bare(T.liveTopics[t.id]), name: t.name, page: T.liveTopics[t.id], access: t.access || 'free' });
    }
  });
  return rows;
}
function maxOf(topics) { var m = 0; for (var k in topics) { if (topics[k] > m) m = topics[k]; } return m; }

// On-brand confirmation modal (matches account.html).
function showModal(opts) {
  var ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML =
    '<div class="modal-card" role="dialog" aria-modal="true">' +
      '<h2>' + esc(opts.title) + '</h2>' +
      '<p>' + (opts.body || '') + '</p>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-ghost" id="modal-cancel">' + esc(opts.cancelText || 'Cancel') + '</button>' +
        '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" id="modal-ok">' + esc(opts.confirmText || 'Confirm') + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
  function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); }
  ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
  ov.querySelector('#modal-cancel').addEventListener('click', close);
  ov.querySelector('#modal-ok').addEventListener('click', function () { close(); opts.onConfirm(); });
}

function setGoalTo(step) {
  var a = window.ThaiEarAuth;
  if (!a || !a.setProgressGoal) return;
  a.setProgressGoal(step).then(render).catch(function (e) { console.warn('goal save failed', e); });
}
function resetAll() {
  var a = window.ThaiEarAuth;
  if (!a || !a.resetProgress) return;
  showModal({
    title: 'Reset all progress?',
    body: 'This clears every topic’s tally back to zero. This cannot be undone.',
    confirmText: 'Reset everything', cancelText: 'Keep my progress', danger: true,
    onConfirm: function () {
      a.resetProgress().then(render).catch(function (e) { console.warn('reset failed', e); });
    }
  });
}

function loggedOutHtml() {
  return (
    '<h1 class="prog-head-title" style="margin-bottom:1rem">Your progress</h1>' +
    '<div class="login-box">' +
      '<p style="margin-bottom:1.2rem">Sign in to track how many times you’ve listened to each topic and watch your progress bars fill up.</p>' +
      '<button class="btn btn-primary login-btn" onclick="ThaiEarAuth.signInWithGoogle()">Continue with Google</button>' +
      '<p class="muted" style="margin-top:0.9rem">Prefer email? <a href="account.html" style="color:var(--accent);text-decoration:none;font-weight:500">Sign in here →</a></p>' +
    '</div>'
  );
}

var loadErr = null;
function render() {
  var root = document.getElementById('progress-root');
  if (!root) return;
  var a = window.ThaiEarAuth;
  if (!a || !a.isReady) { root.innerHTML = '<p class="muted">Loading…</p>'; return; }
  var user = a.getUser && a.getUser();
  if (!user) { root.innerHTML = loggedOutHtml(); return; }
  if (a.isProgressLoaded && !a.isProgressLoaded()) {
    // Show the real error instead of re-trying forever (avoids hammering the API).
    if (loadErr) {
      root.innerHTML = '<p class="muted">Couldn’t load your progress: ' +
        esc((loadErr && loadErr.message) || String(loadErr)) +
        '. Please refresh to try again.</p>';
      return;
    }
    root.innerHTML = '<p class="muted">Loading your progress…</p>';
    a.loadProgress().then(function () { loadErr = null; render(); })
                    .catch(function (e) { loadErr = e; render(); });
    return;
  }

  var data = (a.getProgressData && a.getProgressData()) || { goal: 5, topics: {} };
  var goal = data.goal || 5;
  var topics = data.topics || {};
  var rows = liveRows();

  var head =
    '<div class="prog-head">' +
      '<span class="prog-head-icon">' + PERSON_SVG + '</span>' +
      '<h1 class="prog-head-title">' + esc(user.username) + '’s progress</h1>' +
    '</div>';

  var intro =
    '<p class="prog-intro">This page is designed as a tool for you to track your progress. ' +
    'We recommend each time you listen to a topic in full to add <strong>“one progress”</strong> to that topic — ' +
    'this is found above the mp3 player. Over time you can see which topics you know well and which topics need more ' +
    'attention. Change your progress goal or reset your progress at any time. After 3 to 5 complete listens of a topic, ' +
    'consider listening to it English-first. Practising producing the Thai yourself will build confidence and fluency.</p>';

  var fluency =
    '<div class="fluency-block">' +
      '<img class="fluency-img" src="meditator.png" alt="Meditating learner" width="150">' +
      '<div class="fluency-text">Fluency loading<span class="dots" aria-hidden="true"></span></div>' +
    '</div>';

  var T = window.ThaiEarTopics;
  var list = '<div class="prog-list">' + rows.map(function (r) {
    var c = topics[r.key] || 0;
    var pct = goal ? Math.min(100, Math.round((c / goal) * 100)) : 0;
    var full = c >= goal ? ' full' : '';

    // Same gating as the index cards: free or entitled → the topic page; otherwise
    // route to the right gate (premium → subscribe, member → join) and show a padlock.
    // Both the title link and the "Go to topic" button use this one destination.
    var access = r.access || 'free';
    var canOpen = !T || access === 'free' || (T.canAccess && T.canAccess(access));
    var href, btnCls = 'prog-goto', lock = '';
    if (canOpen) {
      href = r.page;
    } else if (access === 'premium') {
      href = 'subscribe.html'; btnCls += ' premium';
      lock = '<span class="lock">' + LOCK_SVG + '</span>';
    } else {
      href = 'join.html?next=' + encodeURIComponent(r.page); btnCls += ' member';
      lock = '<span class="lock">' + LOCK_SVG + '</span>';
    }

    return '<div class="prog-row">' +
      '<div class="prog-row-top">' +
        '<span class="prog-name-wrap">' +
          '<span class="prog-name"><a href="' + href + '">' + esc(r.name) + '</a></span>' +
          '<a class="' + btnCls + '" href="' + href + '">' + lock + 'Go to topic</a>' +
        '</span>' +
        '<span class="prog-num">' + c + ' / ' + goal + '</span>' +
      '</div>' +
      '<div class="prog-bar"><div class="prog-bar-fill' + full + '" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }).join('') + '</div>';

  // Goal toggle — a step is disabled when it sits below your highest tally (a bar
  // must never overflow), exactly mirroring setProgressGoal's clamp in auth.js.
  var steps = (a.progressGoalSteps && a.progressGoalSteps()) || [5, 10, 20, 50, 100];
  var mc = maxOf(topics);
  var minStep = steps.filter(function (s) { return s >= mc; })[0] || steps[steps.length - 1];
  var toggle =
    '<div class="goal-box">' +
      '<h2>Goal per topic</h2>' +
      '<p>How many complete listens fills a bar. Raises automatically as you pass it.</p>' +
      '<div class="goal-steps">' +
        steps.map(function (s) {
          var disabled = s < minStep ? ' disabled' : '';
          var active = s === goal ? ' active' : '';
          return '<button class="goal-step' + active + '"' + disabled + ' onclick="setGoalTo(' + s + ')">' + s + '</button>';
        }).join('') +
      '</div>' +
    '</div>';

  var reset =
    '<div class="reset-box">' +
      '<button class="btn btn-ghost" onclick="resetAll()" style="font-size:13px;color:#B00020;border-color:rgba(176,0,32,0.35)">Reset all progress</button>' +
    '</div>';

  root.innerHTML = head + intro + fluency + list + toggle + reset;
}

// On any auth change (login/logout/token refresh) clear a prior load error and re-render.
window.addEventListener('thaiear:auth', function () { loadErr = null; render(); });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
else render();
</script>
