<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1A1A1A; --text-secondary: #5A5A5A; --text-tertiary: #9A9A9A;
    --accent: #261B65; --accent-light: #ECEBFA; --accent-mid: #342682;
    --gold: #F0CC5C; --gold-dark: #C8A030; --purple-mid: #7F77DD;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font-ui: 'Inter', system-ui, sans-serif; --font-thai: 'Sarabun', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }

  /* ⚠ RESTORED. This rule was lost when the page was assembled from the archived shell — the
     extract stopped one line short of it, so the whole page rendered flush to the viewport edge
     with no column at all. Nothing in the DOM was missing; it just had no width. Caught by looking
     at the live page, which was the only way it was going to be caught. */
  /* ⚠ THE SIDE padding is px, not rem: a rem gutter inflates under Android textZoom and at
     320@2.0× it takes 96px of a 320px viewport before anything on the page gets a pixel
     (TEXT_SCALING.md §1). 24px is 1.5rem at the default root, so nothing moves at default size.
     The vertical rem values are left alone - vertical space may grow with the text. */
  .page-wrap { max-width: 640px; margin: 0 auto; padding: 3rem 24px 4rem; }

  /* ── the yak + "Fluency loading…" (carried over from the retired page, 2026-08-20) ────────
     Pure CSS dot cycle, no JS. */
  .fluency-block { text-align: center; margin: 0 0 1.5rem; }
  .fluency-img { width: 195px; max-width: 55%; height: auto; display: block; margin: 0 auto 0.4rem; }
  .fluency-text { font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: 0.02em; }
  /* fixed-width dots so the text never jitters as they cycle */
  .fluency-text .dots { display: inline-block; width: 1.1em; text-align: left; }
  /* ⚠ Reveal WIDTH, not `content` — the app webview cannot animate `content`, which is what froze
     the original. steps(3, start) shows 1 → 2 → 3 dots. */
  .fluency-text .dots::after {
    content: '...'; display: inline-block; width: 0; overflow: hidden;
    vertical-align: bottom; animation: fluency-dots 1.5s steps(3, start) infinite;
  }
  @keyframes fluency-dots { from { width: 0; } to { width: 1.05em; } }

  /* Same eyebrow every other menu page carries above its title (about, socials, app). */
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  h1.prog-title { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 0.15rem; }
  .prog-sub { font-size: 13.5px; color: var(--text-tertiary); margin-bottom: 1.25rem; }

  /* ── the four headline figures ───────────────────────────────────────────────────────── */
  /* ⛔⛔ EVERY ROW IS THE HEIGHT OF THE TALLEST. Owner, 2026-09-22: "the 6 boxes at top of
     progress page ... match in row, but not between rows. all should take the tallest height so
     uniformity achieved."
     ⚠⚠ A GRID EQUALISES WITHIN A ROW AND NEVER ACROSS ROWS — the identical fact that made the
     topic cards uneven, and the identical fix (see .topic-grid in topics-page.css). A card with
     a note under it ("Best so far: 4", "85 of 114") is taller than one without, so row 2 or 3
     set their own height and the block read as three separate pairs.
     ⛔ A `min-height` reserve is NOT the alternative: it has to encode a line count, and the
     label wraps at a different width on every screen and again under OS text scaling. `1fr` asks
     the grid the question directly and needs no maintenance. */
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1.75rem;
    grid-auto-rows: 1fr; }
  .stat-card {
    background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    /* ⛔ A GRID ITEM IS FLOORED AT ITS MIN-CONTENT WIDTH. At large system text "sentences" alone
       is wider than half the page, so the `1fr` tracks grew to fit it and the two cards burst the
       viewport together - the identical fault, and the identical fix, as the quiz entry tiles. */
    min-width: 0;
    /* ⛔ px, NOT rem — a rem padding inflates under Android textZoom (TEXT_SCALING.md §1), and
       on a 2-column grid at 320px that is 64px of padding per side inside a ~123px column: the
       cards burst the page by 79px. ⚠ PRE-DATES THE QUIZ COLUMNS — found in the same 2026-09-22
       pass and fixed here because it is the same page, but it was never a quiz fault.
       14px/16px are the computed values at the default 16px root, so this is byte-identical at
       default size. */
    padding: 14px 16px;
  }
  .stat-val {
    font-size: 24px; font-weight: 600; color: var(--accent); line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .stat-lbl { font-size: 12px; color: var(--text-secondary); margin-top: 2px;
    /* ⚠ `anywhere`, so the LABEL can no longer size the grid track - see .stat-card above.
       It only ever breaks a word that genuinely does not fit the column. */
    overflow-wrap: anywhere; }
  .stat-note { font-size: 11.5px; color: var(--text-tertiary); margin-top: 3px; line-height: 1.45; }

  /* ── per-topic list ──────────────────────────────────────────────────────────────────── */
  h2.prog-h2 { font-size: 15px; font-weight: 600; margin: 0 0 0.15rem; }
  .prog-h2-note { font-size: 12.5px; color: var(--text-tertiary); margin-bottom: 0.9rem; }
  .prog-list { display: flex; flex-direction: column; gap: 1px; }
  .prog-row {
    display: flex; align-items: baseline; justify-content: space-between;
    /* ⚠ the column gap tightens with the cap — 12px at default size, ~7px at 2.0×, where the row
       is carrying a name, the minutes and four score cells on a 320px line and every px counts */
    gap: calc(12px * var(--te-ui, 1));
    background: var(--surface); border: 0.5px solid var(--border);
    /* ⛔ px, NOT rem — the row's own padding was the single biggest thing eating it under
       Android textZoom: 0.85rem is 27px a side at 2.0×, i.e. 54px of a 241px row, before the
       name, the minutes or the four quiz cells get anything. TEXT_SCALING.md §1: a padding that
       must not grow with the text goes in px. These are the computed values at the default 16px
       root, so the row is byte-identical at default size. */
    padding: 8px 14px; text-decoration: none; color: inherit;
  }
  .prog-row:first-child { border-radius: var(--radius-md) var(--radius-md) 0 0; }
  .prog-row:last-child  { border-radius: 0 0 var(--radius-md) var(--radius-md); }
  .prog-row:hover { border-color: var(--border-strong); }
  /* ⛔⛔ THE NAME TAKES ALL THE SLACK, AND THAT IS WHAT KEEPS THE OTHER COLUMNS STRAIGHT.
     Owner, 2026-09-22: "the minutes listening column is now no longer straight - if a unit
     title/ playlist title is shorter, the minutes are shifting left."
     ⚠ THE CAUSE WAS `justify-content: space-between` MEETING A THIRD CHILD. With two children
     it pins one left and one right, which is why this row was straight for months. The quiz cells
     made it three, and space-between then puts the MIDDLE child at
     `name + free/2` - so every character removed from a title moved the minutes half a character
     left. Nothing about the minutes changed; the row gained a sibling.
     ✅ With the name growing, the free space is all inside the name and the two right-hand
     columns are measured from the right edge. Do not reintroduce space-between here. */
  /* ⛔⛔ THE NAME TRUNCATES WITH AN ELLIPSIS — IT NEVER WRAPS, AND THAT IS WHAT KEEPS THE TWO
     RIGHT-HAND COLUMNS FIXED. Owner, 2026-09-22: "short topics have their listening time much
     closer to them, to the left of the four quiz results. they should be fixed in place on the
     right hand side ... 'Because & so...' is very long, and its listening time ends up being
     moved as well and sits on the second row!! I think if a name is too long it should be cut
     off with an ... after a certain number of characters."
     ⚠⚠ BOTH HALVES OF THAT REPORT ARE ONE CAUSE. The row is `flex-wrap: wrap` (it has to be —
     see the note on .prog-row-q), and a name allowed to wrap could push the minutes and the
     scores onto a second line. On a wrapped row the minutes then sit hard right instead of in
     their column, so the SHORT rows look wrong beside them even though the short rows never
     moved. Measured at 1265px: 111 rows aligned at exactly one x, and the two longest names
     wrapped.
     ✅ With `white-space: nowrap` + `min-width: 0` the name is the item that gives way — it
     shrinks and ellipses rather than forcing a line break, so a wrap can now only happen when
     the minutes and the four cells TOGETHER do not fit, which is the case the wrap exists for.
     ⛔ NOT a character count, though that is how it was asked for. A fixed cut is wrong at every
     width but one — it would clip a short name on a wide desktop and still overflow a phone.
     `text-overflow: ellipsis` cuts at exactly the space available, per width, for free.
     ⚠ All three properties are load-bearing: `overflow: hidden` is what makes `text-overflow`
     apply at all, and without `min-width: 0` a flex item cannot shrink below its content. */
  .prog-row-name {
    /* ⛔⛔ BASIS 0, NOT `auto`, AND THIS IS THE HALF THAT ACTUALLY STOPS THE WRAP.
       ⚠⚠ A FLEX LINE BREAKS ON THE BASE SIZE, BEFORE ANY SHRINKING HAPPENS. With `flex-basis:
       auto` the name's base size is its full text width, so a long name overflowed the line and
       the browser wrapped the minutes and the scores onto a second row — and `min-width: 0`,
       `nowrap` and the ellipsis were all powerless, because shrinking only ever applies WITHIN a
       line that has already been decided. Measured: the ellipsis rules alone left the same two
       rows wrapped and clipped nothing at all.
       ✅ A zero basis means the name contributes nothing to the line's size, so it can never
       force a break; `flex-grow: 1` still hands it every pixel of slack, which is what keeps the
       minutes and the scores measured from the right edge (the 2026-09-22 "columns must be
       straight" fix — that reasoning is unchanged, only the basis moves). */
    font-size: 13.5px; min-width: 0; flex: 1 1 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Same green as the index card and .reveal-all-btn on a premium topic — the one number on the
     row that is about the reader rather than about the topic. */
  /* ⚠ CAPPED, like the quiz cells beside it and for the same reason: this is a compact
     right-hand numeric column, not running text, and the row now carries FIVE such columns on a
     phone. Uncapped it reserved 4.9em of fully-inflated type and left the unit name nothing.
     ⚠ The WIDTH is in em so it tracks whatever the font ends up being - cap the font and the
     column follows, with no second number to keep in step. --te-ui is exactly 1 at default. */
  .prog-row-plays { font-size: calc(12.5px * var(--te-ui, 1)); font-weight: 500; color: #1F5D3A;
    white-space: nowrap;
    font-variant-numeric: tabular-nums; flex: 0 0 auto; width: 4.9em; text-align: right; }

  /* ── quiz best scores (QUIZ_GO_LIVE_PLAN.md §2.5) ──────────────────────────────────────
     ⛔⛔ HIDDEN UNTIL ThaiEarTopics.quizGate() SAYS OTHERWISE. The cells are rendered on every
     row and revealed by a single class on the root, so the gate costs no re-render and going
     public (§2.1) reaches this page through the same one constant as every other surface.
     ⚠ FOUR COLUMNS ON EVERY ROW, including the grammar and playlist rows that have no Vocab
     Trainer — owner, 2026-09-21: they keep the column and show a dash, so the columns stay
     ALIGNED down a page that interleaves both arms. A row with three cells would shunt the
     other three sideways and the page would read as ragged rather than as shorter.
     ⛔ The dash means "does not apply" here and "never tried" elsewhere. Both are honestly
     blank; 0% would be a lie in either — it reads as a failed attempt. */
  /* the quiz headline pair - revealed by the same one class as the columns, per CELL now that
     they are two cells of the one grid. ⚠ `display: none` removes a grid item from the layout
     entirely, so gated off the grid is four cells in two rows, exactly as before the pair
     existed - there is no empty row and no reserved space. */
  .stat-q { display: none; }
  .prog-q-on .stat-q { display: block; }
  /* ⛔ THE SEAM RULE IS GONE, AND DELIBERATELY SO. It set `margin-bottom: 10px` on the first
     of TWO grids to make the space between rows 2 and 3 match the grid's own gap. With one grid
     that space IS the gap, by construction, so the rule has nothing to do and a later reader
     would have had to work out why a margin was being overridden to a number that already
     matched. Owner's original report: "the two new boxes are far apart from the existing four -
     theres a gap - distance between the third row of two new additions should be the same as the
     distance between existing boxes." Still true; now true for free. */
  .prog-row-q { display: none; }
  /* ⛔⛔ `margin-left: auto` PLUS the wrap below, and the pair is what keeps the columns straight.
     At 320px with the system text at 200% the row simply cannot hold a name, the minutes and four
     score cells on one line — measured, with everything already capped and the name column
     collapsed to zero it still wants 257px of 241px. Every remaining lever is a freeze, and a
     freeze fails WCAG 1.4.4 (TEXT_SCALING.md §2). So the CELLS drop to a second line.
     ⚠ THEY DROP IDENTICALLY ON EVERY ROW, which is the only reason this is safe: .prog-row-q is
     a SINGLE flex child of fixed width, and the header carries the same three children at the
     same widths, so the header and all 113 rows wrap at the same point. A per-row decision would
     have made the page ragged, which is the fault the name-grows rule above exists to prevent.
     ⚠ The auto margin is what holds them RIGHT once wrapped — `space-between` puts a lone item on
     a wrapped line at the START, which would park the scores under the unit name. */
  .prog-q-on .prog-row-q { display: flex; gap: 7px; flex: 0 0 auto; margin-left: auto; }
  .prog-q-on .prog-row, .prog-q-on .prog-qhead { flex-wrap: wrap; }
  /* ⛔ ONE CELL WIDTH, IN px, SHARED BY THE ROWS AND THE HEADER.
     ⚠ It was `3.1em`, and em is relative to the ELEMENT's own font-size - so the header, which
     sets 10.5px against the rows' 12px, silently got a 32.6px cell against their 37.2px and the
     labels sat left of the numbers they label. A px variable cannot do that.
     ⚠ And the box fits "100%" with room to spare: a cell that has to grow for its content is a
     cell that shunts its neighbours, which is the other half of what the owner saw. */
  /* ⛔⛔ `var(--te-ui-raw) * var(--te-ui)` IS "GROW WITH THE TEXT, CAPPED" — their product is
     min(raw, 1.15), and it is exactly 1 at default size. The cell font is capped above, so it
     still grows ~15%; a box frozen in px then holds 37px of "100%" in 34px and clips it at both
     edges. The box and its text must move by the SAME factor or one of them is wrong, and this
     is the only expression that says so in one place. ⚠ Keep both vars — `--te-ui` alone would
     SHRINK the box, `--te-ui-raw` alone would grow it without the cap and reopen the overflow. */
  .prog-q-on .prog-row, .prog-q-on .prog-qhead {
    /* ⚠ TWO TERMS, AND THE SECOND ONE IS NOT PADDING-BY-FEEL. The first grows the box by
       exactly what the type grew by; the second is a measured cushion for the fact that the
       box's fit is NOT linear in font-size - a 38px box holds "100%" exactly at 12px, and at the
       capped 13.8px it needs ~41px, not 43.7. Both terms vanish at --te-grow: 1, so the cell is
       38px at default size to the pixel, which is the only thing that had to stay true. */
    --te-grow: calc(var(--te-ui-raw, 1) * var(--te-ui, 1));
    --pq-w: calc(38px * var(--te-grow) + (var(--te-grow) - 1) * 16px);
  }
  .pq-c {
    flex: 0 0 var(--pq-w, 38px); width: var(--pq-w, 38px);
    /* ✅ CENTRED, not right-aligned. Owner, 2026-09-22: "the one result i've got in the
       playlists section seems to not be centred on the '-' above and below it. its the rightmost
       column and its very close to the '-' to the left of it." Right-aligning put a one-character
       dash hard against the right edge of its box while a four-character score filled the box, so
       the two never shared a visual centre and the score appeared to crowd the dash beside it.
       Centring makes a dash and a score read as the same column. */
    /* ⛔⛔ THE CELL FONT IS CAPPED AT --te-ui, AND IT HAS TO BE, BECAUSE --pq-w IS px.
       The width is px on purpose (see the note above: an em cell drifted off its header). A px
       box holding text that inflates in full is the textZoom failure by construction — at
       320@2.0× "100%" rendered 65px inside a 34px cell, four cells over, and the row burst by
       66px with the name column already collapsed to zero. Capping the TYPE is what keeps the
       box honest; widening the box cannot work, because four inflated cells plus the minutes
       column exceed a 320px row whatever the name does.
       ⚠ --te-ui is exactly 1 at default size, so this is a no-op until the system text is
       raised, and it CAPS rather than freezes (TEXT_SCALING.md §2). The unit NAME and the
       minutes beside it scale in full — those are the numbers someone raised their text to
       read; this is a four-column score grid. */
    text-align: center; font-size: calc(12px * var(--te-ui, 1)); font-weight: 600;
    font-variant-numeric: tabular-nums; color: var(--accent);
  }
  /* the "never tried" / "does not apply" dash is quieter than a score — it is not a result */
  .pq-c.pq-none { color: var(--text-tertiary); font-weight: 500; }
  /* One header, at the top of the one list. ⚠ Not a <th>: .prog-row is a flex row, not a
     table, so the head is another flex row using the identical cell widths. */
  .prog-qhead { display: none; }
  .prog-q-on .prog-qhead {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;

<body>

<!-- Top nav comes from the shared nav.js (do NOT inline it). -->
<div id="site-nav-root" style="min-height:54px;background:var(--surface);border-bottom:0.5px solid var(--border)"></div>

<div class="page-wrap">
  <div id="prog-root"></div>
</div>

<script>
/* ============================================================
   progress.html — "<name>'s progress"

   Owning docs: PROGRESS_PAGE_SPEC.md (the design), PLAYS_COUNTER.md (the counter it displays).

   ⚠ THIS IS NOT THE OLD PROGRESS PAGE. The one retired on 2026-08-20 asked the user to tap
   "+ Add progress" and self-report. This one only reports what was measured. Nothing on it is
   editable except the reset.

   ⚠ SIGNED OUT IS A FIRST-CLASS STATE, NOT AN ERROR. Every figure reads 0 and the heading becomes
   "Sign in to track progress". A stranger should be able to see the SHAPE of the feature — that is
   most of the reason to sign up — so nothing is hidden and nothing throws.
   ============================================================ */
(function () {
  'use strict';

  var root = document.getElementById('prog-root');
  var A = function () { return window.ThaiEarAuth; };
  var T = function () { return window.ThaiEarTopics; };
  var durations = null;     // {num: seconds}, from clip-durations.json
  var sentNums = null;      // {page: [nums]}, from topic-sentences.json
  var quizResults = null;   // {unitKey: {quizId: {best, answered, correct}}}, from the quiz store
  var quizOn = false;       // ThaiEarTopics.quizGate() has said yes — the columns may show
  var painted = '';         // signature of what is on screen, so repeats are free

  /* ── formatting ─────────────────────────────────────────────────────────────────────────── */

  /* COMPACT: "10 min", "2h 5min", "1d 3h 6min". Rounded to the nearest minute.
     ⚠ THE FORMATTER MOVED TO topics.js (owner, 2026-08-22) and this is now a thin alias.
     It was local here while this was the only page showing a time; the topic cards and playlist
     rows now show one too, and for a few hours they carried a SECOND, spelled-out formatter
     ("2 hrs 5 mins") — so a row on this page and a card two clicks away disagreed about what an
     hour looks like. Owner: compact is better, make them uniform. One implementation, in the file
     both surfaces already load.
     The original reason for compactness still holds and is why the shared one is this shape: the
     spelled-out "0 days, 0 hours, 10 minutes" is three times the width of the other three stat
     figures and forced this card to span the row. Dropping leading zero units lets it sit in the
     same square as the rest, and a unit that is zero carries no information anyway.

     missing script can never render "undefined" where a number belongs. */

  }

  /* topic-sentences.json is keyed on the page name WITHOUT the .html, the same normalisation
     topics.js's bare() does. Kept local rather than exported: this is the only caller that holds
     the raw map instead of going through listenCaptionFor(). */
  function bareOf(page) { return String(page || '').toLowerCase().replace(/\.html$/, ''); }

  /* What to call them in the heading. identity.js decides first-name-vs-whole-name (a Google
     name is greeted by its first word, a name they typed on the account page is used whole), so
     this page and the home greeting cannot say two different things about one person.
     ⚠ ITS FALLBACK IS THE OPPOSITE OF THE HOME GREETING'S, deliberately: greetingName() returns
     '' rather than greet someone off their email prefix, but this heading would then read
     "'s progress", so here the prefix is better than nothing. */

     not this one. auth.getPlayReps() is the repetitions; auth.getPlays() is the passes. */

         why gen_clip_durations.js REFUSES to write when a live sentence is missing one — it would
         quietly make this figure read short. */

       per-playlist rows used to be a MINIMUM over the PASSES counter; they are now the same
       time sum as the headline card, so getPlays() is no longer read here at all. It is still
       recorded and still synced — nothing on the site displays it any more. */

    /* ⚠ ADD ANY NEW INPUT TO THIS SIGNATURE. It is what stops auth.js's several startup

               pls ? pls.length : -1,
               pls ? pls.map(function (p) { return p.id + ':' + (p.items ? p.items.length : 0); }).join(',') : '',

      '<h1 class="prog-title">' + heading + '</h1>' +
      '<p class="prog-sub">' + (user

        '<div class="fluency-text">Fluency loading<span class="dots" aria-hidden="true"></span></div>' +

        card(tot.listens.toLocaleString(), 'sentences listened to') +
        card(stats.daysListened, 'day' + (stats.daysListened === 1 ? '' : 's') + ' listened') +

        quizCards() +
      '</div>' +

      /* ⭐ THE QUIZ PAIR, A SECOND ROW OF THE SAME CARDS (owner, 2026-09-22: "can we add other
         boxes like this following the same format, below the existing and above 'your listening
         time'"). Same card() builder, so they cannot drift from the four above - the §9.1 rule
         that there is ONE renderer, applied here before the second copy exists rather than after.
         ⛔ HIDDEN BY THE SAME ONE CLASS AS THE COLUMNS. The arm is owner-gated, so these render
         on every load and are revealed by `prog-q-on` when quizGate() resolves - no re-render,

         surface. ⚠ It is a SEPARATE .stat-grid, not two more cells in the first: a 2-column grid
         with six cells would put the quiz pair alongside "days in a row", and the owner asked for

  /* ⛔⛔ THE EMPTY STATE IS AN EM DASH, NEVER 0% - the same rule the card strip carries

     when it means "you have not answered any", which on a newly shipped feature is everyone.
     ⚠ THE PERCENTAGE IS OVER QUESTIONS ANSWERED, NOT OVER QUESTIONS THAT EXIST. Someone who
     has answered 10 of 2,458 and got 9 right reads 90%, which is the honest reading of "quiz

    for (var k in all) {

  /* ⛔⛔ TWO MORE CELLS OF THE ONE GRID — NOT A SECOND GRID. Owner, 2026-09-22: "the 6 boxes

     height so uniformity achieved."
     ⚠⚠ AND THE REASON THEY WERE EVER SPLIT WAS A MISTAKE OF MINE, worth naming so it is not
     re-introduced: I wrote that "a 2-column grid with six cells would put the quiz pair alongside
     'days in a row'". It does not. A grid fills in source order, so six cells in two columns are
     rows (1,2) (3,4) (5,6) — the pair lands on row THREE, below the four, which is exactly what
     was asked for. I never checked it, and the split then cost a spacing fix of its own (the

      '<div class="stat-val">' + esc(val) + '</div>' +

     function, so the playlist rows now come through here too.

  function quizCells(key) {
    var t = T();
    var all = quizResults || {};
    var row = all[key] || {};

       that means "does not apply" rather than "never tried" — see the CSS note. */

      /* `best` of 0 is a real score, so test for null — not for falsiness. */
      var has = !!(r && r.best != null);
      return '<span class="pq-c' + (has ? '' : ' pq-none') + '" title="' + Q_NAME[id] + '">' +

  }
  /* A cheap fingerprint of the quiz figures for the repaint signature: unit count plus the
     sum of every stored best. Any score that moves moves the sum. */
  function quizSig() {
    if (!quizResults) return '-';
    var keys = Object.keys(quizResults), sum = 0, ans = 0, cor = 0;
    for (var i = 0; i < keys.length; i++) {
      var row = quizResults[keys[i]];
      for (var q in row) {

        if (row[q].best != null) sum += row[q].best;

           read them and a BEST can stay put while they move - answer three more questions
           correctly at a score below your best and `sum` does not budge. Without this the cards
           would render once and then never update, which is exactly the failure the note above
           the signature warns about. */
        ans += row[q].answered || 0;

           '<span class="prog-row-q">' + Q_IDS.map(function (id) {

    return progRow(t.hrefFor ? t.hrefFor(u.page) : u.page, u.name, secs, bareOf(u.page));

  function topicList(reps) {

    var units = t.liveSequence();
    if (!units || !units.length) return '';

    var rows = '';

    /* ⚠⚠ GRAMMAR BY EAR SITS ABOVE THE TOPICS, mirroring where it sits in the /topics menu and
       in the sliding pill row (owner, 2026-08-29). ⛔ DO NOT HARDCODE THAT ORDER: it is derived
       from the same source those surfaces use — topics.js's `structures` array, read through
       liveSequence('structures') — so re-ordering either arm moves both together. A hardcoded
       list drifts the first time either is re-ordered and nothing reports it.

       ⚠ ONE heading, not the per-band headings the topic loop below emits. Every grammar unit is
       levels:['li1'], so band logic would put a single "Lower intermediate" over the lot, which
       says nothing about what the group IS.

       ⚠ THIS SECTION WAS DELIBERATELY ABSENT UNTIL 2026-08-29, and not for sequencing: the
       Progress page is PUBLIC, and listing the units here while the arm was owner-gated and
       noindex would have shown every visitor that a hidden section existed and named all 20 of
       its units (plan §12.6). It went in the same release that made the section public. */
    var gram = t.liveSequence('structures');
    if (gram && gram.length) {
      rows += '<div class="prog-band">Grammar by Ear</div>';
      for (var g = 0; g < gram.length; g++) rows += unitRow(t, gram[g], reps);
    }

    var lastBand = null;
    for (var i = 0; i < units.length; i++) {
      var u = units[i];
      var band = t.levelText ? t.levelText(u.levels) : '';
      if (band && band !== lastBand) {
        rows += '<div class="prog-band">' + esc(band) + '</div>';
        lastBand = band;
      }
      rows += unitRow(t, u, reps);
    }
    /* ⚠ THE PLAYLIST ROWS JOIN THIS LIST — they are not a second one (owner, 2026-08-29:
       "Playlists is a different font size/style and a larger gap separates playlists than the
       gap between grammar by ear or other topics"). Playlists used to be its own <h2> with a
       2rem top margin above its own .prog-list, so it read as a different KIND of thing from
       "Grammar by Ear" and "Beginner" when it is the same kind: another group of rows.
       ⚠ One .prog-list matters beyond the heading style: `.prog-row:first-child` and
       `:last-child` round the ends of a list, so two lists means two rounded blocks with a gap.
       Appending here keeps one continuous list, and the group heading is the same .prog-band the
       arms and bands already use. */
    rows += playlistRows(reps);
    return '<h2 class="prog-h2">Your listening time</h2>' +
           '<p class="prog-h2-note">Every time a Thai sentence is played in a topic or a ' +
           'playlist, this contributes to your Total Thai listening time and your per topic ' +
           'or playlist Thai listening time. Time spent within pauses or listening to ' +
           'English sentences is not counted. Rounded to the nearest minute.</p>' +
           /* ⚠ The head sits OUTSIDE .prog-list: `.prog-row:first-child` rounds the top of the
              list, and a head row inside it would take that radius and leave the first real
              row square. It is hidden with the cells, by the same one class. */
           quizHead() +
           '<div class="prog-list">' + rows + '</div>';
  }

  /* Every playlist the user has, in the same shape as the topic rows.
     ⚠⚠ LISTED EVEN AT ZERO. The retired page only showed a playlist once it had a manually-added
     progress tick, so a playlist you had built but not yet finished simply was not there — the
     owner had to fake a tick to make one appear. A page that reports listening must list the
     things you can listen to, not only the ones you have finished.
     ⚠ A SUM, not the old minimum, and that removed two special cases with it. The minimum had to
     skip sentences the user is not entitled to play (a premium item in a free visitor's playlist
     pinned the row at 0 for ever) and then un-skip them when everything was locked. A sum needs
     neither: a sentence never played contributes zero on its own. Same shared listenSeconds() as
     pl-list.js and the topic cards — never a second implementation. */
  function playlistRows(reps) {
    var t = T(), a = A();
    if (!t || !t.listenSeconds) return '';
    if (!(a && a.getUser && a.getUser())) return '';       // signed out: nothing to list
    var lists = playlistsNow();
    if (!lists || !lists.length) return '';

    var rows = lists.map(function (p) {
      var secs = (p.items && p.items.length)
        ? t.listenSeconds(p.items.map(function (it) { return it.num; }), reps, durations) : 0;
      /* ⚠ THE CLEAN URL, BUILT BY CONCATENATION. A bare "playlists.html?pl=" takes Cloudflare
         Pages' 308 to /playlists — an uncached origin round trip measured at 127–1315 ms, and
         it runs before the service worker starts. hrefFor() strips only a TRAILING ".html", so
         the query must be appended after the call, never passed into it. */
      var base = t.hrefFor ? t.hrefFor('playlists.html') : 'playlists.html';
      return progRow(base + '?pl=' + encodeURIComponent(p.id), p.name, secs, 'pl:' + p.id);
    }).join('');

    /* The same .prog-band heading, and the rows are returned bare so they land inside the one
       list topicList() opens. No <h2>, no margin override. */
    return '<div class="prog-band">Playlists</div>' + rows;
  }

  /* The local playlist cache, read the same way pl-list.js reads it: the API first, then the
     localStorage mirror, so this works offline and before playlists.load() has resolved. */
  function playlistsNow() {
    var a = A(), pl = a && a.playlists;
    var lists = (pl && pl.get) ? pl.get() : null;
    if (!lists && pl && pl.peek) lists = pl.peek();
    if (!lists) { try { lists = JSON.parse(localStorage.getItem('thaiear_playlists') || 'null'); } catch (_) { lists = null; } }
    return lists || null;
  }

  function resetBlock() {
    return '<div class="reset-wrap">' +
      '<button type="button" class="reset-btn" id="prog-reset">Reset progress data</button>' +
      '<p class="reset-note">Sets every count back to zero. Tracking carries on from there — ' +
      'this does not turn it off, and it does not delete your account.<br>' +
      'Days are counted in UTC, so a streak rolls over at 7am Bangkok time.</p>' +
    '</div>';
  }

  /* ── reset, behind the site's own modal (never window.confirm) ──────────────────────────── */

  function wireReset() {
    var btn = document.getElementById('prog-reset');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var ov = document.createElement('div');
      ov.className = 'te-modal';
      ov.innerHTML = '<div class="te-modal-card" role="dialog" aria-modal="true">' +
        /* ⚠ SAY WHAT IT TAKES. It clears listening counts AND every quiz record - scores, the
           per-question right/wrong behind them, exclusions and the Builder rejection log - so the
           wording has to cover that or the control over-delivers silently. */
        '<p>Are you sure you want to delete your progress data?<br>' +
        'This clears your listening counts <strong>and every quiz score</strong>.<br>' +
        '<strong>This cannot be undone.</strong></p>' +
        '<div class="te-modal-actions">' +
          '<button type="button" class="te-modal-cancel">Cancel</button>' +
          '<button type="button" class="te-modal-confirm">Delete</button>' +
        '</div></div>';
      document.body.appendChild(ov);
      var close = function () { try { ov.remove(); } catch (_) {} };
      ov.querySelector('.te-modal-cancel').addEventListener('click', close);
      ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
      ov.querySelector('.te-modal-confirm').addEventListener('click', function () {
        var go = ov.querySelector('.te-modal-confirm');
        go.disabled = true; go.textContent = 'Deleting…';
        /* ⛔⛔ THE QUIZ RECORDS GO TOO (owner, 2026-09-22): "does deleting my progress data at the
           bottom of progress page remove all quiz data as well? ... it ought to please."
           ⚠ BOTH, AND THE PLAYS RESULT IS WHAT THE BUTTON REPORTS. The quiz reset is additive - a
           table that refuses must not make the whole delete look failed and send someone pressing
           it again - but a refusal is still surfaced, because "deleted" has to be true. */
        Promise.all([A().resetPlays(), A().resetQuiz ? A().resetQuiz() : Promise.resolve({ ok: true, refused: [] })])
          .then(function (both) {
          var okd = both[0], qz = both[1] || { ok: true, refused: [] };
          close();
          if (okd && !qz.ok) {
            btn.textContent = 'Progress cleared — some quiz records could not be removed';
            setTimeout(function () { btn.textContent = 'Reset progress data'; }, 4000);
          }
          if (!okd) {
            btn.textContent = 'Could not reset — try again';
            setTimeout(function () { btn.textContent = 'Reset progress data'; }, 2500);
            return;
          }
          painted = '';        // force a full repaint onto the zeroed numbers
          render();
        });
      });
    });
  }

  /* ── boot ───────────────────────────────────────────────────────────────────────────────── */

  render();                                     // paint the signed-out shape immediately
  window.addEventListener('thaiear:auth', render);

  /* The two lookups this page needs. Both are precached, so offline they come from the cache;
     both fail soft, because a missing lookup should cost a number, not the page. */
  fetch('clip-durations.json').then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d) { durations = d; painted = ''; render(); } })
    .catch(function () {});
  /* ⚠⚠ ASK AGAIN UNTIL topics.js IS ACTUALLY IN. This script is INLINE and topics.js is
     DEFERRED, so at parse time T() is undefined — always, on every load. It was a one-shot
     `if (T() && T().loadSentenceNums)` guard, so the question was asked once, of a helper that
     was not there yet, and never asked again: sentNums stayed null for the life of the page and
     EVERY topic row read "0 min" (since 2026-08-20, when this page replaced the form). The headline card and the playlist rows were
     unaffected and hid it — neither needs this lookup, because a playlist carries its own item
     numbers and the total is not grouped by topic.
     ⚠ The band pages get this right by LOAD ORDER (topics.js blocking, before topics-page.js).
     This page cannot: the script is inline. So it retries instead — DOMContentLoaded fires after
     every deferred script has run, and the auth event is a second chance behind it.
     loadSentenceNums() memoises itself and `sentNums ? 1 : 0` is in the repaint signature, so a
     late arrival costs one repaint and a re-ask costs nothing. */
  var numsAsked = false;
  function askSentenceNums() {
    if (numsAsked) return;
    var t = T();
    if (!t || !t.loadSentenceNums) return;
    numsAsked = true;
    t.loadSentenceNums().then(function (m) { if (m) { sentNums = m; painted = ''; render(); } })
      .catch(function () {});
  }
  askSentenceNums();
  document.addEventListener('DOMContentLoaded', askSentenceNums);
  window.addEventListener('thaiear:auth', askSentenceNums);

  /* ── the quiz columns (§2.5) ───────────────────────────────────────────────────────────
     ⚠⚠ SAME RETRY SHAPE AS askSentenceNums(), AND FOR THE SAME REASON — this script is INLINE
     and topics.js is DEFERRED, so T() is undefined at parse time on EVERY load. A one-shot
     `if (T() && T().quizGate)` here would be an unconditional skip, which is exactly how all
     93 topic rows read "0 min" for five days. DOMContentLoaded fires after every deferred
     script has run; the auth event is the second chance behind it.
     ⚠ LATCHED, because thaiear:auth fires once per recorded play — an unlatched retry would be
     a digest and an account pull per sentence heard.
     ⚠ RE-LATCHED ON SIGN-IN: the gate reads the identity record, which identity.js writes
     before auth.js confirms, so the first answer can legitimately be "no" and a later one
     "yes". askQuiz() therefore re-asks whenever the signed-in user CHANGES, not merely once. */
  var quizAskedFor = null;
  function askQuiz() {
    var t = T(), a = A();
    if (!t || !t.quizGate) return;
    var uid = (a && a.getUser && a.getUser() && a.getUser().id) || 'out';
    if (quizAskedFor === uid) return;
    quizAskedFor = uid;
    t.quizGate().then(function (ok) {
      /* ⛔ A NO MUST UNDO THE HEAD SCRIPT'S HINT, or a remembered '1' survives a session change
         for ever and shows empty quiz columns to someone who has none. The hint is applied
         before paint precisely because it is usually right; this is what makes being wrong
         temporary rather than permanent. */
      if (!ok) { try { document.documentElement.classList.remove('prog-q-on'); } catch (_) {} }
      if (!ok) return;
      quizOn = true;
      try { document.documentElement.classList.add('prog-q-on'); } catch (_) {}
      paintQuiz();
      /* The local mirror answers immediately and offline; the account copy is what makes a
         second device agree. pull() resolves false when signed out and never rejects. */
      var S = window.ThaiEarQuizStore;
      if (S && S.pull) S.pull().then(paintQuiz).catch(function () {});
    });
  }
  function paintQuiz() {
    var S = window.ThaiEarQuizStore;
    if (!quizOn || !S || !S.resultsAll) return;
    quizResults = S.resultsAll();
    painted = '';       // the cells are inside the rows, so this is a rebuild
    render();
  }
  askQuiz();
  document.addEventListener('DOMContentLoaded', askQuiz);
  window.addEventListener('thaiear:auth', askQuiz);
  function pullAll() {
    var a = A();
    if (!(a && a.getUser && a.getUser())) return;
    if (a.loadPlays) a.loadPlays().then(function () { render(); }).catch(function () {});
    /* Playlists too, or the section below the topics is empty until some other page has loaded
       them into the cache. Fire and forget — the local mirror already answered. */
    if (a.playlists && a.playlists.load) a.playlists.load().then(function () { render(); }).catch(function () {});
  }
  pullAll();
  window.addEventListener('thaiear:auth', pullAll);
})();
</script>
