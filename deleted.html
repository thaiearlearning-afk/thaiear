<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiEar — Account deleted</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1A1A1A; --text-secondary: #5A5A5A; --text-tertiary: #9A9A9A;
    --accent: #4B41AD; --accent-light: #EEEDFE; --accent-mid: #534AB7;
    --gold: #F0CC5C; --gold-dark: #C8A030; --purple-mid: #7F77DD;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font-ui: 'Inter', system-ui, sans-serif; --font-thai: 'Sarabun', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
  .page-wrap { max-width: 520px; margin: 0 auto; padding: 4rem 1.5rem; text-align: center; }
  .check { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-light); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; }
  .check svg { width: 26px; height: 26px; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.75rem; }
  p { color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.7; }
  .btn { display: inline-block; font-family: var(--font-ui); font-size: 15px; font-weight: 500; border-radius: var(--radius-sm);
    padding: 11px 22px; text-decoration: none; background: var(--accent); color: #fff; border: 0.5px solid var(--accent); }
  .btn:hover { background: var(--accent-mid); }
</style>
</head>
<body>

<div id="site-nav-root" style="min-height:54px;background:var(--surface);border-bottom:0.5px solid var(--border)"></div>

<div class="page-wrap">
  <span class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </span>
  <h1>Your account has been deleted</h1>
  <p>Your ThaiEar account, your data, and any active membership have been removed. We’re sorry to see
    you go — you’re welcome back anytime, and the free topics are always open.</p>
  <a class="btn" href="index.html">Back to ThaiEar</a>
</div>

<script src="nav.js" defer></script>
</body>
</html>
