<script>
window.ThaiEarTopic = {
  tier: "premium",
  audioPrefix: "Monastic_LI2",
  sentences: [
  { num: 1328, display: 1, preview: "เข้าคอร์ส", thai: "ช่วงวันหยุดยาว | เขาไปเข้าคอร์สปฏิบัติธรรมที่วัดป่าเจ็ดวันค่ะ", english: "Over the long holiday he went on a seven-day meditation retreat at a forest temple.", gloss: [["ช่วงวันหยุดยาว","over the long holiday"],["เขา","he"],["ไป","went"],["เข้าคอร์ส","on a retreat"],["ปฏิบัติธรรม","meditation"],["ที่วัดป่า","at a forest temple"],["เจ็ดวัน","seven days"],["ค่ะ","polite(f)"]], cultural: "Lay people increasingly spend holidays on silent retreats (คอร์สปฏิบัติธรรม) at วัดป่า (forest monasteries) — a few days of meditation, precepts and simple living away from daily life." },
  { num: 1329, display: 2, preview: "หลวงปู่", thai: "หลวงปู่สายวัดป่ามักสอนธรรมะด้วยภาษาง่ายๆ ที่ชาวบ้านเข้าใจได้ครับ", english: "Forest-tradition elder monks often teach the Dhamma in simple language villagers can understand.", gloss: [["หลวงปู่","elder monks"],["สายวัดป่า","of the forest tradition"],["มัก","often"],["สอนธรรมะ","teach the Dhamma"],["ด้วยภาษาง่ายๆ","in plain language"],["ที่ชาวบ้าน","that villagers"],["เข้าใจได้","can understand"],["ครับ","polite(m)"]], cultural: "หลวงปู่ ('venerable grandfather') is the affectionate title for a very senior monk. Forest masters like Luang Por Chah were famed for teaching profound ideas in simple, earthy village language." },
  { num: 1330, display: 3, preview: "พระธุดงค์", thai: "พระธุดงค์จะเดินจาริกไปปฏิบัติธรรมตามป่าเขาเพียงลำพังค่ะ", english: "Wandering ascetic monks set out alone to practise in the forests and hills.", gloss: [["พระธุดงค์","wandering ascetic monks"],["จะ","(will)"],["เดินจาริก","set out on foot"],["ไป","to"],["ปฏิบัติธรรม","practise"],["ตามป่าเขา","through forests and hills"],["เพียงลำพัง","all alone"],["ค่ะ","polite(f)"]], cultural: "ธุดงค์ (from Pāli dhutaṅga) are the optional ascetic practices of the wandering forest monk — walking alone through wilderness, sleeping under a large umbrella-tent, courting solitude as an aid to meditation." },
  { num: 1331, display: 4, preview: "พระป่า", thai: "แม้ว่าชีวิตพระป่าจะลำบาก | แต่ท่านก็เลือกใช้ชีวิตเรียบง่ายเพื่อฝึกใจครับ", english: "Although a forest monk's life is hard, he chooses a simple life to train the mind.", gloss: [["แม้ว่า","although"],["ชีวิต","the life"],["พระป่า","of a forest monk"],["จะลำบาก","is hard"],["แต่","yet"],["ท่าน","he"],["ก็","(still)"],["เลือก","chooses"],["ใช้ชีวิต","to live"],["เรียบง่าย","simply"],["เพื่อ","to"],["ฝึกใจ","train the mind"],["ครับ","polite(m)"]], cultural: "Forest hardship is deliberate — not for its own sake but, in keeping with the Middle Way, as a tool for loosening attachment and training the heart. แม้ว่า…ก็ is the 'although…still' frame." },
  { num: 1332, display: 5, preview: "กรรมฐาน", thai: "วัดสายกรรมฐานจะเน้นการนั่งสมาธิภาวนามากกว่าการเรียนปริยัติจากตำราค่ะ", english: "Kammatthana-tradition temples stress sitting meditation over studying the scriptures from books.", gloss: [["วัด","temples"],["สายกรรมฐาน","of the meditation tradition"],["จะ","(do)"],["เน้น","stress"],["การนั่งสมาธิ","sitting meditation"],["ภาวนา","and practice"],["มากกว่า","more than"],["การเรียนปริยัติ","scriptural study"],["จากตำรา","from books"],["ค่ะ","polite(f)"]], cultural: "Thai Buddhism has two broad streams: ปริยัติ (scholarly study of the texts) and ปฏิบัติ/กรรมฐาน (meditation). The forest tradition prizes direct practice over book-learning. มากกว่า marks the comparison." },
  { num: 1333, display: 6, preview: "ขันติ", thai: "ครูบาอาจารย์สอนว่า | ความอดทนหรือขันติเป็นหัวใจสำคัญของการปฏิบัติธรรมครับ", english: "The teachers say that patient endurance — khanti — is at the very heart of practice.", gloss: [["ครูบาอาจารย์","the teachers"],["สอนว่า","say"],["ความอดทน","patient endurance"],["หรือ","or"],["ขันติ","khanti"],["เป็น","is"],["หัวใจสำคัญ","the very heart"],["ของการปฏิบัติธรรม","of practice"],["ครับ","polite(m)"]], cultural: "ขันติ (khanti, patient endurance) is one of the ten perfections; the Dhammapada calls patience the highest austerity. Forest teachers treat it as the bedrock quality that carries a practitioner through hardship." },
  { num: 1334, display: 7, preview: "มรณานุสติ", thai: "พระป่าจะเจริญมรณานุสติ | คือระลึกถึงความตายอยู่เสมอ เพื่อไม่ประมาทในการปฏิบัติครับ", english: "Forest monks cultivate maranasati — constantly recollecting death — so as not to be heedless in practice.", gloss: [["พระป่า","forest monks"],["จะ","(will)"],["เจริญ","cultivate"],["มรณานุสติ","recollection of death"],["คือ","that is"],["ระลึกถึง","recalling"],["ความตาย","death"],["อยู่เสมอ","constantly"],["เพื่อ","so as"],["ไม่ประมาท","not to be heedless"],["ในการปฏิบัติ","in practice"],["ครับ","polite(m)"]], cultural: "มรณานุสติ (mindfulness of death) is a classic meditation — keeping mortality in view to cut through complacency and spur urgency in practice. Forest monks traditionally do this in cremation grounds." },
  { num: 1335, display: 8, preview: "ป่าช้า", thai: "พระป่ามักไปนั่งสมาธิในป่าช้า | เพื่อฝึกเอาชนะความกลัวผีและความกลัวตายครับ", english: "Forest monks often go to meditate in charnel grounds to train themselves to overcome the fear of ghosts and of death.", gloss: [["พระป่า","forest monks"],["มัก","often"],["ไป","go"],["นั่งสมาธิ","meditate"],["ในป่าช้า","in charnel grounds"],["เพื่อ","to"],["ฝึก","train"],["เอาชนะ","and overcome"],["ความกลัวผี","fear of ghosts"],["และ","and"],["ความกลัวตาย","fear of death"],["ครับ","polite(m)"]], cultural: "Meditating in a ป่าช้า (charnel ground/cemetery) is a celebrated forest practice — confronting fear of ghosts and death head-on, as Ajahn Mun and Luang Por Chah famously did, until the fear loosened its grip." },
  { num: 1336, display: 9, preview: "พระวินัย", thai: "พระต้องรักษาพระวินัยทั้ง ๒๒๗ ข้ออย่างเคร่งครัดทุกวันครับ", english: "A monk must keep all 227 rules of the Vinaya strictly every day.", gloss: [["พระ","a monk"],["ต้อง","must"],["รักษา","keep"],["พระวินัย","the Vinaya"],["ทั้ง","all"],["๒๒๗","227"],["ข้อ","rules"],["อย่างเคร่งครัด","strictly"],["ทุกวัน","every day"],["ครับ","polite(m)"]], cultural: "A fully ordained monk lives by the 227 training rules of the Pātimokkha — the heart of the พระวินัย (monastic code) — covering everything from serious offences to fine points of conduct." },
  { num: 1337, display: 10, preview: "ปาฏิโมกข์", thai: "ทุกกึ่งเดือนพระจะลงโบสถ์สวดปาฏิโมกข์ร่วมกันครับ", english: "Every fortnight the monks enter the bot to recite the Patimokkha together.", gloss: [["ทุกกึ่งเดือน","every fortnight"],["พระ","the monks"],["จะ","(will)"],["ลงโบสถ์","gather in the ubosot"],["สวด","recite"],["ปาฏิโมกข์","the Patimokkha"],["ร่วมกัน","together"],["ครับ","polite(m)"]], cultural: "On the full and new moon (Uposatha), monks assemble to recite the ปาฏิโมกข์ — the full list of training rules — and confess any breaches, renewing the community's discipline." },
  { num: 1338, display: 11, preview: "ไตรจีวร", thai: "ผ้าไตรจีวรของพระมีสามผืน | คือ สบง จีวร และสังฆาฏิครับ", english: "A monk's set of three robes has three pieces: the lower robe, the upper robe, and the outer double robe.", gloss: [["ผ้าไตรจีวร","a monk's robe set"],["ของพระ","(of a monk)"],["มี","has"],["สามผืน","three pieces"],["คือ","namely"],["สบง","the lower robe"],["จีวร","the upper robe"],["และ","and"],["สังฆาฏิ","the outer robe"],["ครับ","polite(m)"]], cultural: "The 'triple robe' (ไตรจีวร): สบง (the lower, waist-to-shin cloth), จีวร (the large upper robe), and สังฆาฏิ (the doubled outer robe). ผืน is the classifier for cloth." },
  { num: 1339, display: 12, preview: "ย้อมจีวร", thai: "พระป่าจะย้อมจีวรด้วยแก่นขนุนให้เป็นสีกรักครับ", english: "Forest monks dye their robes with jackfruit heartwood to get the ochre colour.", gloss: [["พระป่า","forest monks"],["จะ","(will)"],["ย้อม","dye"],["จีวร","their robes"],["ด้วยแก่นขนุน","with jackfruit heartwood"],["ให้เป็น","to get"],["สีกรัก","the ochre colour"],["ครับ","polite(m)"]], cultural: "Forest monks traditionally make and dye their own robes, boiling the heartwood of the jackfruit tree (แก่นขนุน) to produce the distinctive dull brownish-ochre สีกรัก." },
  { num: 1340, display: 13, preview: "เย็บปะ", thai: "เวลาจีวรขาด | พระจะเย็บปะเองด้วยเข็มกับด้ายครับ", english: "When a robe tears, a monk sews and patches it himself with needle and thread.", gloss: [["เวลา","when"],["จีวร","a robe"],["ขาด","tears"],["พระ","a monk"],["จะ","(will)"],["เย็บปะ","sew and patch"],["เอง","it himself"],["ด้วยเข็ม","with a needle"],["กับด้าย","and thread"],["ครับ","polite(m)"]], cultural: "Monks mend their own robes; in the strictest tradition robes were sewn from patched, cast-off cloth — a reminder of simplicity and non-attachment to possessions." },
  { num: 1341, display: 14, preview: "กรานกฐิน", thai: "ในวันกรานกฐิน | พระต้องตัด เย็บ และย้อมจีวรให้เสร็จภายในวันเดียวครับ", english: "On the kathina robe-making day, the monks must cut, sew and dye a robe to completion within a single day.", gloss: [["ในวันกรานกฐิน","on the kathina day"],["พระ","the monks"],["ต้อง","must"],["ตัด","cut"],["เย็บ","sew"],["และ","and"],["ย้อม","dye"],["จีวร","a robe"],["ให้เสร็จ","to completion"],["ภายในวันเดียว","within a single day"],["ครับ","polite(m)"]], cultural: "In the kathina rite (กรานกฐิน), gifted cloth must be cut, sewn and dyed into a finished robe by the Sangha within one day — a tradition of cooperative effort dating to the Buddha's time." },
  { num: 1342, display: 15, preview: "อัฐบริขาร", thai: "พระมีอัฐบริขารแค่ไม่กี่อย่าง | เช่น บาตรกับไตรจีวรครับ", english: "A monk has only a few requisites — the eight basics, like the alms bowl and the three robes.", gloss: [["พระ","a monk"],["มี","has"],["อัฐบริขาร","the requisites"],["แค่","only"],["ไม่กี่อย่าง","a few things"],["เช่น","such as"],["บาตร","the alms bowl"],["กับ","and"],["ไตรจีวร","the three robes"],["ครับ","polite(m)"]], cultural: "อัฐบริขาร, the 'eight requisites', are a monk's only allowed possessions — the three robes, alms bowl, belt, razor, needle and water-strainer — embodying radical simplicity." },
  { num: 1343, display: 16, preview: "ฉันมื้อเดียว", thai: "พระป่าส่วนใหญ่ฉันมื้อเดียวต่อวันตามแบบธุดงควัตรครับ", english: "Most forest monks eat one meal a day, in keeping with the ascetic practices.", gloss: [["พระป่า","forest monks"],["ส่วนใหญ่","mostly"],["ฉัน","eat"],["มื้อเดียว","one meal"],["ต่อวัน","a day"],["ตามแบบ","in keeping with"],["ธุดงควัตร","the ascetic practices"],["ครับ","polite(m)"]], cultural: "ฉัน is the special verb for a monk's eating. Eating just one daily meal, from the alms bowl, is one of the dhutaṅga (ธุดงควัตร) ascetic observances kept in forest monasteries." },
  { num: 1344, display: 17, preview: "ขัดเกลากิเลส", thai: "การถือธุดงควัตรอย่างเคร่งครัด | ช่วยขัดเกลากิเลสและฝึกจิตให้เข้มแข็งขึ้นค่ะ", english: "Strictly keeping the ascetic practices helps scour away defilements and trains the mind to be stronger.", gloss: [["การถือ","keeping"],["ธุดงควัตร","the ascetic practices"],["อย่างเคร่งครัด","strictly"],["ช่วย","helps"],["ขัดเกลา","scour away"],["กิเลส","defilements"],["และ","and"],["ฝึกจิต","train the mind"],["ให้เข้มแข็ง","to be strong"],["ขึ้น","(more)"],["ค่ะ","polite(f)"]], cultural: "The dhutaṅga are 'means of shaking off' (ขัดเกลา) the กิเลส — greed, hatred and delusion. The point isn't punishment but a sterner training that strengthens the mind." },
  { num: 1345, display: 18, preview: "ไม่ฉันหลังเที่ยง", thai: "พระสมาทานที่จะไม่ฉันอาหารหลังเที่ยงวันไปจนถึงรุ่งเช้าครับ", english: "Monks undertake not to eat any food from midday until the next dawn.", gloss: [["พระ","monks"],["สมาทาน","undertake"],["ที่จะ","to"],["ไม่ฉัน","not eat"],["อาหาร","food"],["หลังเที่ยงวัน","after midday"],["ไปจนถึง","until"],["รุ่งเช้า","the next dawn"],["ครับ","polite(m)"]], cultural: "Not eating from solar noon until dawn (vikāla-bhojana) is a core training rule. สมาทาน is the formal act of 'taking on' a precept or observance as a personal undertaking." },
  { num: 1346, display: 19, preview: "กัปปิยัง", thai: "ผลไม้ที่มีเมล็ด | ต้องเอามีดกรีดแล้วกล่าวว่า กัปปิยัง ภันเต พระถึงจะฉันได้ค่ะ", english: "Fruit with seeds must be cut with a knife while saying kappiyam bhante before a monk may eat it.", gloss: [["ผลไม้","fruit"],["ที่มีเมล็ด","with seeds"],["ต้อง","must"],["เอามีด","with a knife"],["กรีด","be scored"],["แล้ว","while"],["กล่าวว่า","saying"],["กัปปิยัง ภันเต","kappiyam bhante"],["พระ","a monk"],["ถึงจะ","only then"],["ฉันได้","may eat"],["ค่ะ","polite(f)"]], cultural: "A monk may not damage seeds (destroying a plant's 'life'), so before offering seeded fruit a layperson 'makes it allowable' by scoring it with a knife while saying 'kappiyaṃ bhante' ('it is allowable, venerable sir')." },
  { num: 1347, display: 20, preview: "น้ำปานะ", thai: "หลังเที่ยงพระฉันอาหารไม่ได้ | แต่ดื่มน้ำปานะที่คั้นจากผลไม้ได้ครับ", english: "After midday a monk can't eat food, but he may drink nam pana, the strained fruit juice.", gloss: [["หลังเที่ยง","after midday"],["พระ","a monk"],["ฉัน","eat"],["อาหาร","food"],["ไม่ได้","can't"],["แต่","but"],["ดื่ม","may drink"],["น้ำปานะ","nam pana"],["ที่คั้นจากผลไม้","strained fruit juice"],["ได้","(can)"],["ครับ","polite(m)"]], cultural: "น้ำปานะ are the 'allowable' afternoon drinks — fruit juice strained clear of pulp — permitted when solid food isn't, to sustain monks through the evening." },
  { num: 1348, display: 21, preview: "ช็อกโกแลตดำ", thai: "ในบางวัด | ช็อกโกแลตดำถือเป็นของที่ฉันได้หลังเที่ยง เพราะมีสรรพคุณเป็นยาค่ะ", english: "In some monasteries, dark chocolate counts as an allowable after midday because it has medicinal value.", gloss: [["ในบางวัด","in some monasteries"],["ช็อกโกแลตดำ","dark chocolate"],["ถือเป็น","counts as"],["ของที่ฉันได้","an allowable"],["หลังเที่ยง","after midday"],["เพราะ","because"],["มีสรรพคุณ","it has properties"],["เป็นยา","medicinal"],["ค่ะ","polite(f)"]], cultural: "Besides juice, certain 'tonics' (sugar, honey, and in some Western forest monasteries plain dark chocolate) are treated as medicinal allowables in the evening. เพราะ marks the reason." },
  { num: 1349, display: 22, preview: "ทดแทนบุญคุณ", thai: "ผู้ชายไทยหลายคนบวชเป็นพระช่วงหนึ่ง | เพื่อทดแทนบุญคุณพ่อแม่ครับ", english: "Many Thai men ordain as monks for a time to repay their parents' loving kindness.", gloss: [["ผู้ชายไทย","Thai men"],["หลายคน","many"],["บวช","ordain"],["เป็นพระ","as monks"],["ช่วงหนึ่ง","for a time"],["เพื่อ","to"],["ทดแทนบุญคุณ","repay the kindness"],["พ่อแม่","of their parents"],["ครับ","polite(m)"]], cultural: "Temporary ordination is a way of repaying parents: the merit a son makes by ordaining is believed to flow to his mother and father — a deeply valued act of filial gratitude." },
  { num: 1350, display: 23, preview: "พระอุปัชฌาย์", thai: "ก่อนบวช | ผู้ชายต้องไปฝากตัวกับพระอุปัชฌาย์ก่อนครับ", english: "Before ordaining, a man must go and entrust himself to a preceptor first.", gloss: [["ก่อนบวช","before ordaining"],["ผู้ชาย","a man"],["ต้อง","must"],["ไป","go"],["ฝากตัว","entrust himself"],["กับพระอุปัชฌาย์","to a preceptor"],["ก่อน","first"],["ครับ","polite(m)"]], cultural: "The พระอุปัชฌาย์ (preceptor) is the senior monk who sponsors and ordains a candidate and takes responsibility for his training — the candidate formally 'entrusts himself' to him." },
  { num: 1351, display: 24, preview: "สังฆทาน", thai: "การถวายสังฆทานคือการทำบุญให้แก่สงฆ์ส่วนรวม | ไม่เจาะจงพระรูปใดรูปหนึ่งค่ะ", english: "Offering sangha-dana is making merit to the Sangha as a whole, not to any one particular monk.", gloss: [["การถวาย","offering"],["สังฆทาน","sangha-dana"],["คือ","is"],["การทำบุญ","making merit"],["ให้แก่","to"],["สงฆ์ส่วนรวม","the Sangha as a whole"],["ไม่เจาะจง","not to any one"],["พระ","monk"],["รูปใดรูปหนึ่ง","in particular"],["ค่ะ","polite(f)"]], cultural: "สังฆทาน is merit given to the whole monastic community rather than a chosen monk — considered especially fruitful precisely because it's impersonal. รูป is the classifier for monks." },
  { num: 1352, display: 25, preview: "ฉันข้าว", thai: "เวลาถามพระว่าฉันข้าวหรือยัง | ห้ามใช้คำว่ากินนะคะ", english: "When you ask a monk whether he's eaten, you mustn't use the word gin.", gloss: [["เวลา","when"],["ถามพระ","asking a monk"],["ว่า","whether"],["ฉันข้าว","he's eaten"],["หรือยัง","yet"],["ห้าม","you mustn't"],["ใช้คำว่า","use the word"],["กิน","'gin' (eat)"],["นะ","(softener)"],["คะ","polite(f)"]], cultural: "Monks have their own respectful vocabulary: a monk ฉัน (not กิน) when he eats, สรง (not อาบ) when he bathes, อาพาธ (not ป่วย) when ill. Using lay words for a monk sounds disrespectful." },
  { num: 1353, display: 26, preview: "อาพาธ", thai: "ถ้าพระอาพาธหนัก | ลูกศิษย์จะนิมนต์หมอมาดูแลที่กุฏิครับ", english: "If a monk is gravely ill, his disciples invite a doctor to attend him at his quarters.", gloss: [["ถ้า","if"],["พระ","a monk"],["อาพาธ","is ill"],["หนัก","gravely"],["ลูกศิษย์","his disciples"],["จะ","(will)"],["นิมนต์","invite"],["หมอ","a doctor"],["มาดูแล","to attend"],["ที่กุฏิ","at his hut"],["ครับ","polite(m)"]], cultural: "อาพาธ is the respectful word for a monk's illness; นิมนต์ is the special verb for 'inviting' a monk (here extended to arranging his care). A กุฏิ is a monk's small dwelling-hut." },
  { num: 1354, display: 27, preview: "เจริญพร", thai: "อาตมาขอเจริญพรโยม | วันนี้มาทำบุญหรือเปล่า", english: "I offer my blessings, lay friend — have you come to make merit today?", gloss: [["อาตมา","I (monk)"],["ขอเจริญพร","offer my blessings"],["โยม","lay friend"],["วันนี้","today"],["มาทำบุญ","come to make merit"],["หรือเปล่า","have you?"]], cultural: "When a monk speaks he calls himself อาตมา and addresses a lay person as โยม; เจริญพร is his polite particle, replacing the lay ครับ/ค่ะ. หรือเปล่า softly checks something the speaker half-expects." },
  { num: 1355, display: 28, preview: "พรรษา", thai: "อาตมาอยู่ที่วัดป่าแห่งนี้มาสามสิบพรรษาแล้วโยม", english: "I've been at this forest temple for thirty rains now, lay friend.", gloss: [["อาตมา","I (monk)"],["อยู่","have been"],["ที่วัดป่า","at this forest temple"],["แห่งนี้","here"],["มา","for"],["สามสิบพรรษา","thirty rains"],["แล้ว","now"],["โยม","lay friend"]], cultural: "A monk's seniority is counted in พรรษา ('rains') — completed rains-retreats, so one พรรษา ≈ one year as a monk. 'Thirty rains' marks a very senior elder. V+มา here measures a span up to now." },
  { num: 1356, display: 29, preview: "ทำใจให้สงบ", thai: "อาตมาว่าโยมลองทำใจให้สงบเสียก่อน | เดี๋ยวปัญหาก็คลายเอง", english: "I'd say try to calm your mind first, lay friend — the problem will ease by itself soon.", gloss: [["อาตมา","I (monk)"],["ว่า","would say"],["โยม","lay friend"],["ลอง","try"],["ทำใจ","to settle your heart"],["ให้สงบ","calm"],["เสียก่อน","first"],["เดี๋ยว","soon"],["ปัญหา","the problem"],["ก็","will"],["คลาย","ease"],["เอง","by itself"]], cultural: "Gentle pastoral advice in monastic register. เสียก่อน adds 'get that done first'; calming the mind before tackling a problem reflects the practical, reassuring style of forest teachers." },
  { num: 1357, display: 30, preview: "นิมนต์ฉันเพล", thai: "นมัสการพระอาจารย์ค่ะ | ขอนิมนต์ไปฉันเพลที่บ้านวันอาทิตย์นี้", english: "Reverence to you, Phra Ajahn — may I invite you to take the midday meal at our home this Sunday?", gloss: [["นมัสการ","reverence to you"],["พระอาจารย์","Phra Ajahn"],["ค่ะ","polite(f)"],["ขอ","may I"],["นิมนต์","invite you"],["ไปฉันเพล","for the midday meal"],["ที่บ้าน","at our home"],["วันอาทิตย์นี้","this Sunday"]], cultural: "Lay people greet a monk with นมัสการ (not สวัสดี) and 'invite' him with นิมนต์. เพล is the late-morning meal a monk takes before noon; พระอาจารย์ ('Phra Ajahn') is a respectful title for a teacher-monk." },
]
};
