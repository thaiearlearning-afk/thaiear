  { num: 324, display: 2, preview: "กิโลละ", thai: "มะม่วงกิโลละเท่าไหร่คะ", english: "How much per kilo for mangoes?", gloss: [["มะม่วง", "mango"], ["กิโล", "kilo"], ["ละ", "per"], ["เท่าไหร่", "how much"], ["คะ", "polite(f)"]], cultural: "X ละ เท่าไหร่ is the everyday way to ask a unit price — กิโลละ 'per kilo', อันละ 'per piece'." },

  { num: 329, display: 7, preview: "เอา", thai: "เอาอันนี้สองอันค่ะ", english: "I'll take two of these.", gloss: [["เอา", "take"], ["อันนี้", "this one"], ["สอง", "two"], ["อัน", "(classifier)"], ["ค่ะ", "polite(f)"]], cultural: "อัน is the all-purpose classifier for small objects. Thai counts as noun + number + classifier, so 'two of these' is literally 'these, two อัน'." },

  { num: 333, display: 11, preview: "บัตร", thai: "รับบัตรไหมครับ", english: "Do you take card?", gloss: [["รับ", "accept"], ["บัตร", "card"], ["ไหม", "(question)"], ["ครับ", "polite(m)"]], cultural: "" },
  { num: 334, display: 12, preview: "ทอนเงิน", thai: "พี่ทอนเงินผิดนะคะ", english: "You gave me the wrong change.", gloss: [["พี่", "(you)"], ["ทอนเงิน", "give change"], ["ผิด", "wrong"], ["นะคะ", "polite(f)"]], cultural: "พี่ ('older sibling') is the normal friendly way to address a vendor or anyone a bit older — warmer than 'you'." },
  { num: 341, display: 13, preview: "สแกนจ่าย", thai: "สแกนจ่ายได้ไหมครับ", english: "Can I pay by QR scan?", gloss: [["สแกน", "scan"], ["จ่าย", "pay"], ["ได้ไหม", "can?"], ["ครับ", "polite(m)"]], cultural: "Paying by scanning a QR code (PromptPay) is everywhere in Thailand — many stalls and street vendors prefer it to cash." },

  { num: 343, display: 15, preview: "ถุง", thai: "รับถุงไหมคะ", english: "Would you like a bag?", gloss: [["รับ", "take"], ["ถุง", "bag"], ["ไหม", "(question)"], ["คะ", "polite(f)"]], cultural: "Since Thailand's plastic-bag charges, vendors often ask รับถุงไหม ('want a bag?') — many shoppers bring their own." },
  { num: 1046, display: 16, preview: "ทอน", thai: "มีแต่แบงค์พัน ทอนได้ไหมครับ", english: "I've only got a 1000 — can you make change?", gloss: [["มีแต่", "only have"], ["แบงค์", "note"], ["พัน", "thousand"], ["ทอน", "give change"], ["ได้ไหม", "can?"], ["ครับ", "polite(m)"]], cultural: "แบงค์ (from English 'bank[note]') is the everyday word for a banknote; แบงค์พัน is a 1,000-baht note, often too big for small stalls to break." },
  { num: 1049, display: 17, preview: "ใบเสร็จ", thai: "ขอใบเสร็จด้วยครับ", english: "Can I have a receipt too?", gloss: [["ขอ", "may I have"], ["ใบเสร็จ", "receipt"], ["ด้วย", "too"], ["ครับ", "polite(m)"]], cultural: "" },
