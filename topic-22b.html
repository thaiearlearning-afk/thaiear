<script>
window.ThaiEarTopic = {
  tier: "premium",
  audioPrefix: "FoodCulture_LI2",
  sentences: [
  { num: 1006, display: 1, preview: "เอกลักษณ์", thai: "อาหารแต่ละภาคของไทยมีเอกลักษณ์ไม่เหมือนกันค่ะ", english: "Each region of Thailand has its own distinctive food.", gloss: [["อาหาร", "food"], ["แต่ละภาค", "each region"], ["ของไทย", "of Thailand"], ["มี", "has"], ["เอกลักษณ์", "own identity"], ["ไม่เหมือนกัน", "differs"], ["ค่ะ", "polite(f)"]], cultural: "Thailand's regions — North, Northeast (Isan), Central and South — have markedly different cuisines shaped by climate, geography and neighbours. \"Thai food\" is really several regional traditions." },
  { num: 1007, display: 2, preview: "ปักษ์ใต้", thai: "อาหารปักษ์ใต้ขึ้นชื่อว่าเผ็ดที่สุดในไทยเลยครับ", english: "Southern food is famed as the spiciest in Thailand.", gloss: [["อาหาร", "food"], ["ปักษ์ใต้", "the South"], ["ขึ้นชื่อ", "renowned"], ["ว่า", "as"], ["เผ็ดที่สุด", "spiciest"], ["ในไทย", "in Thailand"], ["เลย", "(emphasis)"], ["ครับ", "polite(m)"]], cultural: "Southern Thai food is famous for fierce heat and bold, salty, turmeric-rich flavours — spicy even by Thai standards." },
  { num: 1008, display: 3, preview: "ข้าวเหนียว", thai: "คนเหนือชอบกินข้าวเหนียวเป็นหลักเหมือนคนอีสานค่ะ", english: "Northerners eat sticky rice as a staple, like Isan folk.", gloss: [["คนเหนือ", "Northerners"], ["ชอบ", "like"], ["กิน", "eat"], ["ข้าวเหนียว", "sticky rice"], ["เป็นหลัก", "as staple"], ["เหมือน", "like"], ["คนอีสาน", "Isan folk"], ["ค่ะ", "polite(f)"]], cultural: "In the North and Northeast, sticky rice — eaten by hand, rolled into balls to dip into dishes — is the staple instead of steamed jasmine rice, and central to regional identity." },
  { num: 1009, display: 4, preview: "ส้มตำ", thai: "ส้มตำกับลาบเป็นอาหารอีสานที่คนทั้งประเทศติดใจค่ะ", english: "Som tam and laab are Isan dishes the whole country's hooked on.", gloss: [["ส้มตำ", "papaya salad"], ["กับ", "and"], ["ลาบ", "laab"], ["เป็น", "are"], ["อาหารอีสาน", "Isan food"], ["ที่", "that"], ["คนทั้งประเทศ", "the whole country"], ["ติดใจ", "loves"], ["ค่ะ", "polite(f)"]], cultural: "Originally Isan dishes, ส้มตำ (spicy papaya salad) and ลาบ are now loved nationwide — Isan food is arguably Thailand's most popular regional cuisine, found on every corner." },
  { num: 1010, display: 5, preview: "ขึ้นชื่อ", thai: "เวลาไปต่างจังหวัด | คนไทยชอบหาของกินขึ้นชื่อของที่นั่นค่ะ", english: "Travelling upcountry, Thais seek out the local specialty.", gloss: [["เวลา", "when"], ["ไป", "go"], ["ต่างจังหวัด", "upcountry"], ["คนไทย", "Thais"], ["ชอบ", "like"], ["หา", "seek"], ["ของกิน", "food"], ["ขึ้นชื่อ", "famous"], ["ของที่นั่น", "local"], ["ค่ะ", "polite(f)"]], cultural: "Each province has signature dishes, and hunting them down is half the point of travelling. Thais will go far for a town's famous noodle shop or sweet — food is a big part of regional pride." },
  { num: 1011, display: 6, preview: "ของฝาก", thai: "กลับจากต่างจังหวัดทีไร | ต้องซื้อของฝากเป็นของกินกลับมาเสมอครับ", english: "Every trip back, you always bring food gifts home.", gloss: [["กลับ", "return"], ["จาก", "from"], ["ต่างจังหวัด", "upcountry"], ["ทีไร", "whenever"], ["ต้อง", "must"], ["ซื้อ", "buy"], ["ของฝาก", "food gifts"], ["เป็น", "as"], ["ของกิน", "food"], ["กลับมา", "back"], ["เสมอ", "always"], ["ครับ", "polite(m)"]], cultural: "ของฝาก — a small gift, almost always local food or sweets, brought back from a trip for family, friends or coworkers — is near-obligatory; returning empty-handed can seem thoughtless. Many famous regional snacks exist mainly as ของฝาก." },
  { num: 1012, display: 7, preview: "ความสัมพันธ์", thai: "คนไทยถือว่าการกินข้าวด้วยกันช่วยเชื่อมความสัมพันธ์ค่ะ", english: "Thais see eating together as relationship-building.", gloss: [["คนไทย", "Thais"], ["ถือว่า", "see as"], ["การกินข้าว", "eating"], ["ด้วยกัน", "together"], ["ช่วย", "helps"], ["เชื่อม", "bond"], ["ความสัมพันธ์", "relationships"], ["ค่ะ", "polite(f)"]], cultural: "Sharing meals is how relationships are built and kept up — business deals, friendships and family ties are all nurtured over food. Eating together both signals and strengthens closeness." },
  { num: 1013, display: 8, preview: "น้ำใจ", thai: "การชวนคนมากินข้าวเป็นการแสดงน้ำใจอย่างหนึ่งครับ", english: "Inviting people to eat is a way of showing kindness.", gloss: [["การชวน", "inviting"], ["คน", "people"], ["มา", "to"], ["กินข้าว", "eat"], ["เป็น", "is"], ["การแสดง", "showing"], ["น้ำใจ", "kindness"], ["อย่างหนึ่ง", "a kind of"], ["ครับ", "polite(m)"]], cultural: "น้ำใจ — literally \"water of the heart\" — is generous, thoughtful kindness toward others. Feeding people is one of its clearest expressions, and someone with much น้ำใจ is warmly regarded." },
  { num: 1014, display: 9, preview: "เจ้าภาพ", thai: "เจ้าภาพมักจะเลี้ยงอาหารแขกอย่างดีเสมอค่ะ", english: "A host always feeds their guests generously.", gloss: [["เจ้าภาพ", "host"], ["มักจะ", "tend to"], ["เลี้ยง", "feed"], ["อาหาร", "food"], ["แขก", "guests"], ["อย่างดี", "well"], ["เสมอ", "always"], ["ค่ะ", "polite(f)"]], cultural: "A host (เจ้าภาพ) is expected to feed guests well and generously — running out of food, or a guest leaving hungry, would make the host lose face." },
  { num: 1015, display: 10, preview: "ปฏิเสธ", thai: "ถึงจะอิ่มแล้ว | แต่ถ้าเจ้าของบ้านชวนกินก็ไม่ควรปฏิเสธครับ", english: "Even if you're full, you shouldn't refuse the host's offer.", gloss: [["ถึงจะ", "even if"], ["อิ่ม", "full"], ["แล้ว", "already"], ["แต่", "but"], ["ถ้า", "if"], ["เจ้าของบ้าน", "the host"], ["ชวน", "invites"], ["กิน", "eat"], ["ก็", "then"], ["ไม่ควร", "shouldn't"], ["ปฏิเสธ", "refuse"], ["ครับ", "polite(m)"]], cultural: "Accepting at least a little when offered food honours the host's น้ำใจ; flatly refusing can seem cold. The usual compromise is to take a small amount even when full." },
  { num: 1016, display: 11, preview: "ทักทาย", thai: "เวลาคนไทยถามว่ากินข้าวรึยัง | บางทีก็แค่ทักทายเฉยๆค่ะ", english: "When Thais ask 'have you eaten?', sometimes it's just a greeting.", gloss: [["เวลา", "when"], ["คนไทย", "Thais"], ["ถามว่า", "ask"], ["กินข้าว", "eaten"], ["รึยัง", "yet"], ["บางที", "sometimes"], ["ก็", "just"], ["แค่", "only"], ["ทักทาย", "a greeting"], ["เฉยๆ", "merely"], ["ค่ะ", "polite(f)"]], cultural: "\"กินข้าวรึยัง?\" (eaten yet?) is often pure greeting, like \"how's it going?\" — not a real question about food or an invitation. A casual \"กินแล้ว\" closes it." },
  { num: 1017, display: 12, preview: "น้ำพริก", thai: "คนไทยมีสำนวนว่ากินน้ำพริกถ้วยเดียว | หมายถึงรักเดียวใจเดียวครับ", english: "The idiom 'eating from one chili-dip bowl' means being faithful to one partner.", gloss: [["คนไทย", "Thais"], ["มี", "have"], ["สำนวน", "an idiom"], ["ว่า", "that"], ["กิน", "eat"], ["น้ำพริก", "chili dip"], ["ถ้วยเดียว", "one bowl"], ["หมายถึง", "means"], ["รักเดียวใจเดียว", "faithful"], ["ครับ", "polite(m)"]], cultural: "น้ำพริก (chili dip eaten with rice and vegetables) is humble everyday food. The idiom \"กินน้ำพริกถ้วยเดียว\" — sticking to a single bowl — means staying faithful to one partner, content with what you have." },
  { num: 1018, display: 13, preview: "ส้อม", thai: "คนไทยกินข้าวด้วยช้อนกับส้อม | ไม่ค่อยใช้ตะเกียบค่ะ", english: "Thais eat with a spoon and fork, rarely chopsticks.", gloss: [["คนไทย", "Thais"], ["กินข้าว", "eat"], ["ด้วย", "with"], ["ช้อน", "spoon"], ["กับ", "and"], ["ส้อม", "fork"], ["ไม่ค่อย", "rarely"], ["ใช้", "use"], ["ตะเกียบ", "chopsticks"], ["ค่ะ", "polite(f)"]], cultural: "Thais eat most dishes with a spoon (right hand) and fork (left, to push food onto the spoon) — the spoon, not the fork, goes to the mouth. Chopsticks are mainly for noodle dishes." },
  { num: 1019, display: 14, preview: "เหลือทิ้ง", thai: "ผู้ใหญ่มักสอนว่าอย่ากินข้าวเหลือทิ้งนะครับ", english: "Elders teach you not to waste rice.", gloss: [["ผู้ใหญ่", "elders"], ["มัก", "often"], ["สอนว่า", "teach"], ["อย่า", "don't"], ["กินข้าว", "eat rice"], ["เหลือทิ้ง", "leave wasted"], ["นะครับ", "polite(m)"]], cultural: "Children are taught not to leave rice uneaten — partly out of respect for farmers' labour, partly a value of not wasting. A playful warning says leftover grains mean you'll marry someone with a pockmarked face." },
  { num: 1020, display: 15, preview: "กับข้าว", thai: "มื้อหนึ่งของคนไทยมักมีข้าวกับกับข้าวหลายอย่างค่ะ", english: "A Thai meal usually has rice plus several dishes.", gloss: [["มื้อหนึ่ง", "a meal"], ["ของคนไทย", "for Thais"], ["มัก", "usually"], ["มี", "has"], ["ข้าว", "rice"], ["กับ", "plus"], ["กับข้าว", "dishes"], ["หลายอย่าง", "several"], ["ค่ะ", "polite(f)"]], cultural: "A typical meal is rice plus several shared dishes — ideally a balance of flavours and a soup — rather than one main plate. Variety across the table is the ideal." },
  { num: 1021, display: 16, preview: "ตลาดสด", thai: "แม่ชอบเดินตลาดสดซื้อกับข้าวสดๆทุกเช้าค่ะ", english: "Mum likes walking the fresh market for ingredients each morning.", gloss: [["แม่", "Mum"], ["ชอบ", "likes"], ["เดิน", "walk"], ["ตลาดสด", "fresh market"], ["ซื้อ", "buy"], ["กับข้าว", "ingredients"], ["สดๆ", "fresh"], ["ทุกเช้า", "each morning"], ["ค่ะ", "polite(f)"]], cultural: "The ตลาดสด (\"fresh market,\" i.e. wet market) is where many shop daily for fresh produce, meat and fish — bought the morning they're cooked rather than weekly at a supermarket." },
  { num: 1022, display: 17, preview: "โซเชียล", thai: "เดี๋ยวนี้หลายคนไปร้านอาหารเพื่อถ่ายรูปลงโซเชียล | มากกว่าจะไปกินจริงๆค่ะ", english: "These days many go to restaurants to photograph food for social media more than to actually eat.", gloss: [["เดี๋ยวนี้", "nowadays"], ["หลายคน", "many"], ["ไป", "go to"], ["ร้านอาหาร", "restaurants"], ["เพื่อ", "to"], ["ถ่ายรูป", "photograph food"], ["ลงโซเชียล", "post online"], ["มากกว่า", "more than"], ["จะ", "to"], ["ไปกิน", "actually eat"], ["จริงๆ", "really"], ["ค่ะ", "polite(f)"]], cultural: "\"Instagrammable\" cafés and dishes are a big trend; photogenic food and aesthetic cafés can matter as much as taste, and being seen at the right spot is part of the appeal." },
  { num: 1023, display: 18, preview: "งานบุญ", thai: "งานบุญทีไรก็มีอาหารเลี้ยงคนเยอะแยะเลยครับ", english: "Merit-making events always lay on lots of food for everyone.", gloss: [["งานบุญ", "merit events"], ["ทีไร", "whenever"], ["ก็", "always"], ["มี", "have"], ["อาหาร", "food"], ["เลี้ยงคน", "feed people"], ["เยอะแยะ", "loads"], ["เลย", "(emphasis)"], ["ครับ", "polite(m)"]], cultural: "งานบุญ — Buddhist merit-making occasions like ordinations, house blessings, funerals and temple fairs — almost always involve feeding large numbers of guests. Communal cooking and eating are central, and feeding people earns merit." },
  { num: 1024, display: 19, preview: "เผื่อ", thai: "คนไทยชอบสั่งเผื่อไว้เยอะๆ | เหลือยังดีกว่าขาดค่ะ", english: "Thais like to over-order — better to have extra than run short.", gloss: [["คนไทย", "Thais"], ["ชอบ", "like"], ["สั่ง", "order"], ["เผื่อ", "extra"], ["ไว้", "(to spare)"], ["เยอะๆ", "lots"], ["เหลือ", "leftover"], ["ยัง", "still"], ["ดีกว่า", "better than"], ["ขาด", "short"], ["ค่ะ", "polite(f)"]], cultural: "Over-ordering is deliberate generosity — better to have too much (and leftovers or ของฝาก) than to look stingy or leave anyone hungry. \"เหลือดีกว่าขาด\" — better extra than lacking — sums up the hosting mindset." },
  { num: 1025, display: 20, preview: "ทั่วโลก", thai: "อาหารไทยดังไปทั่วโลก | จนกลายเป็นหน้าตาของประเทศเลยค่ะ", english: "Thai food is famous worldwide — it's become the face of the country.", gloss: [["อาหารไทย", "Thai food"], ["ดัง", "famous"], ["ไปทั่วโลก", "worldwide"], ["จน", "so that"], ["กลายเป็น", "become"], ["หน้าตา", "the face"], ["ของประเทศ", "of the country"], ["เลย", "(emphasis)"], ["ค่ะ", "polite(f)"]], cultural: "Dishes like pad thai, green curry and tom yum have made Thai food globally beloved; the government has actively promoted it abroad (\"gastrodiplomacy\"), and Thais take real national pride in it." },
  { num: 1026, display: 21, preview: "ท้องถิ่น", thai: "ตามริมทางมีแผงลอยขายอาหารท้องถิ่นหลากหลายค่ะ", english: "Along the roads, stalls sell all sorts of local food.", gloss: [["ตาม", "along"], ["ริมทาง", "the roadside"], ["มี", "are"], ["แผงลอย", "stalls"], ["ขาย", "selling"], ["อาหารท้องถิ่น", "local food"], ["หลากหลาย", "all sorts"], ["ค่ะ", "polite(f)"]], cultural: "Roadside stalls are where you find a place's true local food — regional specialties and home-style dishes rarely seen in formal restaurants, sold cheaply to locals." },
  { num: 1027, display: 22, preview: "ต่างชาติ", thai: "เดี๋ยวนี้คนไทยกินอาหารต่างชาติกันเยอะ | ทั้งญี่ปุ่น เกาหลี ฝรั่งค่ะ", english: "These days Thais eat lots of foreign food — Japanese, Korean, Western.", gloss: [["เดี๋ยวนี้", "nowadays"], ["คนไทย", "Thais"], ["กิน", "eat"], ["อาหารต่างชาติ", "foreign food"], ["กัน", "(commonly)"], ["เยอะ", "a lot"], ["ทั้ง", "both"], ["ญี่ปุ่น", "Japanese"], ["เกาหลี", "Korean"], ["ฝรั่ง", "Western"], ["ค่ะ", "polite(f)"]], cultural: "Japanese, Korean and Western food are hugely popular, especially with young city-dwellers — Korean food rode the K-pop wave. (ฝรั่ง means both \"Westerner\" and Western food — and, confusingly, also guava.)" },
]
};
