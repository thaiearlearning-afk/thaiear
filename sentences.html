<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiEar — My sentences</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1A1A1A; --text-secondary: #5A5A5A; --text-tertiary: #9A9A9A;
    --accent: #4B41AD; --accent-light: #EEEDFE; --accent-mid: #534AB7;
    --gold: #F0CC5C; --gold-dark: #C8A030; --purple-mid: #7F77DD;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font-ui: 'Inter', system-ui, sans-serif; --font-thai: 'Sarabun', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
  .page-wrap { max-width: 680px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
  .acct-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

  .prog-head { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; }
  .prog-head-icon { flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; background: var(--accent-light); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; }
  .prog-head-icon svg { width: 24px; height: 24px; }
  .prog-head-title { font-size: 25px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; }

  .intro { font-size: 13.5px; color: var(--text-secondary); line-height: 1.65; margin-bottom: 1.75rem; padding: 0.9rem 1.1rem; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-md); }
  .muted { font-size: 13px; color: var(--text-tertiary); }

  /* boxer image + "Thai inbound…" with the same animated 1→2→3 dot cycle as the progress page */
  .fluency-block { text-align: center; margin: 0.25rem 0 1.75rem; }
  .fluency-img { width: 210px; max-width: 59%; height: auto; display: block; margin: 0 auto 0.4rem; }
  .fluency-text { font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: 0.02em; }
  .fluency-text .dots { display: inline-block; width: 1.1em; text-align: left; }
  .fluency-text .dots::after { content: '.'; animation: fluency-dots 1.4s infinite; }
  @keyframes fluency-dots {
    0%, 100% { content: '.'; }
    33%      { content: '..'; }
    66%      { content: '...'; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fluency-text .dots::after { animation: none; content: '…'; }
  }

  .btn { font-family: var(--font-ui); font-size: 14px; font-weight: 500; border-radius: var(--radius-sm); padding: 9px 18px; cursor: pointer; border: 0.5px solid var(--border-strong); transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-mid); }

  /* topic heading (one per live topic) */
  .topic-group { margin-bottom: 1.6rem; }
  .topic-group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 0.6rem; padding-bottom: 0.4rem; border-bottom: 0.5px solid var(--border); }
  .topic-group-name { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary); }
  .topic-group-name a { color: inherit; text-decoration: none; }
  .topic-group-name a:hover { color: var(--accent); }
  .topic-group-count { font-size: 12px; color: var(--text-tertiary); }
  .topic-empty { font-size: 13px; color: var(--text-tertiary); font-style: italic; padding: 0.1rem 0 0.3rem; }

  /* sentence cards (subset of the player's card styles — this page renders flagged nuggets) */
  .sc { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 7px; overflow: hidden; transition: border-color 0.15s; }
  .sc:hover { border-color: var(--border-strong); }
  .sc-head { display: flex; align-items: center; gap: 10px; padding: 0.7rem 1rem; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .sc-play { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-light); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
  .sc-play:hover { background: var(--accent); }
  .sc-play:hover svg { fill: #fff; }
  .sc-play svg { fill: var(--accent); width: 10px; height: 10px; margin-left: 1px; }
  .sc-play.playing { background: var(--accent); }
  .sc-play.playing svg { fill: #fff; margin-left: 0; }
  .sc-prev { font-family: var(--font-thai); font-size: 16px; color: var(--text-primary); flex: 1; line-height: 1.4; }
  .sc-prev .ell { color: var(--text-tertiary); }
  .sc-flag { width: 26px; height: 26px; border-radius: 50%; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; transition: background 0.15s, transform 0.15s; }
  .sc-flag:hover { background: var(--accent-light); }
  .sc-flag svg { width: 15px; height: 15px; fill: var(--accent); stroke: var(--accent); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .sc-flag.pending { opacity: 0.5; pointer-events: none; }
  .sc-lock { width: 14px; height: 14px; color: var(--text-tertiary); flex-shrink: 0; display: inline-flex; }
  .sc-body { border-top: 0.5px solid var(--border); }
  .reveal-row { padding: 0.6rem 1rem; border-bottom: 0.5px solid var(--border); }
  .reveal-row:last-child { border-bottom: none; }
  .row-thai { font-family: var(--font-thai); font-size: 19px; font-weight: 400; color: var(--text-primary); line-height: 1.5; }
  .row-english { font-size: 14px; color: var(--text-secondary); }
  .row-notes { background: var(--bg); }
  .gloss-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
  .gloss-chip { background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px; padding: 2px 9px; font-size: 12px; line-height: 1.5; }
  .g-thai { font-family: var(--font-thai); color: var(--text-primary); font-weight: 500; }
  .g-eq { color: var(--text-tertiary); margin: 0 2px; }
  .g-eng { color: var(--text-secondary); }
  .cultural-note { font-size: 11.5px; color: var(--text-tertiary); font-style: italic; margin-top: 5px; padding-top: 5px; border-top: 0.5px solid var(--border); line-height: 1.5; }
  .sc-body { display: none; }
  .sc.open .sc-body { display: block; }

  /* locked (not currently entitled) — greyed + inert; only the remove flag still works */
  .sc.locked { opacity: 0.55; }
  .sc.locked .sc-head { cursor: default; }
  .sc.locked .sc-prev { color: var(--text-tertiary); }

  .login-box { max-width: 360px; margin: 1rem auto 0; text-align: center; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.75rem 1.5rem; }
  .login-btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; padding: 11px 18px; }

  @media (max-width: 600px) {
    .page-wrap { padding: 2rem 1rem 3rem; }
    .prog-head-title { font-size: 21px; }
    .sc-prev { font-size: 15px; }
    .row-thai { font-size: 17px; }
  }
</style>
</head>
<body>

<div id="site-nav-root" style="min-height:54px;background:var(--surface);border-bottom:0.5px solid var(--border)"></div>

<div class="page-wrap">
  <div class="acct-eyebrow">ThaiEar</div>
  <div id="sentences-root"><p class="muted">Loading…</p></div>
</div>

<audio id="sc-audio" preload="none" style="display:none"></audio>

<script>
var AUDIO_BASE = 'https://audio.thaiear.com';
var AUDIO_API = '/api/audio';
var PERSON_SVG =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>';
var FLAG_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>';
var LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
var PLAY_TRI = '<polygon points="4,2 13,8 4,14"/>';
var PLAY_STOP = '<rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/>';

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function bare(f) { return String(f || '').toLowerCase().replace(/\.html$/, ''); }
function cleanThai(t) { return String(t || '').replace(/ \| /g, ' '); }
function pad2(n) { return String(n).padStart(2, '0'); }

// Live topics in display order (flattened, split parts as their own rows), each with its
// access tier — same source as the progress page, so the two never drift.
function liveRows() {
  var T = window.ThaiEarTopics;
  if (!T) return [];
  var rows = [];
  T.topics.forEach(function (t) {
    if (t.parts) {
      t.parts.forEach(function (part) {
        if (part && typeof part === 'object' && part.page) {
          rows.push({ key: bare(part.page), name: part.name || t.name, page: part.page, access: t.access || 'free' });
        }
      });
    } else if (T.liveTopics[t.id]) {
      rows.push({ key: bare(T.liveTopics[t.id]), name: t.name, page: T.liveTopics[t.id], access: t.access || 'free' });
    }
  });
  return rows;
}

/* ---- per-sentence audio (mirrors player.js: free = public CDN, gated = signed /api/audio) ---- */
var playingId = null;
function audioEl() { return document.getElementById('sc-audio'); }
function buildUrl(file, gated) {
  if (!gated) return Promise.resolve(AUDIO_BASE + '/' + file);
  var a = window.ThaiEarAuth;
  var token = a && a.getAccessToken && a.getAccessToken();
  if (!token) return Promise.reject({ code: 'noauth' });
  return fetch(AUDIO_API + '?file=' + encodeURIComponent(file), { headers: { Authorization: 'Bearer ' + token } })
    .then(function (r) { if (!r.ok) return Promise.reject({ code: r.status }); return r.json(); })
    .then(function (j) { if (!j || !j.url) return Promise.reject({ code: 'nourl' }); return j.url; });
}
function setPlayIcon(id, playing) {
  var btn = document.querySelector('[data-play="' + id + '"]');
  if (!btn) return;
  btn.classList.toggle('playing', playing);
  var svg = btn.querySelector('svg'); if (svg) svg.innerHTML = playing ? PLAY_STOP : PLAY_TRI;
}
function stopAudio() {
  var el = audioEl();
  if (el) { el.pause(); el.removeAttribute('src'); }
  if (playingId) { setPlayIcon(playingId, false); playingId = null; }
}
function playFlagged(e, id, prefix, num, gated) {
  e.stopPropagation();
  var el = audioEl();
  if (playingId === id) { stopAudio(); return; }
  stopAudio();
  var file = prefix + '_S' + pad2(num) + '_TH.mp3';
  playingId = id;
  setPlayIcon(id, true);
  buildUrl(file, gated).then(function (url) {
    if (playingId !== id) return;
    el.src = url; el.play();
  }).catch(function () {
    if (playingId === id) { setPlayIcon(id, false); playingId = null; }
  });
}

/* ---- remove a flag from this list ---- */
var removeLock = false;
function removeItem(e, topicKey, num) {
  e.stopPropagation();
  var a = window.ThaiEarAuth;
  if (!a || !a.removeFlag || removeLock) return;
  removeLock = true;
  stopAudio();
  var btn = e.currentTarget;
  if (btn) btn.classList.add('pending');
  a.removeFlag(topicKey, num).then(function () { render(); })
    .catch(function (err) { console.warn('remove flag failed', err); if (btn) btn.classList.remove('pending'); })
    .then(function () { setTimeout(function () { removeLock = false; }, 250); });
}
function toggleExpand(id) {
  var card = document.getElementById(id);
  if (card && !card.classList.contains('locked')) card.classList.toggle('open');
}

function chipHtml(gloss) {
  if (!gloss || !gloss.length) return '';
  return gloss.map(function (p) {
    return '<span class="gloss-chip"><span class="g-thai">' + esc(p[0]) + '</span><span class="g-eq">=</span><span class="g-eng">' + esc(p[1]) + '</span></span>';
  }).join('');
}

// One flagged sentence. entitled → full interactive card; not entitled → greyed + inert
// (no expand, no audio), but the remove flag stays usable.
function cardHtml(row, rec) {
  var s = rec.sentence || {};
  var id = 'sf-' + row.key + '-' + rec.num;
  var gated = row.access === 'member' || row.access === 'premium';
  var entitled = window.ThaiEarTopics.canAccess(row.access);
  var flagBtn = '<button class="sc-flag flagged" onclick="removeItem(event,\'' + row.key + '\',' + rec.num + ')" aria-label="Remove from My sentences" title="Remove from My sentences">' + FLAG_SVG + '</button>';

  if (!entitled) {
    return '<div class="sc locked" id="' + esc(id) + '">' +
      '<div class="sc-head">' +
        '<span class="sc-lock">' + LOCK_SVG + '</span>' +
        '<span class="sc-prev">' + esc(s.preview || '') + '<span class="ell">…</span></span>' +
        flagBtn +
      '</div>' +
    '</div>';
  }

  var body = '<div class="sc-body">' +
      '<div class="reveal-row row-thai">' + esc(cleanThai(s.thai)) + '</div>' +
      '<div class="reveal-row row-english">' + esc(s.english || '') + '</div>' +
      ((s.gloss && s.gloss.length) || s.cultural
        ? '<div class="reveal-row row-notes">' +
            (s.gloss && s.gloss.length ? '<div class="gloss-row">' + chipHtml(s.gloss) + '</div>' : '') +
            (s.cultural ? '<div class="cultural-note">' + esc(s.cultural) + '</div>' : '') +
          '</div>'
        : '') +
    '</div>';

  return '<div class="sc" id="' + esc(id) + '">' +
    '<div class="sc-head" onclick="toggleExpand(\'' + esc(id) + '\')">' +
      '<button class="sc-play" data-play="' + esc(id) + '" onclick="playFlagged(event,\'' + esc(id) + '\',\'' + esc(s.audioPrefix || '') + '\',' + rec.num + ',' + (gated ? 'true' : 'false') + ')" aria-label="Play sentence">' +
        '<svg viewBox="0 0 16 16">' + PLAY_TRI + '</svg>' +
      '</button>' +
      '<span class="sc-prev">' + esc(s.preview || '') + '<span class="ell">…</span></span>' +
      flagBtn +
    '</div>' +
    body +
  '</div>';
}

function loggedOutHtml() {
  return '<h1 class="prog-head-title" style="margin-bottom:1rem">My sentences</h1>' +
    '<div class="login-box">' +
      '<p style="margin-bottom:1.2rem">Sign in to flag sentences across topics and collect them here as a personal focus list.</p>' +
      '<button class="btn btn-primary login-btn" onclick="ThaiEarAuth.signInWithGoogle()">Continue with Google</button>' +
      '<p class="muted" style="margin-top:0.9rem">Prefer email? <a href="account.html" style="color:var(--accent);text-decoration:none;font-weight:500">Sign in here →</a></p>' +
    '</div>';
}

var loadErr = null;
function render() {
  var root = document.getElementById('sentences-root');
  if (!root) return;
  var a = window.ThaiEarAuth;
  if (!a || !a.isReady) { root.innerHTML = '<p class="muted">Loading…</p>'; return; }
  var user = a.getUser && a.getUser();
  if (!user) { stopAudio(); root.innerHTML = loggedOutHtml(); return; }
  if (a.isFlagsLoaded && !a.isFlagsLoaded()) {
    if (loadErr) { root.innerHTML = '<p class="muted">Couldn’t load your sentences: ' + esc((loadErr && loadErr.message) || String(loadErr)) + '. Please refresh.</p>'; return; }
    root.innerHTML = '<p class="muted">Loading your sentences…</p>';
    a.loadFlags().then(function () { loadErr = null; render(); }).catch(function (e) { loadErr = e; render(); });
    return;
  }

  // group flags by topic_key
  var flags = a.getFlags();
  var byTopic = {};
  flags.forEach(function (f) { (byTopic[f.topic_key] = byTopic[f.topic_key] || []).push(f); });
  Object.keys(byTopic).forEach(function (k) { byTopic[k].sort(function (x, y) { return x.num - y.num; }); });

  var head =
    '<div class="prog-head">' +
      '<span class="prog-head-icon">' + PERSON_SVG + '</span>' +
      '<h1 class="prog-head-title">' + esc(user.username) + '’s sentences</h1>' +
    '</div>';

  // Sits below the header, above the intro/empty message — mirrors the meditator block
  // on the progress page (same font/style), with the animated ellipsis.
  var muaythai =
    '<div class="fluency-block">' +
      '<img class="fluency-img" src="muaythai.png" alt="Muay Thai boxer" width="150">' +
      '<div class="fluency-text">Thai inbound<span class="dots" aria-hidden="true"></span></div>' +
    '</div>';

  var rows = liveRows();
  var total = flags.length;

  if (!total) {
    root.innerHTML = head +
      '<div class="intro">You haven’t flagged any sentences yet. On any topic page, tap the ' +
      '<span style="color:var(--accent);font-weight:600">flag</span> next to a sentence (just right of the 🐢) ' +
      'to save it here as a personal focus list.</div>' + muaythai;
    return;
  }

  var intro = '<p class="intro">Sentences you’ve flagged, grouped by topic. Tap one to reveal the Thai, English and notes, ' +
    'or play its audio. Remove any with its flag.</p>';

  var groups = rows.map(function (row) {
    var items = byTopic[row.key] || [];
    var headRow = '<div class="topic-group-head">' +
        '<span class="topic-group-name"><a href="' + esc(row.page) + '">' + esc(row.name) + '</a></span>' +
        (items.length ? '<span class="topic-group-count">' + items.length + '</span>' : '') +
      '</div>';
    var bodyRows = items.length
      ? items.map(function (rec) { return cardHtml(row, rec); }).join('')
      : '<div class="topic-empty">No sentences flagged here yet.</div>';
    return '<div class="topic-group">' + headRow + bodyRows + '</div>';
  }).join('');

  root.innerHTML = head + intro + muaythai + groups;
}

// reset play icon when a clip finishes (the <audio> exists above this script already)
(function () {
  var el = document.getElementById('sc-audio');
  if (el) { el.addEventListener('ended', stopAudio); el.addEventListener('error', stopAudio); }
})();

function init() {
  var a = window.ThaiEarAuth;
  if (a && a.isReady && a.getUser && a.getUser() && a.loadFlags) {
    a.loadFlags().then(function () { loadErr = null; render(); }).catch(function (e) { loadErr = e; render(); });
  } else {
    render();
  }
}
window.addEventListener('thaiear:auth', function () { loadErr = null; init(); });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
<script src="topics.js" defer></script>
<script src="nav.js" defer></script>
</body>
</html>
