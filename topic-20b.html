<script>
window.ThaiEarTopic = {

  sentences: [
  { num: 856, display: 1, preview: "เพื่อนร่วมงาน", thai: "เพื่อนร่วมงานที่นี่น่ารักกันทุกคนเลยค่ะ", english: "My colleagues here are all really nice.", gloss: [["เพื่อนร่วมงาน", "coworkers"], ["ที่นี่", "here"], ["น่ารัก", "lovely"], ["กัน", "(all)"], ["ทุกคน", "everyone"], ["เลย", "(emphasis)"], ["ค่ะ", "polite(f)"]], cultural: "น่ารัก (lit. 'worthy of love') is used broadly for 'nice / sweet / lovely', not only 'cute'." },
  { num: 857, display: 2, preview: "ดูงาน", thai: "ช่วยดูงานให้หน่อยได้ไหมคะ | ไม่แน่ใจตรงนี้", english: "Could you look over my work? I'm not sure about this part.", gloss: [["ช่วย", "please"], ["ดูงาน", "check this"], ["ให้", "for me"], ["หน่อย", "a bit"], ["ได้ไหม", "could you?"], ["คะ", "polite(f)"], ["ไม่แน่ใจ", "not sure"], ["ตรงนี้", "about this part"]], cultural: "ช่วย…หน่อย…ได้ไหม is the standard softened way to ask a favour: 'could you please … ?'" },
  { num: 858, display: 3, preview: "อบรม", thai: "บริษัทส่งผมไปอบรมที่กรุงเทพครับ", english: "The company is sending me to a training in Bangkok.", gloss: [["บริษัท", "the company"], ["ส่ง", "sent"], ["ผม", "me"], ["ไป", "to"], ["อบรม", "training"], ["ที่", "in"], ["กรุงเทพ", "Bangkok"], ["ครับ", "polite(m)"]], cultural: "" },
  { num: 859, display: 4, preview: "จ้าง", thai: "ที่ทำงานเพิ่งจ้างพนักงานใหม่มาสองคนค่ะ", english: "Work just hired two new staff.", gloss: [["ที่ทำงาน", "my workplace"], ["เพิ่ง", "just"], ["จ้าง", "hired"], ["พนักงานใหม่", "new staff"], ["มา", "(in)"], ["สองคน", "two"], ["ค่ะ", "polite(f)"]], cultural: "" },
  { num: 860, display: 5, preview: "งานใหม่", thai: "งานใหม่เป็นยังไงบ้างครับ | ชอบไหม", english: "How's the new job? Do you like it?", gloss: [["งานใหม่", "the new job"], ["เป็นยังไงบ้าง", "how's it going"], ["ครับ", "polite(m)"], ["ชอบ", "like it"], ["ไหม", "(question)"]], cultural: "" },
  { num: 861, display: 6, preview: "เงินเดือน", thai: "เงินเดือนออกแล้ว! | ไปเลี้ยงข้าวกันไหมครับ", english: "Payday's here! Shall we go out for a meal?", gloss: [["เงินเดือน", "salary"], ["ออก", "is out"], ["แล้ว", "already"], ["ไป", "go"], ["เลี้ยงข้าว", "treat to a meal"], ["กัน", "together"], ["ไหม", "(question)"], ["ครับ", "polite(m)"]], cultural: "เลี้ยงข้าว = to treat others to a meal. On payday the one with money (or the senior) often picks up the tab for the group." },
  { num: 862, display: 7, preview: "เครื่องชงกาแฟ", thai: "เจอกันที่เครื่องชงกาแฟบ่อยเลยนะคะ | วันนี้ยุ่งเหรอ", english: "We keep bumping into each other at the coffee machine — busy day?", gloss: [["เจอกัน", "we meet"], ["ที่", "at"], ["เครื่องชงกาแฟ", "the coffee machine"], ["บ่อย", "often"], ["เลย", "(emphasis)"], ["นะคะ", "polite(f)"], ["วันนี้", "today"], ["ยุ่ง", "busy"], ["เหรอ", "really?"]], cultural: "เหรอ is a soft, friendly checking particle — 'oh? / is that so?'" },
  { num: 863, display: 8, preview: "การทำงานเป็นทีม", thai: "งานนี้ต้องอาศัยการทำงานเป็นทีม | คนเดียวทำไม่ไหวครับ", english: "This job relies on teamwork — one person can't manage alone.", gloss: [["งานนี้", "this job"], ["ต้อง", "needs"], ["อาศัย", "to rely on"], ["การทำงานเป็นทีม", "teamwork"], ["คนเดียว", "alone"], ["ทำไม่ไหว", "can't manage"], ["ครับ", "polite(m)"]], cultural: "การ + a verb turns the action into a noun: ทำงาน 'to work' → การทำงาน 'working / work'." },
  { num: 864, display: 9, preview: "เกรงใจ", thai: "ที่ทำงานคนไทย | เรามักจะเกรงใจเจ้านายกันค่ะ", english: "In Thai workplaces, we tend to be deferential to the boss.", gloss: [["ที่ทำงาน", "workplaces"], ["คนไทย", "Thai"], ["เรา", "we"], ["มักจะ", "tend to"], ["เกรงใจ", "defer to"], ["เจ้านาย", "the boss"], ["กัน", "(all)"], ["ค่ะ", "polite(f)"]], cultural: "เกรงใจ is a core Thai social value with no neat English equal — a blend of deference, consideration, and reluctance to impose on or trouble others, especially seniors." },
  { num: 865, display: 10, preview: "ปรึกษา", thai: "เวลามีปัญหากับงาน | ผมจะปรึกษาพี่ที่ทำงานก่อนครับ", english: "When I have a problem at work, I consult a senior colleague first.", gloss: [["เวลา", "when"], ["มีปัญหา", "there's a problem"], ["กับงาน", "with work"], ["ผม", "I"], ["จะ", "(will)"], ["ปรึกษา", "consult"], ["พี่ที่ทำงาน", "a senior colleague"], ["ก่อน", "first"], ["ครับ", "polite(m)"]], cultural: "Thai workplaces map seniority onto sibling terms: a พี่ (elder) is a senior colleague, a น้อง (younger) a junior one." },
  { num: 866, display: 11, preview: "เด็กจบใหม่", thai: "เด็กจบใหม่มักจะเริ่มจากตำแหน่งเล็กๆก่อนค่ะ", english: "New graduates usually start from junior positions.", gloss: [["เด็กจบใหม่", "new graduates"], ["มักจะ", "usually"], ["เริ่ม", "start"], ["จาก", "from"], ["ตำแหน่งเล็กๆ", "junior roles"], ["ก่อน", "first"], ["ค่ะ", "polite(f)"]], cultural: "" },
  { num: 867, display: 12, preview: "ตำแหน่งสูง", thai: "ยิ่งตำแหน่งสูง | ยิ่งต้องรับผิดชอบมากขึ้นครับ", english: "The higher your position, the more responsibility you take on.", gloss: [["ยิ่ง", "the more"], ["ตำแหน่ง", "the role"], ["สูง", "senior"], ["ยิ่ง", "the more"], ["ต้อง", "must"], ["รับผิดชอบ", "take on"], ["มากขึ้น", "increasingly"], ["ครับ", "polite(m)"]], cultural: "ยิ่ง…ยิ่ง is the correlative 'the more X, the more Y'." },
  { num: 868, display: 13, preview: "งานราชการ", thai: "หลายคนเลือกงานราชการ | เพราะมั่นคงกว่าค่ะ", english: "Many people choose government jobs because they're more stable.", gloss: [["หลายคน", "many"], ["เลือก", "choose"], ["งานราชการ", "government jobs"], ["เพราะ", "because"], ["มั่นคง", "secure"], ["กว่า", "more"], ["ค่ะ", "polite(f)"]], cultural: "งานราชการ (civil-service jobs) are prized in Thailand for security, benefits and social standing, even where private-sector pay is higher." },
  { num: 869, display: 14, preview: "วัฒนธรรมองค์กร", thai: "วัฒนธรรมองค์กรที่นี่ค่อนข้างแย่ | คนชอบนินทากันค่ะ", english: "The workplace culture here is rather toxic — people love to gossip.", gloss: [["วัฒนธรรมองค์กร", "the work culture"], ["ที่นี่", "here"], ["ค่อนข้าง", "rather"], ["แย่", "bad"], ["คน", "people"], ["ชอบ", "like to"], ["นินทา", "gossip"], ["กัน", "(each other)"], ["ค่ะ", "polite(f)"]], cultural: "ค่อนข้าง = 'rather / fairly' — a moderate intensifier, gentler than มาก." },
  { num: 870, display: 15, preview: "ปรับตัว", thai: "ทำงานกับคนเยอะๆ | ต้องรู้จักปรับตัวด้วยค่ะ", english: "Working with lots of people, you have to know how to adapt.", gloss: [["ทำงาน", "working"], ["กับ", "with"], ["คน", "people"], ["เยอะๆ", "many"], ["ต้อง", "must"], ["รู้จัก", "learn to"], ["ปรับตัว", "adapt"], ["ด้วย", "too"], ["ค่ะ", "polite(f)"]], cultural: "" },
  { num: 871, display: 16, preview: "ชม", thai: "หัวหน้าชมว่าผมทำงานละเอียดดีครับ", english: "My boss praised me for being thorough.", gloss: [["หัวหน้า", "my boss"], ["ชม", "praised"], ["ว่า", "that"], ["ผม", "I"], ["ทำงาน", "work"], ["ละเอียด", "thoroughly"], ["ดี", "well"], ["ครับ", "polite(m)"]], cultural: "" },
  { num: 872, display: 17, preview: "ตำหนิ", thai: "เมื่อวานโดนหัวหน้าตำหนิเรื่องงานมาครับ", english: "Yesterday I got told off by the boss about my work.", gloss: [["เมื่อวาน", "yesterday"], ["โดน", "got"], ["หัวหน้า", "(by) the boss"], ["ตำหนิ", "scolded"], ["เรื่องงาน", "over work"], ["มา", "(just)"], ["ครับ", "polite(m)"]], cultural: "โดน marks an unwanted, adversative passive — 'I got [something bad] done to me' — the flip side of the praise line before it." },
  { num: 873, display: 18, preview: "ทดลองงาน", thai: "ผ่านช่วงทดลองงานแล้วเหรอคะ | ยินดีด้วยนะ", english: "You're past your probation? Congratulations!", gloss: [["ผ่าน", "passed"], ["ช่วงทดลองงาน", "probation"], ["แล้ว", "already"], ["เหรอ", "really?"], ["คะ", "polite(f)"], ["ยินดีด้วย", "congrats"], ["นะ", "(softener)"]], cultural: "ยินดีด้วย (lit. 'glad with you') is the standard 'congratulations'." },
  { num: 874, display: 19, preview: "ทำงานจากที่บ้าน", thai: "เดี๋ยวนี้หลายบริษัทให้พนักงานทำงานจากที่บ้านได้ค่ะ", english: "These days many companies let staff work from home.", gloss: [["เดี๋ยวนี้", "nowadays"], ["หลายบริษัท", "many firms"], ["ให้", "let"], ["พนักงาน", "staff"], ["ทำงาน", "work"], ["จากที่บ้าน", "from home"], ["ได้", "(can)"], ["ค่ะ", "polite(f)"]], cultural: "ให้ + person + verb = 'let / have someone do something' (a causative)." },
  { num: 875, display: 20, preview: "พยายาม", thai: "ผมพยายามไม่เอางานกลับมาทำที่บ้านครับ", english: "I try not to bring work home.", gloss: [["ผม", "I"], ["พยายาม", "try"], ["ไม่", "not to"], ["เอางาน", "bring work"], ["กลับมา", "back"], ["ทำ", "to do"], ["ที่บ้าน", "at home"], ["ครับ", "polite(m)"]], cultural: "" },
  { num: 876, display: 21, preview: "ทำงานหนัก", thai: "ทำงานหนักทุกวันนี้ | ก็เพื่ออนาคตของลูกๆค่ะ", english: "I work hard every day for my children's future.", gloss: [["ทำงานหนัก", "working hard"], ["ทุกวันนี้", "these days"], ["ก็", "is"], ["เพื่อ", "for"], ["อนาคต", "the future"], ["ของลูกๆ", "of the kids"], ["ค่ะ", "polite(f)"]], cultural: "เพื่อ = 'for / in order to', marking purpose." },
  { num: 877, display: 22, preview: "บ่น", thai: "แม้ว่าจะเหนื่อยแค่ไหน | เขาก็ไม่เคยบ่นเรื่องงานเลยครับ", english: "No matter how tired he is, he never complains about work.", gloss: [["แม้ว่า", "even though"], ["จะ", "(may be)"], ["เหนื่อย", "tired"], ["แค่ไหน", "however"], ["เขา", "he"], ["ก็", "still"], ["ไม่เคย", "never"], ["บ่น", "complains"], ["เรื่องงาน", "about work"], ["เลย", "(at all)"], ["ครับ", "polite(m)"]], cultural: "แม้ว่า…ก็ = 'even though … (still)', a concessive frame." },
  { num: 878, display: 23, preview: "สวัสดิการ", thai: "ที่บริษัทนี้สวัสดิการดีมาก | มีประกันสุขภาพให้ด้วยค่ะ", english: "This company's benefits are great — they even provide health insurance.", gloss: [["ที่บริษัทนี้", "at this company"], ["สวัสดิการ", "the benefits"], ["ดีมาก", "great"], ["มี", "there's"], ["ประกันสุขภาพ", "health insurance"], ["ให้", "provided"], ["ด้วย", "too"], ["ค่ะ", "polite(f)"]], cultural: "" },
  { num: 879, display: 24, preview: "ภูมิใจ", thai: "ถึงงานจะหนัก | แต่ผมก็ภูมิใจที่ได้ทำครับ", english: "Even though the work is hard, I'm proud to do it.", gloss: [["ถึง", "even though"], ["งาน", "the work"], ["จะ", "(is)"], ["หนัก", "hard"], ["แต่", "but"], ["ผม", "I"], ["ก็", "still"], ["ภูมิใจ", "proud"], ["ที่ได้ทำ", "to do it"], ["ครับ", "polite(m)"]], cultural: "ถึง…ก็ is another 'even though … still' concessive — a touch more colloquial than แม้ว่า." },
]
};
