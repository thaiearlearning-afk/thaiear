<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1A1A1A; --text-secondary: #5A5A5A; --text-tertiary: #9A9A9A;
    --accent: #4B41AD; --accent-light: #EEEDFE; --accent-mid: #534AB7;
    --gold: #F0CC5C; --gold-dark: #C8A030; --gold-light: #FBF5DC; --purple-mid: #7F77DD;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font-ui: 'Inter', system-ui, sans-serif; --font-thai: 'Sarabun', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
  .page-wrap { position: relative; max-width: 620px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }

  .gate-close {
    position: absolute; top: 1.5rem; right: 1.25rem;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--surface); border: 0.5px solid var(--border-strong);
    color: var(--text-secondary); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s, border-color 0.15s; z-index: 5;
  }
  .gate-close:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
  .gate-close svg { width: 16px; height: 16px; }

  .sub-eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-light);
    padding: 4px 11px 4px 9px; border-radius: 20px; margin-bottom: 14px;
  }
  .sub-eyebrow svg { width: 12px; height: 12px; }
  .sub-title { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.75rem; }
  .sub-lede { color: var(--text-secondary); max-width: 48ch; margin-bottom: 2rem; }

  .sub-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.75rem 1.6rem; }

  .benefits { list-style: none; display: flex; flex-direction: column; gap: 0.85rem; margin-bottom: 1.75rem; }
  .benefit { display: flex; align-items: flex-start; gap: 11px; }
  .benefit-check {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-light); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .benefit-check svg { width: 13px; height: 13px; }
  .benefit-text strong { font-weight: 500; color: var(--text-primary); }
  .benefit-text span { display: block; font-size: 13px; color: var(--text-secondary); }

  .btn { font-family: var(--font-ui); font-size: 15px; font-weight: 500; border-radius: var(--radius-sm); padding: 11px 20px; cursor: pointer; border: 0.5px solid var(--border-strong); transition: background 0.15s, border-color 0.15s, color 0.15s; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 9px; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover:not([disabled]) { background: var(--accent-mid); }
  .btn-ghost { background: var(--surface); color: var(--text-primary); }
  .btn-ghost:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
  .btn[disabled] { opacity: 0.6; cursor: default; }
  .btn svg { width: 18px; height: 18px; }
  /* Email sign-in, mirroring account.html's login box (2026-08-15). The magic link already
     existed in auth.js and on account.html, but this page — the one every "Create a free
     account" link points at — offered Google only. */
  .login-sep { display: flex; align-items: center; gap: 12px; margin: 1.1rem 0; color: var(--text-tertiary); font-size: 12px; }
  .login-sep::before, .login-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .login-input { width: 100%; text-align: left; font-family: var(--font-ui); font-size: 14px; padding: 10px 12px;
    border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); margin-bottom: 0.7rem;
    background: var(--surface); color: var(--text-primary); }
  .login-input:focus { outline: none; border-color: var(--accent); }
  .sub-status { font-size: 13px; color: var(--text-secondary); text-align: center; margin-top: 0.9rem; min-height: 1.2em; }
  .sub-note { font-size: 13px; color: var(--text-tertiary); text-align: center; margin-top: 1rem; }
  .sub-note a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .sub-back { display: inline-block; margin-top: 1.75rem; font-size: 14px; font-weight: 500; color: var(--accent); text-decoration: none; }
  .sub-back:hover { color: var(--accent-mid); }

  @media (max-width: 600px) {
    .page-wrap { padding: 2rem 1rem 3rem; }
    .sub-title { font-size: 25px; }
    .sub-card { padding: 1.4rem 1.25rem; }
  }
</style>

<script src="/identity.js"></script>

<body>

<!-- Top nav comes from the shared nav.js (do NOT inline it). -->
<div id="site-nav-root" style="min-height:54px;background:var(--surface);border-bottom:0.5px solid var(--border)"></div>

<div class="page-wrap">

  <span class="sub-eyebrow">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg>
    Email sign-in
  </span>
  <h1 class="sub-title" id="cf-title">Almost there</h1>
  <p class="sub-lede" id="cf-lede">Tap the button below to finish signing in to ThaiEar.</p>

  <div class="sub-card">

    <!-- The whole point of this page: verification happens on CLICK, never on load.
         A mail-security scanner issues a GET; a GET must verify nothing. -->
    <button class="btn btn-primary" id="cf-btn" onclick="cfVerify()">Sign me in</button>

    <!-- ⚠ ALWAYS VISIBLE, and it must stay that way (fixed 2026-08-19 after the first live
         test). The code box used to be revealed ONLY when a link verify had already failed,
         which meant a user who wanted to use the code INSTEAD of the link — the exact case
         it exists for — had no way to reach it. "It's there on failure" is not the same as
         "reachable": the whole point is a route that does not depend on the link working. -->
    <p style="margin-top:14px;text-align:center">
      <button type="button" id="cf-code-toggle" onclick="cfShowCode()"
              style="background:none;border:0;padding:4px;font-family:var(--font-ui);font-size:13px;color:var(--accent);text-decoration:underline;cursor:pointer">
        Prefer to type the code from your email instead?
      </button>
    </p>

    <p id="cf-status" style="margin-top:12px;min-height:1.2em;font-size:13px;color:var(--text-tertiary)"></p>

    <!-- ⚠ WHAT THIS IS FOR — and what it is NOT. {{ .Token }} and the link are two
         renderings of the SAME OTP record, so this is a second way IN, never a second
         credential — and it is NOT protection against a sandbox that presses the button
         above, because that spends the token and kills the code with it. What it buys:
         the email opened in a WebView or on another device and the user wants to sign in
         where they already are; a corporate rewriter mangled the URL; and it is the
         migration path to a code-ONLY email, which IS the defence if a scanner ever
         starts pressing buttons. -->
    <div id="cf-code-wrap" style="display:none;margin-top:1.4rem;padding-top:1.4rem;border-top:0.5px solid var(--border)">
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:0.7rem">Enter the code printed in the same email.</p>
      <label for="cf-email" style="display:block;font-size:12px;color:var(--text-tertiary);margin-bottom:4px">Your email address</label>
      <input type="email" id="cf-email" autocomplete="email" inputmode="email" placeholder="you@example.com"
             style="width:100%;font-family:var(--font-ui);font-size:15px;padding:10px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg);color:var(--text-primary);margin-bottom:10px">
      <label for="cf-code" style="display:block;font-size:12px;color:var(--text-tertiary);margin-bottom:4px">Code from your email</label>
      <!-- ⚠ maxlength 10, NOT 6. Supabase's OTP length is a project setting (`mailer_otp_length`)
           and this project issues EIGHT digits — a 6-cap silently truncated what the user typed
           and made a correct code unusable. Do not "tidy" it back to the documented default. -->
      <input type="text" id="cf-code" autocomplete="one-time-code" inputmode="numeric" maxlength="10" placeholder="12345678"
             style="width:100%;font-family:var(--font-ui);font-size:18px;letter-spacing:0.25em;padding:10px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg);color:var(--text-primary);margin-bottom:12px">
      <button class="btn btn-ghost" id="cf-code-btn" onclick="cfVerifyCode()">Sign in with the code</button>
      <p id="cf-code-status" style="margin-top:10px;min-height:1.2em;font-size:13px;color:var(--text-tertiary)"></p>
    </div>

  </div>

  <p style="margin-top:1.5rem;font-size:13px;color:var(--text-tertiary)">
    Not expecting this email? You can close this page &mdash; nothing happens until you tap the button.
  </p>

</div>

<script>
/* ============================================================
   confirm.html — the sign-in interstitial (2026-08-19).

   THE ONE RULE: THIS PAGE MUST DO NOTHING ON LOAD.

   Supabase magic links are SINGLE-USE. Microsoft Defender "Safe Links"
   (and Proofpoint, Mimecast, Barracuda ...) PRE-FETCH every URL in an
   email to detonate it in a sandbox. Pointed at Supabase's own
   /auth/v1/verify, the scanner's GET spent the token, created and signed
   in the account inside the sandbox. ⚠ AND THE HUMAN NEVER GOT THE EMAIL
   AT ALL — it did not arrive in the inbox (owner, 2026-08-19), so the
   observed symptom is silence, not an error message. This page fixes the
   token being spent; it does NOT fix delivery, which is tracked separately.
   Evidence: ADS_OPERATIONS.md 4.2 / 5.6.

   So the email now points HERE, and verifyOtp() is called only from a
   click handler. A scanner's GET renders a button and verifies nothing.

   Do NOT add: an auto-verify on DOMContentLoaded, a "redirect if it looks
   valid" shortcut, a prefetch, or a <link rel="prerender">. Any of those
   reintroduce the bug. test_confirm_page.js asserts their absence.
   ============================================================ */
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var tokenHash = params.get('token_hash') || '';
  var type = params.get('type') || 'email';
  /* Where to land after a successful sign-in. Clean URL, not /account.html —
     the .html form 308-redirects through the origin (see CLAUDE.md). Only
     same-origin paths are honoured, so the email can never bounce a user off-site.

     ⚠⚠ THE DEFAULT IS THE HOME PAGE, NOT /account (changed 2026-08-20, owner).
     Nothing in the codebase passes `next` — it can only ever arrive from the Supabase
     email template, which does not set it. So this default IS the behaviour for every
     magic-link sign-in, and it was dropping people on the account page: a small grey
     panel with no obvious way out. join.html learned the same lesson on 2026-08-19 and
     start.html was built with it. This is the last route that still did it.
     ⚠ A `next` in the URL still wins, so adding `&next=/whatever` to the template
     later needs no code change. */
  var nextRaw = params.get('next') || '/';
  var next = (nextRaw.charAt(0) === '/' && nextRaw.charAt(1) !== '/') ? nextRaw : '/';

  var btn = document.getElementById('cf-btn');
  var status = document.getElementById('cf-status');
  var codeWrap = document.getElementById('cf-code-wrap');

  /* Reveal the code route. ⚠ DEFINED HERE, ABOVE ITS FIRST USE, ON PURPOSE — this is an
     ASSIGNMENT, not a hoisted declaration, so the no-token branch a few lines below
     cannot call it if it sits further down. Every reveal goes through this one function
     so the box and the "use the code" toggle can never both be showing. Idempotent. */
  window.cfShowCode = function () {
    if (codeWrap) codeWrap.style.display = 'block';
    var toggle = document.getElementById('cf-code-toggle');
    if (toggle) toggle.style.display = 'none';
    var emailEl = document.getElementById('cf-email');
    if (emailEl && typeof emailEl.focus === 'function') { try { emailEl.focus(); } catch (_) {} }
  };


  /* No token_hash in the URL = someone reached this page directly, or the link was
     mangled in transit. Don't dead-end them: offer the code route straight away. */
  if (!tokenHash) {
    document.getElementById('cf-title').textContent = 'Finish signing in';
    document.getElementById('cf-lede').textContent = 'This page needs the link from your sign-in email. If the link is not working, use the code from that email instead.';
    if (btn) { btn.disabled = true; btn.textContent = 'No sign-in link found'; }
    window.cfShowCode();
  }

  function say(el, msg, kind) {
    if (!el) return;
    el.style.color = kind === 'err' ? '#B00020' : (kind === 'ok' ? 'var(--accent)' : 'var(--text-tertiary)');
    el.textContent = msg;
  }

  /* Where to send someone who needs a NEW link. Same localhost rule as done(). */
  function accountHref() {
    var local = /^(localhost|127\.|0\.0\.0\.0|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)/.test(location.hostname || '');
    return local ? '/account.html' : '/account';
  }

  function done() {
    say(status, next === '/' ? 'Signed in — taking you to the topics...'
                             : 'Signed in — taking you to your account...', 'ok');
    /* Clean URL in production; re-add .html on localhost/LAN, because
       `python -m http.server` has no clean-URL resolution and the owner's own
       local test of this page would end on a 404. Same rule as hrefFor() in
       nav.js / topics.js / player.js / read.js — see CLAUDE.md.
       ⚠ '/' IS THE SPECIAL CASE and it is easy to miss: it contains no dot, so the
       old expression appended .html and produced "/.html" — a 404 on every local
       test of the new default. Bare root maps to /index.html, not to root + ".html". */
    var local = /^(localhost|127\.|0\.0\.0\.0|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)/.test(location.hostname || '');
    var dest = next;
    if (local) dest = (next === '/') ? '/index.html'
                    : (next.indexOf('.') === -1 ? next + '.html' : next);
    setTimeout(function () { location.replace(dest); }, 600);
  }

  /* auth.js is injected by nav.js, so it may not be ready the instant the user taps.
     Wait for it rather than failing — but bounded, so a broken load says so out loud
     instead of hanging on a dead button. */
  function whenAuth(cb, waited) {
    var a = window.ThaiEarAuth;
    if (a && typeof a.verifyOtpHash === 'function') { cb(a); return; }
    waited = waited || 0;
    if (waited > 8000) { cb(null); return; }
    setTimeout(function () { whenAuth(cb, waited + 150); }, 150);
  }

  window.cfVerify = function () {
    if (!tokenHash) return;
    if (btn) { btn.disabled = true; btn.textContent = 'Signing you in...'; }
    say(status, '');
    whenAuth(function (a) {
      if (!a) {
        say(status, 'Sign-in is still loading — please try again in a moment.', 'err');
        if (btn) { btn.disabled = false; btn.textContent = 'Sign me in'; }
        return;
      }
      /* ⚠ THE `type` CASCADE — this is a correctness guard, not belt-and-braces.
         gotrue looks a token up by hash AND type, and the right string for a given email
         template is genuinely ambiguous: Supabase's own docs use `type=email` for BOTH
         "Confirm signup" and "Magic Link", while the client's EmailOtpType union also
         accepts 'signup' and 'magiclink'. One wrong guess in a template = every sign-in of
         that kind fails. So try the URL's type first, then the other plausible ones.
         Safe because a type mismatch is a LOOKUP MISS, not a consumption — the token is
         only spent on success. Bounded, and it stops early on an expiry, where retrying
         a different type could only produce the same answer more slowly. */
      var tried = [], queue = [type, 'email', 'magiclink', 'signup'].filter(function (t) {
        if (!t || tried.indexOf(t) !== -1) return false;
        tried.push(t); return true;
      });

      (function attempt(i, firstErr) {
        if (i >= queue.length) {
          var e = firstErr || new Error('');
          var msg = (e && e.message) || '';
          /* ⚠⚠ DO NOT OFFER THE CODE FOR A SPENT OR EXPIRED TOKEN. The code is the SAME
             OTP record as this link, so if the record is gone the code is gone with it —
             pointing the user at it would be a guaranteed second failure, and they have
             already had one. The honest answer is "ask for a new link".
             The code IS worth offering for any other failure, because the most likely of
             those is a token_hash mangled in transit by a mail rewriter — the record is
             intact, only the URL carrying it is damaged, and the code sidesteps the URL.
             (A type mismatch cannot reach here: the cascade above exhausts the types.) */
          var dead = /expire|invalid|not found|already|used/i.test(msg);
          if (dead) {
            say(status, 'This sign-in link has expired or has already been used. '
                      + 'Links work once only — ask for a new one and it takes a few seconds.', 'err');
            if (btn) {
              btn.disabled = false;
              btn.textContent = 'Get a new sign-in link';
              btn.onclick = function () { location.href = accountHref(); };
            }
            /* Say it plainly, so nobody burns a second attempt on the code. */
            var toggle = document.getElementById('cf-code-toggle');
            if (toggle) {
              toggle.disabled = true;
              toggle.style.color = 'var(--text-tertiary)';
              toggle.style.textDecoration = 'none';
              toggle.style.cursor = 'default';
              toggle.textContent = 'The code in that email has expired too — it is the same one-time code.';
            }
            return;
          }
          say(status, 'That didn’t work' + (msg ? ' (' + msg + ')' : '')
                    + '. Try the code from your email instead — it still works even if the '
                    + 'link was damaged in transit.', 'err');
          if (btn) { btn.disabled = false; btn.textContent = 'Try again'; }
          window.cfShowCode();
          return;
        }
        a.verifyOtpHash(tokenHash, queue[i]).then(function (res) {
          if (res && res.error) throw res.error;
          done();
        }).catch(function (err) {
          // An expired token is expired for every type — don't grind through the rest.
          if (/expired/i.test((err && err.message) || '')) { attempt(queue.length, err); return; }
          attempt(i + 1, firstErr || err);
        });
      })(0);
    });
  };

  window.cfVerifyCode = function () {
    var emailEl = document.getElementById('cf-email');
    var codeEl = document.getElementById('cf-code');
    var cbtn = document.getElementById('cf-code-btn');
    var cstatus = document.getElementById('cf-code-status');
    var email = ((emailEl && emailEl.value) || '').trim();
    var code = ((codeEl && codeEl.value) || '').trim().replace(/\s+/g, '');
    if (!email || email.indexOf('@') < 1 || email.indexOf('.') < 0) { say(cstatus, 'Please enter the email address the code was sent to.', 'err'); return; }
    if (!/^\d{4,10}$/.test(code)) { say(cstatus, 'Please enter the code printed in the email (digits only).', 'err'); return; }
    if (cbtn) { cbtn.disabled = true; cbtn.textContent = 'Signing you in...'; }
    say(cstatus, '');
    whenAuth(function (a) {
      if (!a || typeof a.verifyOtpCode !== 'function') {
        say(cstatus, 'Sign-in is still loading — please try again in a moment.', 'err');
        if (cbtn) { cbtn.disabled = false; cbtn.textContent = 'Sign in with the code'; }
        return;
      }
      a.verifyOtpCode(email, code, type).then(function (res) {
        if (res && res.error) throw res.error;
        done();
      }).catch(function (err) {
        say(cstatus, 'That code did not work: ' + ((err && err.message) || 'please try again.'), 'err');
        if (cbtn) { cbtn.disabled = false; cbtn.textContent = 'Sign in with the code'; }
      });
    });
  };
})();
</script>

<script src="attrib.js" defer></script>
<script src="gtag.js" defer></script>
<script src="nav.js" defer></script>
