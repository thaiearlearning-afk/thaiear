  { num: 703, display: 1, preview: "ไม่แน่ใจ", thai: "ยังไม่แน่ใจเลยว่าสุดสัปดาห์นี้จะว่างหรือเปล่า", english: "I'm not sure yet whether I'll be free this weekend.", gloss: [["ยังไม่แน่ใจ", "not sure yet"], ["เลย", "at all"], ["ว่า", "whether"], ["สุดสัปดาห์", "weekend"], ["ว่าง", "free"], ["หรือเปล่า", "...or not"]], cultural: "" },

  { num: 706, display: 3, preview: "แล้วแต่", thai: "ไปหรือไม่ไป | แล้วแต่ว่างานจะเสร็จทันหรือเปล่าค่ะ", english: "Whether I go or not depends on whether I finish work in time.", gloss: [["ไปหรือไม่ไป", "whether I go or not"], ["แล้วแต่ว่า", "depends on whether"], ["งาน", "work"], ["เสร็จทัน", "finish in time"], ["หรือเปล่า", "...or not"], ["ค่ะ", "polite particle (female)"]], cultural: "" },
  { num: 707, display: 4, preview: "เรียนจบ", thai: "พอเรียนจบ | ก็จะกลับไปอยู่บ้านเกิดสักพักค่ะ", english: "Once I finish studying, I'll go back to my hometown for a while.", gloss: [["พอ...ก็", "once... (then)"], ["เรียนจบ", "finish studying"], ["กลับไปอยู่", "go back to live"], ["บ้านเกิด", "hometown"], ["สักพัก", "for a while"], ["ค่ะ", "polite particle (female)"]], cultural: "Going back to one's บ้านเกิด (home province) later in life is a strong thread in Thai culture — many who move to Bangkok for study or work fully intend to return to family and roots." },
  { num: 708, display: 5, preview: "โบนัส", thai: "ถ้าได้โบนัส | ผมก็จะพาครอบครัวไปกินข้าวฉลองกันครับ", english: "If I get the bonus, I'll take the family out to celebrate.", gloss: [["ถ้า...ก็", "if... then"], ["ได้โบนัส", "get the bonus"], ["พาครอบครัว", "take the family"], ["ไปกินข้าว", "go out to eat"], ["ฉลอง", "celebrate"], ["ครับ", "polite particle (male)"]], cultural: "Marking good fortune by treating family or friends to a meal is a common Thai gesture — sharing a windfall around rather than keeping it to oneself." },
  { num: 709, display: 6, preview: "เยี่ยมยาย", thai: "สิ้นเดือนพฤษภาคมคงจะได้กลับไปเยี่ยมยายสักที", english: "By the end of May I'll probably finally get to visit grandma.", gloss: [["สิ้นเดือน", "end of the month"], ["พฤษภาคม", "May"], ["คงจะ", "will probably"], ["กลับไป", "go back"], ["เยี่ยมยาย", "visit grandma"], ["สักที", "finally / at last"]], cultural: "ยาย is specifically the maternal grandmother — Thai has a separate word for each grandparent (ย่า paternal grandmother, ตา maternal grandfather, ปู่ paternal grandfather)." },
  { num: 710, display: 7, preview: "นวด", thai: "ถ้าอาทิตย์หน้าไม่ติดอะไร | อยากไปนวดสักครั้งมากเลย", english: "If nothing comes up next week, I'd love to go for a massage.", gloss: [["ถ้า", "if"], ["อาทิตย์หน้า", "next week"], ["ไม่ติดอะไร", "nothing on / free"], ["อยากไป", "would love to go"], ["นวด", "get a massage"], ["สักครั้ง", "(at least) once"], ["มากเลย", "so much"]], cultural: "Thai massage (นวด) is everyday self-care, not a rare luxury — neighbourhood shops are cheap and widely used for aches and simple relaxation alike." },
  { num: 711, display: 8, preview: "ตามแผน", thai: "ไม่ใช่ว่าทุกอย่างจะเป็นไปตามแผนเสมอไปนะครับ", english: "Not everything always goes to plan.", gloss: [["ไม่ใช่ว่า", "it's not that"], ["ทุกอย่าง", "everything"], ["เป็นไปตามแผน", "goes to plan"], ["เสมอไป", "always (necessarily)"], ["นะ", "softening particle"], ["ครับ", "polite particle (male)"]], cultural: "" },
  { num: 712, display: 9, preview: "ดูหน้างาน", thai: "ไม่ต้องวางแผนอะไรมาก | เดี๋ยวค่อยดูหน้างานเอาก็ได้ค่ะ", english: "No need to over-plan — we'll just play it by ear.", gloss: [["ไม่ต้อง", "no need to"], ["วางแผน", "plan"], ["เดี๋ยวค่อย", "later on"], ["ดูหน้างาน", "play it by ear"], ["เอาก็ได้", "that'll do fine"], ["ค่ะ", "polite particle (female)"]], cultural: "ดูหน้างาน (literally 'look at the work-site') means deciding on the spot rather than planning ahead — it reflects a relaxed, improvise-as-you-go outlook that's widely accepted." },
  { num: 713, display: 10, preview: "ตามใจ", thai: "ปกติผมไม่ค่อยคิดอะไรล่วงหน้า | ชอบทำอะไรตามใจมากกว่า", english: "I usually don't think too far ahead; I prefer being spontaneous.", gloss: [["ปกติ", "usually"], ["ผม", "I (male)"], ["ไม่ค่อย", "rarely"], ["คิดล่วงหน้า", "plan ahead"], ["ชอบ", "prefer"], ["ตามใจ", "as one pleases"], ["มากกว่า", "more"]], cultural: "" },
  { num: 714, display: 11, preview: "พูดดังๆ", thai: "เวลาวางแผนอะไร | เราว่าพูดออกมาดังๆ ช่วยให้คิดง่ายขึ้นค่ะ", english: "When I'm planning something, I find saying it aloud helps me think it through.", gloss: [["เวลา", "when"], ["วางแผน", "planning"], ["เราว่า", "I find / I think"], ["พูดออกมาดังๆ", "say it out loud"], ["ช่วยให้", "helps to"], ["คิดง่ายขึ้น", "think more clearly"], ["ค่ะ", "polite particle (female)"]], cultural: "เรา ('we') is often used casually to mean 'I' in relaxed speech — a soft, friendly first-person that sounds less blunt than ผม or ฉัน." },
  { num: 715, display: 12, preview: "บ้านของตัวเอง", thai: "อยากมีบ้านเป็นของตัวเองสักหลังในอนาคตค่ะ", english: "Someday I'd like a place of my own.", gloss: [["อยากมี", "would like to have"], ["บ้าน", "house"], ["เป็นของตัวเอง", "of one's own"], ["สักหลัง", "a house [หลัง counts buildings]"], ["ในอนาคต", "in the future"], ["ค่ะ", "polite particle (female)"]], cultural: "" },
  { num: 716, display: 13, preview: "ต่างประเทศ", thai: "ฝันว่าสักวันจะได้ไปใช้ชีวิตอยู่ต่างประเทศครับ", english: "I dream of living abroad one day.", gloss: [["ฝันว่า", "dream that"], ["สักวัน", "someday"], ["จะได้", "will get to"], ["ใช้ชีวิต", "live / spend life"], ["ต่างประเทศ", "abroad"], ["ครับ", "polite particle (male)"]], cultural: "" },
  { num: 717, display: 14, preview: "ตั้งตารอ", thai: "ตั้งตารอวันหยุดยาวอยู่เลยค่ะ", english: "I'm really looking forward to the long weekend.", gloss: [["ตั้งตารอ", "really looking forward to"], ["วันหยุดยาว", "long weekend"], ["อยู่เลย", "right now (emphatic)"], ["ค่ะ", "polite particle (female)"]], cultural: "Public holidays in Thailand are often nudged beside a weekend to make a วันหยุดยาว (long weekend) — prime time for heading home or taking a trip." },
