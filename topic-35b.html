<script>
window.ThaiEarTopic = {
  tier: "premium",
  audioPrefix: "Dhamma_LI2",
  sentences: [
  { num: 1286, display: 1, preview: "พระรัตนตรัย", thai: "ชาวพุทธยึดพระรัตนตรัย | คือพระพุทธ พระธรรม พระสงฆ์ เป็นที่พึ่งครับ", english: "Buddhists take refuge in the Triple Gem — the Buddha, the Dhamma, and the Sangha.", gloss: [["ชาวพุทธ","Buddhists"],["ยึด","hold to"],["พระรัตนตรัย","the Triple Gem"],["คือ","namely"],["พระพุทธ","the Buddha"],["พระธรรม","the Dhamma"],["พระสงฆ์","the Sangha"],["เป็น","as"],["ที่พึ่ง","a refuge"],["ครับ","polite(m)"]], cultural: "The พระรัตนตรัย (Triple Gem) — Buddha, Dhamma (his teaching) and Sangha (the monastic community) — are the three things a Buddhist 'takes refuge' in, recited at the start of almost every ceremony." },
  { num: 1287, display: 2, preview: "คำบูชา", thai: "ก่อนสวดมนต์ทุกครั้ง | เราจะกล่าวคำบูชาพระรัตนตรัยก่อนเสมอค่ะ", english: "Before every chanting we always recite the homage to the Triple Gem first.", gloss: [["ก่อน","before"],["สวดมนต์","chanting"],["ทุกครั้ง","each time"],["เรา","we"],["จะ","(will)"],["กล่าว","recite"],["คำบูชา","words of homage"],["พระรัตนตรัย","to the Triple Gem"],["ก่อน","first"],["เสมอ","always"],["ค่ะ","polite(f)"]], cultural: "Chanting opens with คำบูชาพระรัตนตรัย — set Pali verses of homage to the Buddha, Dhamma and Sangha — before any other recitation." },
  { num: 1288, display: 3, preview: "ฟังเทศน์", thai: "ฟังพระเทศน์เรื่องทานแล้ว | รู้สึกอยากเป็นคนใจกว้างขึ้นค่ะ", english: "After hearing the monk preach on giving, I felt I wanted to become more generous.", gloss: [["ฟัง","hearing"],["พระเทศน์","the monk's sermon"],["เรื่อง","on"],["ทาน","giving"],["แล้ว","after"],["รู้สึก","I felt"],["อยาก","wanted"],["เป็น","to be"],["คนใจกว้าง","generous"],["ขึ้น","more"],["ค่ะ","polite(f)"]], cultural: "ทาน (dāna, generosity) is the first of the Buddhist perfections and the most accessible lay practice — giving is seen as the very foundation of the path." },
  { num: 1289, display: 4, preview: "ฟังธรรม", thai: "หลายคนชอบไปฟังธรรมที่วัด | เพื่อให้จิตใจสงบขึ้นค่ะ", english: "Many like to go and listen to Dhamma talks at the temple to calm the mind.", gloss: [["หลายคน","many people"],["ชอบ","like"],["ไป","to go"],["ฟังธรรม","hear the Dhamma"],["ที่วัด","at the temple"],["เพื่อให้","so that"],["จิตใจ","the mind"],["สงบ","calm"],["ขึ้น","grows"],["ค่ะ","polite(f)"]], cultural: "Listening to Dhamma talks (ฟังธรรม) counts as a form of merit and a calming practice in its own right, not only formal meditation." },
  { num: 1290, display: 5, preview: "อริยสัจสี่", thai: "หัวใจคำสอนของพระพุทธเจ้าคืออริยสัจสี่ | ว่าด้วยทุกข์และหนทางดับทุกข์ครับ", english: "The heart of the Buddha's teaching is the Four Noble Truths — about suffering and the way to end it.", gloss: [["หัวใจ","the heart"],["คำสอน","of the teaching"],["ของพระพุทธเจ้า","of the Buddha"],["คือ","is"],["อริยสัจสี่","the Four Noble Truths"],["ว่าด้วย","about"],["ทุกข์","suffering"],["และ","and"],["หนทาง","the way"],["ดับทุกข์","to end it"],["ครับ","polite(m)"]], cultural: "The อริยสัจสี่ (Four Noble Truths) frame the whole teaching: suffering, its cause, its cessation, and the path leading there." },
  { num: 1291, display: 6, preview: "ความอยาก", thai: "พระพุทธเจ้าสอนว่า | ความทุกข์เกิดจากความอยากและการยึดติดครับ", english: "The Buddha taught that suffering arises from craving and attachment.", gloss: [["พระพุทธเจ้า","the Buddha"],["สอนว่า","taught that"],["ความทุกข์","suffering"],["เกิดจาก","arises from"],["ความอยาก","craving"],["และ","and"],["การยึดติด","attachment"],["ครับ","polite(m)"]], cultural: "The second Noble Truth: suffering springs from ความอยาก (taṇhā, craving) and clinging. สอน…ว่า reports speech — 'taught that…'." },
  { num: 1292, display: 7, preview: "ปล่อยวาง", thai: "ถ้าเราปล่อยวางได้ | ความทุกข์ในใจก็จะค่อยๆ จางหายไปเองค่ะ", english: "If we can let go, the suffering in the heart will gradually fade on its own.", gloss: [["ถ้า","if"],["เรา","we"],["ปล่อยวาง","let go"],["ได้","can"],["ความทุกข์","the suffering"],["ในใจ","in the heart"],["ก็","then"],["จะ","(will)"],["ค่อยๆ","gradually"],["จางหาย","fade"],["ไปเอง","on its own"],["ค่ะ","polite(f)"]], cultural: "ปล่อยวาง ('letting go / release') is a central practical teaching — loosening the grip of craving rather than forcing feelings away. ถ้า…ก็ is the if/then frame; ค่อยๆ marks a gradual process." },
  { num: 1293, display: 8, preview: "ยึดมั่นถือมั่น", thai: "ยิ่งยึดมั่นถือมั่นมากเท่าไหร่ | ใจก็ยิ่งเป็นทุกข์มากเท่านั้นแหละครับ", english: "The more you cling, the more the heart suffers.", gloss: [["ยิ่ง","the more"],["ยึดมั่นถือมั่น","you cling"],["มาก","much"],["เท่าไหร่","however"],["ใจ","the heart"],["ก็","the"],["ยิ่ง","more"],["เป็นทุกข์","suffers"],["มาก","much"],["เท่านั้น","so"],["แหละ","(emphasis)"],["ครับ","polite(m)"]], cultural: "ยิ่ง…ยิ่ง is the proportional 'the more X, the more Y' frame — here, clinging and suffering rise together." },
  { num: 1294, display: 9, preview: "ไม่เที่ยง", thai: "ทุกอย่างในโลกนี้ไม่เที่ยง | มีเกิดขึ้น ตั้งอยู่ แล้วก็ดับไปครับ", english: "Everything in this world is impermanent — it arises, persists, then passes away.", gloss: [["ทุกอย่าง","everything"],["ในโลกนี้","in this world"],["ไม่เที่ยง","is impermanent"],["มี","has"],["เกิดขึ้น","arising"],["ตั้งอยู่","persisting"],["แล้วก็","then"],["ดับไป","ceasing"],["ครับ","polite(m)"]], cultural: "ไม่เที่ยง (aniccā, impermanence) is the first of the three marks of existence; the arising–persisting–ceasing sequence describes how all conditioned things pass." },
  { num: 1295, display: 10, preview: "ปลง", thai: "เวลาเจอเรื่องร้ายๆ | คนไทยมักปลงแล้วบอกว่ามันเป็นอนิจจังค่ะ", english: "Facing bad things, Thais often resign themselves and say it's all impermanence.", gloss: [["เวลา","when"],["เจอ","facing"],["เรื่องร้ายๆ","bad things"],["คนไทย","Thais"],["มัก","often"],["ปลง","let go"],["แล้ว","and"],["บอกว่า","say"],["มัน","it"],["เป็น","is"],["อนิจจัง","impermanence"],["ค่ะ","polite(f)"]], cultural: "ปลง is the everyday verb for accepting and releasing what can't be changed; calling something 'เป็นอนิจจัง' (it's impermanence) is a common way Thais reframe loss through Buddhist eyes." },
  { num: 1296, display: 11, preview: "สังขาร", thai: "ร่างกายคนเราก็เป็นสังขาร | ที่เปลี่ยนแปลงและเสื่อมไปตามกาลเวลาครับ", english: "Our bodies too are conditioned things that change and decay over time.", gloss: [["ร่างกาย","the body"],["คนเรา","of ours"],["ก็","too"],["เป็น","is"],["สังขาร","a conditioned thing"],["ที่","that"],["เปลี่ยนแปลง","changes"],["และ","and"],["เสื่อม","decays"],["ไป","(away)"],["ตามกาลเวลา","over time"],["ครับ","polite(m)"]], cultural: "สังขาร means anything formed of conditions — including the body — and so inevitably changing and decaying. Contemplating this loosens attachment to the body." },
  { num: 1297, display: 12, preview: "ไตรลักษณ์", thai: "พระพุทธเจ้าทรงสอนไตรลักษณ์ | คือ อนิจจัง ทุกขัง และอนัตตา ความไม่มีตัวตนที่แท้จริงครับ", english: "The Buddha taught the three marks — impermanence, suffering, and not-self, the absence of any real self.", gloss: [["พระพุทธเจ้า","the Buddha"],["ทรงสอน","taught"],["ไตรลักษณ์","the three marks"],["คือ","namely"],["อนิจจัง","impermanence"],["ทุกขัง","suffering"],["และ","and"],["อนัตตา","not-self"],["ความไม่มีตัวตน","no fixed self"],["ที่แท้จริง","truly"],["ครับ","polite(m)"]], cultural: "ไตรลักษณ์ — the three marks — are impermanence (อนิจจัง), unsatisfactoriness (ทุกขัง) and not-self (อนัตตา). อนัตตา, that there's no fixed, independent self, is the most distinctive. ทรง marks Buddha/royal register." },
  { num: 1298, display: 13, preview: "กรรม", thai: "คนโบราณเชื่อว่าทำดีได้ดี | ทำชั่วได้ชั่ว ตามหลักของกรรมค่ะ", english: "The old folk believe good begets good and bad begets bad, by the law of kamma.", gloss: [["คนโบราณ","the old folk"],["เชื่อว่า","believe that"],["ทำดี","do good"],["ได้ดี","get good"],["ทำชั่ว","do bad"],["ได้ชั่ว","get bad"],["ตามหลัก","by the law"],["ของกรรม","of kamma"],["ค่ะ","polite(f)"]], cultural: "'ทำดีได้ดี ทำชั่วได้ชั่ว' is the everyday Thai summary of กรรม (kamma) — that intentional actions ripen into matching results." },
  { num: 1299, display: 14, preview: "ผลกรรม", thai: "เขาเชื่อว่าชีวิตที่ลำบากชาตินี้ | อาจเป็นผลกรรมจากชาติก่อนครับ", english: "He believes a hard life this lifetime may be the karmic result of a past life.", gloss: [["เขา","he"],["เชื่อว่า","believes"],["ชีวิต","a life"],["ที่ลำบาก","that's hard"],["ชาตินี้","this lifetime"],["อาจ","may"],["เป็น","be"],["ผลกรรม","a karmic result"],["จากชาติก่อน","from a past life"],["ครับ","polite(m)"]], cultural: "Many Thais read present hardship as ผลกรรม — the ripening of deeds from a past life (ชาติก่อน) — which can foster patient acceptance, though teachers stress kamma is not fixed fate." },
  { num: 1300, display: 15, preview: "เวียนว่ายตายเกิด", thai: "ตามความเชื่อ | คนเราจะเวียนว่ายตายเกิด | จนกว่าจะหลุดพ้นจากกิเลสค่ะ", english: "According to belief, beings are reborn again and again until freed from defilements.", gloss: [["ตามความเชื่อ","according to belief"],["คนเรา","we beings"],["จะ","(will)"],["เวียนว่ายตายเกิด","are reborn again & again"],["จนกว่า","until"],["จะ","(we)"],["หลุดพ้น","are freed"],["จากกิเลส","from defilements"],["ค่ะ","polite(f)"]], cultural: "เวียนว่ายตายเกิด is saṃsāra — the round of death and rebirth — which continues until the mind is freed from กิเลส (greed, hatred, delusion). จนกว่า marks 'until' a condition is met." },
  { num: 1301, display: 16, preview: "นิพพาน", thai: "เป้าหมายสูงสุดของพุทธศาสนา | คือการดับทุกข์และเข้าสู่นิพพานครับ", english: "The highest goal of Buddhism is the cessation of suffering and reaching Nibbana.", gloss: [["เป้าหมาย","the goal"],["สูงสุด","highest"],["ของพุทธศาสนา","of Buddhism"],["คือ","is"],["การดับทุกข์","ending suffering"],["และ","and"],["เข้าสู่","reaching"],["นิพพาน","Nibbana"],["ครับ","polite(m)"]], cultural: "นิพพาน (Nibbāna) is the final goal — the complete extinguishing of craving and the suffering it causes, and release from rebirth." },
  { num: 1302, display: 17, preview: "ศีล สมาธิ ปัญญา", thai: "พระสอนว่าการฝึกตนมีสามขั้น | คือ ศีล สมาธิ และปัญญาครับ", english: "Monks teach that self-training has three steps: morality, concentration, and wisdom.", gloss: [["พระ","monks"],["สอนว่า","teach that"],["การฝึกตน","self-training"],["มี","has"],["สามขั้น","three steps"],["คือ","namely"],["ศีล","morality"],["สมาธิ","concentration"],["และ","and"],["ปัญญา","wisdom"],["ครับ","polite(m)"]], cultural: "The threefold training (ไตรสิกขา): ศีล (virtue), สมาธิ (concentration) and ปัญญา (wisdom) — virtue steadies the mind, concentration deepens it, and wisdom sees clearly." },
  { num: 1303, display: 18, preview: "ทางสายกลาง", thai: "พระพุทธเจ้าทรงสอนทางสายกลาง | คือไม่ปล่อยตัวและไม่ทรมานตนจนเกินไปครับ", english: "The Buddha taught the Middle Way — neither indulging oneself nor tormenting the body to excess.", gloss: [["พระพุทธเจ้า","the Buddha"],["ทรงสอน","taught"],["ทางสายกลาง","the Middle Way"],["คือ","that is"],["ไม่","neither"],["ปล่อยตัว","indulging"],["และ","nor"],["ไม่","(not)"],["ทรมานตน","tormenting oneself"],["จนเกินไป","to excess"],["ครับ","polite(m)"]], cultural: "The ทางสายกลาง (Middle Way) avoids two extremes — chasing sensual pleasure and harsh self-mortification — a balance the Buddha found after years of severe asceticism." },
  { num: 1304, display: 19, preview: "มรรคมีองค์แปด", thai: "มรรคมีองค์แปดคือหนทางที่นำไปสู่การดับทุกข์ตามที่พระพุทธเจ้าทรงสอนค่ะ", english: "The Noble Eightfold Path is the way leading to the cessation of suffering, as the Buddha taught.", gloss: [["มรรคมีองค์แปด","the Eightfold Path"],["คือ","is"],["หนทาง","the way"],["ที่นำไปสู่","leading to"],["การดับทุกข์","the end of suffering"],["ตามที่","as"],["พระพุทธเจ้า","the Buddha"],["ทรงสอน","taught"],["ค่ะ","polite(f)"]], cultural: "The fourth Noble Truth: the มรรคมีองค์แปด (Noble Eightfold Path) — right view, intention, speech, action, livelihood, effort, mindfulness and concentration — is the practical route out of suffering." },
  { num: 1305, display: 20, preview: "นั่งขัดสมาธิ", thai: "พระพุทธเจ้าทรงสอนให้สาวกไปนั่งขัดสมาธิใต้ต้นไม้เพื่อเจริญภาวนาครับ", english: "The Buddha instructed his disciples to go and sit cross-legged under a tree to develop meditation.", gloss: [["พระพุทธเจ้า","the Buddha"],["ทรงสอน","instructed"],["ให้","(told to)"],["สาวก","his disciples"],["ไป","go"],["นั่งขัดสมาธิ","sit cross-legged"],["ใต้ต้นไม้","under a tree"],["เพื่อ","to"],["เจริญภาวนา","develop meditation"],["ครับ","polite(m)"]], cultural: "The Buddha repeatedly sent disciples to quiet, simple places — the forest, the foot of a tree — to meditate, as he himself awakened under the Bodhi tree. สอน…ให้ is the causative 'tell/have someone do'." },
  { num: 1306, display: 21, preview: "สติ", thai: "การนั่งสมาธิช่วยให้เรามีสติ | และรู้ทันความคิดของตัวเองครับ", english: "Sitting meditation helps us have mindfulness and catch our own thoughts in time.", gloss: [["การนั่งสมาธิ","sitting meditation"],["ช่วยให้","helps"],["เรา","us"],["มีสติ","be mindful"],["และ","and"],["รู้ทัน","catch"],["ความคิด","thoughts"],["ของตัวเอง","our own"],["ครับ","polite(m)"]], cultural: "สติ (mindfulness) — present-moment awareness — is the heart of practice; meditation trains us to notice thoughts as they arise rather than be swept along by them." },
  { num: 1307, display: 22, preview: "เดินจงกรม", thai: "นอกจากนั่งสมาธิแล้ว | การเดินจงกรมก็ช่วยฝึกสติได้ดีเหมือนกันค่ะ", english: "Besides sitting meditation, walking meditation also trains mindfulness just as well.", gloss: [["นอกจาก","besides"],["นั่งสมาธิ","sitting meditation"],["แล้ว","(as well)"],["การเดินจงกรม","walking meditation"],["ก็","also"],["ช่วยฝึก","trains"],["สติ","mindfulness"],["ได้ดี","well"],["เหมือนกัน","just as"],["ค่ะ","polite(f)"]], cultural: "เดินจงกรม (walking meditation) — pacing slowly with attention on the movement — alternates with sitting in most monasteries and is especially useful against drowsiness." },
  { num: 1308, display: 23, preview: "วิปัสสนา", thai: "การฝึกวิปัสสนาคือการเฝ้าสังเกตความเปลี่ยนแปลงของลมหายใจและจิตใจอยู่เสมอครับ", english: "Insight practice is continually observing the changing nature of the breath and the mind.", gloss: [["การฝึกวิปัสสนา","insight practice"],["คือ","is"],["การเฝ้าสังเกต","watching"],["ความเปลี่ยนแปลง","the changing"],["ของลมหายใจ","of the breath"],["และ","and"],["จิตใจ","the mind"],["อยู่เสมอ","continually"],["ครับ","polite(m)"]], cultural: "วิปัสสนา (insight meditation) means watching experience — breath, body, mind — to see directly its changing, impermanent nature, as distinct from สมถะ (calm-abiding)." },
  { num: 1309, display: 24, preview: "อานาปานสติ", thai: "วิธีภาวนาที่นิยมที่สุดคืออานาปานสติ | คือการมีสติอยู่กับลมหายใจครับ", english: "The most popular meditation method is anapanasati — keeping mindfulness with the breath.", gloss: [["วิธีภาวนา","the meditation method"],["ที่นิยม","popular"],["ที่สุด","most"],["คือ","is"],["อานาปานสติ","anapanasati"],["คือ","that is"],["การมีสติ","mindfulness"],["อยู่กับ","with"],["ลมหายใจ","the breath"],["ครับ","polite(m)"]], cultural: "อานาปานสติ (mindfulness of breathing) is the most widely taught meditation — simply resting attention on the natural in- and out-breath." },
  { num: 1310, display: 25, preview: "เห็นความคิด", thai: "ขณะที่นั่งสมาธิ | เราจะค่อยๆ เห็นความคิดผุดขึ้นมาแล้วก็ดับไปเองครับ", english: "While sitting in meditation, we gradually come to see thoughts surface and then fade away on their own.", gloss: [["ขณะที่","while"],["นั่งสมาธิ","sitting in meditation"],["เรา","we"],["จะ","(will)"],["ค่อยๆ","gradually"],["เห็น","see"],["ความคิด","thoughts"],["ผุดขึ้นมา","surface"],["แล้วก็","then"],["ดับไป","fade"],["เอง","on their own"],["ครับ","polite(m)"]], cultural: "A core insight meditation reveals: thoughts arise and pass by themselves. ขณะที่ frames a simultaneous 'while…'; ผุด…ขึ้นมา marks a thought surfacing into awareness." },
  { num: 1311, display: 26, preview: "วันละสิบนาที", thai: "ถึงแม้ว่าจะนั่งสมาธิแค่วันละสิบนาที | จิตใจก็สงบขึ้นได้นะครับ", english: "Even meditating just ten minutes a day, the mind can still grow calmer.", gloss: [["ถึงแม้ว่า","even though"],["จะ","(would)"],["นั่งสมาธิ","you meditate"],["แค่","just"],["วันละ","a day"],["สิบนาที","ten minutes"],["จิตใจ","the mind"],["ก็","still"],["สงบ","calmer"],["ขึ้น","(grows)"],["ได้","can"],["นะ","(softener)"],["ครับ","polite(m)"]], cultural: "ถึงแม้ว่า…ก็ is the emphatic 'even though…still'. Teachers stress consistency over length — a short daily sit beats an occasional long one." },
  { num: 1312, display: 27, preview: "ปฐมฌาน", thai: "เมื่อเข้าถึงปฐมฌานซึ่งเป็นรูปฌานขั้นแรก | จะรู้สึกปีติและความสุขอย่างมากครับ", english: "When one attains the first jhana — the first of the form-jhanas — one feels great rapture and bliss.", gloss: [["เมื่อ","when"],["เข้าถึง","one attains"],["ปฐมฌาน","the first jhana"],["ซึ่ง","which"],["เป็น","is"],["รูปฌาน","a form-jhana"],["ขั้นแรก","the first stage"],["จะ","(will)"],["รู้สึก","feel"],["ปีติ","rapture"],["และ","and"],["ความสุข","bliss"],["อย่างมาก","intense"],["ครับ","polite(m)"]], cultural: "ฌาน (jhāna) are deep states of meditative absorption. The ปฐมฌาน (first jhāna) is marked by ปีติ (rapture) and สุข (bliss) — the first of four 'form' (รูป) jhānas." },
  { num: 1313, display: 28, preview: "สติสัมปชัญญะ", thai: "พระมักสอนให้มีสติสัมปชัญญะ | คือรู้ตัวทั่วพร้อมในทุกอิริยาบถครับ", english: "Monks often teach having mindfulness and clear comprehension — full self-awareness in every posture.", gloss: [["พระ","monks"],["มัก","often"],["สอนให้","teach (us) to"],["มี","have"],["สติสัมปชัญญะ","mindfulness & clear comprehension"],["คือ","that is"],["รู้ตัวทั่วพร้อม","full awareness"],["ในทุกอิริยาบถ","in every posture"],["ครับ","polite(m)"]], cultural: "สติสัมปชัญญะ pairs สติ (mindfulness) with สัมปชัญญะ (clear comprehension of what one is doing) — awareness carried into every posture: standing, walking, sitting, lying." },
  { num: 1314, display: 29, preview: "ตามความเป็นจริง", thai: "การปฏิบัติธรรมช่วยให้เราเห็นสิ่งทั้งหลายตามความเป็นจริง | ไม่ใช่ตามที่เราอยากให้เป็นค่ะ", english: "Practising the Dhamma helps us see things as they really are, not as we want them to be.", gloss: [["การปฏิบัติธรรม","practising the Dhamma"],["ช่วยให้","helps"],["เรา","us"],["เห็น","see"],["สิ่งทั้งหลาย","things"],["ตามความเป็นจริง","as they really are"],["ไม่ใช่","not"],["ตามที่","as"],["เรา","we"],["อยากให้เป็น","wish them to be"],["ค่ะ","polite(f)"]], cultural: "Seeing things ตามความเป็นจริง ('as they really are', yathā-bhūta) — free of the distortions of craving and aversion — is the aim of insight." },
  { num: 1315, display: 30, preview: "แผ่เมตตา", thai: "พระสอนให้เราแผ่เมตตาแก่สรรพสัตว์ | ไม่ว่าจะตัวเล็กหรือตัวใหญ่ก็เท่ากันค่ะ", english: "Monks teach us to radiate loving-kindness to all beings — small or large, all the same.", gloss: [["พระ","monks"],["สอนให้","teach us to"],["เรา","(us)"],["แผ่เมตตา","radiate loving-kindness"],["แก่","to"],["สรรพสัตว์","all beings"],["ไม่ว่าจะ","no matter"],["ตัวเล็ก","small"],["หรือ","or"],["ตัวใหญ่","large"],["ก็","(still)"],["เท่ากัน","the same"],["ค่ะ","polite(f)"]], cultural: "แผ่เมตตา is radiating goodwill outward to all beings without exception. ไม่ว่าจะ…ก็ is the 'no matter…still' frame; เมตตา wishes every creature well equally." },
  { num: 1316, display: 31, preview: "เมตตากรุณา", thai: "การมีเมตตาและกรุณาต่อผู้อื่น | คือหัวใจของคำสอนทางพุทธครับ", english: "Having loving-kindness and compassion for others is the heart of Buddhist teaching.", gloss: [["การมี","having"],["เมตตา","loving-kindness"],["และ","and"],["กรุณา","compassion"],["ต่อผู้อื่น","for others"],["คือ","is"],["หัวใจ","the heart"],["ของคำสอน","of the teaching"],["ทางพุทธ","Buddhist"],["ครับ","polite(m)"]], cultural: "เมตตา (loving-kindness) and กรุณา (compassion) are the first two of the four 'sublime abidings' (พรหมวิหาร), the Buddhist heart-qualities cultivated toward all beings." },
  { num: 1317, display: 32, preview: "เจริญสติ", thai: "คนใจร้อน | ถ้าหัดเจริญสติบ่อยๆ ก็จะใจเย็นลงได้เยอะเลยค่ะ", english: "A hot-tempered person, if they often cultivate mindfulness, can become much calmer.", gloss: [["คนใจร้อน","a hot-tempered person"],["ถ้า","if"],["หัด","practises"],["เจริญสติ","cultivating mindfulness"],["บ่อยๆ","often"],["ก็","then"],["จะ","(will)"],["ใจเย็น","calm"],["ลง","down"],["ได้","can"],["เยอะ","a lot"],["เลย","(emphasis)"],["ค่ะ","polite(f)"]], cultural: "เจริญสติ ('developing mindfulness') is offered here as practical anger-management — noticing irritation as it arises gives space not to be ruled by it." },
  { num: 1318, display: 33, preview: "สาธุ", thai: "เวลาทำบุญเสร็จ | คนไทยมักพูดว่า สาธุ พร้อมพนมมือครับ", english: "When merit-making is done, Thais often say sadhu with palms pressed together.", gloss: [["เวลา","when"],["ทำบุญ","merit-making"],["เสร็จ","is done"],["คนไทย","Thais"],["มัก","often"],["พูดว่า","say"],["สาธุ","sadhu"],["พร้อม","while"],["พนมมือ","pressing palms together"],["ครับ","polite(m)"]], cultural: "'สาธุ' (Pali sādhu, 'well said / so be it') is spoken to rejoice in merit, with palms pressed together (พนมมือ) — the gesture of respect that doubles as 'amen'." },
  { num: 1319, display: 34, preview: "ทำใจ", thai: "ผู้ใหญ่ชอบสอนว่า ทำใจเถอะ ทุกอย่างมันไม่แน่นอน | เวลาเราผิดหวังค่ะ", english: "Elders like to teach 'just accept it, nothing is certain' when we're disappointed.", gloss: [["ผู้ใหญ่","elders"],["ชอบ","like to"],["สอนว่า","teach"],["ทำใจ","accept it"],["เถอะ","(go on)"],["ทุกอย่าง","everything"],["มัน","it"],["ไม่แน่นอน","is uncertain"],["เวลา","when"],["เรา","we"],["ผิดหวัง","are disappointed"],["ค่ะ","polite(f)"]], cultural: "'ทำใจ' — literally 'make the heart [ready]' — means to accept and come to terms with something. Paired with 'ไม่แน่นอน' (nothing is certain), it's everyday folk-Dhamma comfort." },
  { num: 1320, display: 35, preview: "ปฏิบัติธรรม", thai: "เขาบอกว่า | ตั้งแต่หันมาเข้าวัดปฏิบัติธรรม ชีวิตก็เปลี่ยนไปเยอะเลยครับ", english: "He says that since he turned to the temple and started practising, his life has changed a lot.", gloss: [["เขา","he"],["บอกว่า","says"],["ตั้งแต่","since"],["หันมา","turning to"],["เข้าวัด","temple-going"],["ปฏิบัติธรรม","and practice"],["ชีวิต","his life"],["ก็","has"],["เปลี่ยนไป","changed"],["เยอะ","a lot"],["เลย","(emphasis)"],["ครับ","polite(m)"]], cultural: "'เข้าวัด' ('going into the temple') often means more than visiting — taking up regular Dhamma practice as part of one's life." },
  { num: 1321, display: 36, preview: "ผี", thai: "คนโบราณเชื่อว่า | ถ้าใจมีสติและมีศีล ผีก็ไม่กล้าเข้ามารบกวนค่ะ", english: "The old folk believe that if the mind has mindfulness and keeps the precepts, ghosts won't dare come and disturb it.", gloss: [["คนโบราณ","the old folk"],["เชื่อว่า","believe"],["ถ้า","if"],["ใจ","the mind"],["มีสติ","is mindful"],["และ","and"],["มีศีล","keeps the precepts"],["ผี","ghosts"],["ก็","(then)"],["ไม่กล้า","won't dare"],["เข้ามา","come"],["รบกวน","disturb"],["ค่ะ","polite(f)"]], cultural: "Thai folk belief holds that virtue and a settled, mindful mind protect a person from ผี (ghosts/spirits) — a worldview that sits comfortably alongside Buddhist practice, especially in the forest tradition." },
  { num: 1322, display: 37, preview: "เทวดา", thai: "คนไทยเชื่อว่าเทวดาคอยปกปักรักษาคนที่ทำความดีและรักษาศีลครับ", english: "Thais believe the devas watch over those who do good and keep the precepts.", gloss: [["คนไทย","Thais"],["เชื่อว่า","believe"],["เทวดา","devas"],["คอย","watch over"],["ปกปักรักษา","and protect"],["คน","those"],["ที่ทำความดี","who do good"],["และ","and"],["รักษาศีล","keep the precepts"],["ครับ","polite(m)"]], cultural: "เทวดา (devas) are celestial beings who, in Thai belief, look kindly on and protect the virtuous — and are often invited to 'rejoice' in merit that's been made." },
  { num: 1323, display: 38, preview: "เจ้ากรรมนายเวร", thai: "เวลากรวดน้ำ | คนไทยมักอุทิศบุญให้เจ้ากรรมนายเวรของตัวเองด้วยค่ะ", english: "When pouring the water libation, Thais often dedicate merit to their own karmic creditors too.", gloss: [["เวลา","when"],["กรวดน้ำ","pouring the libation"],["คนไทย","Thais"],["มัก","often"],["อุทิศบุญ","dedicate merit"],["ให้","to"],["เจ้ากรรมนายเวร","their karmic creditors"],["ของตัวเอง","their own"],["ด้วย","as well"],["ค่ะ","polite(f)"]], cultural: "เจ้ากรรมนายเวร are 'karmic creditors' — beings one has wronged in this or past lives. Dedicating merit to them is believed to settle karmic debts and ease misfortune." },
  { num: 1324, display: 39, preview: "พระไตรปิฎก", thai: "คำสอนของพระพุทธเจ้าถูกรวบรวมไว้ในพระไตรปิฎก | ซึ่งเป็นคัมภีร์หลักของชาวพุทธค่ะ", english: "The Buddha's teachings are collected in the Tipitaka, the principal scripture of Buddhists.", gloss: [["คำสอน","the teachings"],["ของพระพุทธเจ้า","of the Buddha"],["ถูก","were"],["รวบรวม","collected"],["ไว้","(kept)"],["ในพระไตรปิฎก","in the Tipitaka"],["ซึ่ง","which"],["เป็น","is"],["คัมภีร์หลัก","the main scripture"],["ของชาวพุทธ","of Buddhists"],["ค่ะ","polite(f)"]], cultural: "The พระไตรปิฎก (Tipiṭaka, 'three baskets') is the Pāli Canon — discipline, discourses and higher teachings — Theravāda Buddhism's core scripture. ถูก…ไว้ is a neutral passive, 'were collected'." },
  { num: 1325, display: 40, preview: "ได้บุญมากที่สุด", thai: "หลายคนสงสัยว่า | ทำบุญแบบไหนถึงจะได้บุญมากที่สุดค่ะ", english: "Many wonder what kind of merit-making earns the most merit.", gloss: [["หลายคน","many"],["สงสัยว่า","wonder"],["ทำบุญ","merit-making"],["แบบไหน","what kind"],["ถึงจะ","earns"],["ได้บุญ","merit"],["มากที่สุด","the most"],["ค่ะ","polite(f)"]], cultural: "A genuinely common question. Teachers usually answer that intention and the worthiness of the recipient matter more than the size of the gift." },
  { num: 1326, display: 41, preview: "หลวงพ่อชา", thai: "หลวงพ่อชาสอนว่า | ไม่ดีก็ให้มันตาย ถ้าไม่ตายก็ให้มันดี", english: "Luang Por Chah taught: 'If it isn't good, let it die. If it doesn't die, make it good.'", gloss: [["หลวงพ่อชา","Luang Por Chah"],["สอนว่า","taught"],["ไม่ดี","if it's not good"],["ก็","then"],["ให้มันตาย","let it die"],["ถ้า","if"],["ไม่ตาย","it doesn't die"],["ก็","then"],["ให้มันดี","make it good"]], cultural: "Luang Por Chah (Ajahn Chah, 1918–1992) was the great forest master whose monasteries spread the tradition to the West. This pithy saying is about letting go of the outcome and simply keeping on practising rightly." },
  { num: 1327, display: 42, preview: "ฟากตาย", thai: "หลวงพ่อชาเคยกล่าวว่า | นิพพานอยู่ฟากตาย", english: "Luang Por Chah once said: 'Nibbana lies on the shores of death.'", gloss: [["หลวงพ่อชา","Luang Por Chah"],["เคย","once"],["กล่าวว่า","said"],["นิพพาน","Nibbana"],["อยู่","lies"],["ฟากตาย","on the shores of death"]], cultural: "A forest-tradition saying: real freedom (นิพพาน) is found only by being willing to 'die' to the self — letting go so completely that clinging itself dies. เคย marks 'once / at some time'." },
]
};
