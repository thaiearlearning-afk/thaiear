<script>
window.ThaiEarTopic = {
  tier: "member",
  audioPrefix: "FoodSocial_LI1",
  sentences: [
  { num: 977, display: 1, preview: "กินข้าว", thai: "กินข้าวรึยังคะ", english: "Have you eaten yet?", gloss: [["กินข้าว", "eaten?"], ["รึยัง", "yet"], ["คะ", "polite(f)"]], cultural: "Thailand's most common informal greeting — like \"how are you?\" It isn't usually a literal question or a dinner invite; a simple \"กินแล้ว\" or \"ยัง\" is all the reply it needs." },
  { num: 978, display: 2, preview: "หาอะไรกิน", thai: "ถ้ายังไม่ได้กิน | ไปหาอะไรกินเสียก่อนดีกว่าครับ", english: "If you haven't eaten, let's go grab something first.", gloss: [["ถ้า", "if"], ["ยังไม่ได้", "not yet"], ["กิน", "eaten"], ["ไปหา", "go find"], ["อะไร", "something"], ["กิน", "eat"], ["เสียก่อน", "first"], ["ดีกว่า", "better"], ["ครับ", "polite(m)"]], cultural: "Suggesting you go eat together is a standard friendly gesture; sharing food, or making sure someone has eaten, is a basic way Thais show they care." },
  { num: 979, display: 3, preview: "กินข้าวด้วยกัน", thai: "ว่างไหม | เย็นนี้ไปกินข้าวด้วยกันไหมครับ", english: "Free tonight? Want to grab dinner together?", gloss: [["ว่าง", "free"], ["ไหม", "(question)"], ["เย็นนี้", "tonight"], ["ไป", "go"], ["กินข้าว", "eat"], ["ด้วยกัน", "together"], ["ไหม", "(question)"], ["ครับ", "polite(m)"]], cultural: "\"Want to eat together?\" is the default way to ask someone to hang out — the meal is the social activity, not necessarily a date." },
  { num: 980, display: 4, preview: "กับข้าว", thai: "อุตส่าห์ทำกับข้าวไว้ตั้งเยอะ | มากินข้าวที่บ้านกันนะคะ", english: "I went to all the trouble of making loads of food — come eat at my place.", gloss: [["อุตส่าห์", "bothered to"], ["ทำ", "make"], ["กับข้าว", "dishes"], ["ไว้", "(ready)"], ["ตั้งเยอะ", "so much"], ["มา", "come"], ["กินข้าว", "eat"], ["ที่บ้าน", "at home"], ["กัน", "together"], ["นะคะ", "polite(f)"]], cultural: "Inviting someone home and cooking a lot for them is core Thai hospitality (น้ำใจ) — a host shows care through abundance. กับข้าว means the dishes eaten with rice; rice itself is assumed." },
  { num: 981, display: 5, preview: "ชวน", thai: "เวลาคนไทยกินอะไร | มักจะชวนคนรอบข้างกินด้วยเสมอค่ะ", english: "When Thais eat, they always invite those nearby to join.", gloss: [["เวลา", "when"], ["คนไทย", "Thais"], ["กิน", "eat"], ["อะไร", "anything"], ["มักจะ", "tend to"], ["ชวน", "invite"], ["คนรอบข้าง", "those nearby"], ["กิน", "eat"], ["ด้วย", "too"], ["เสมอ", "always"], ["ค่ะ", "polite(f)"]], cultural: "Before eating, Thais reflexively invite whoever's around — even coworkers or near-strangers — to join. Declining politely is fine; the offer itself is the courtesy." },
  { num: 982, display: 6, preview: "เกรงใจ", thai: "ไม่ต้องเกรงใจนะคะ | กินเยอะๆเลย", english: "Don't be shy — eat lots!", gloss: [["ไม่ต้อง", "no need"], ["เกรงใจ", "be shy"], ["นะคะ", "polite(f)"], ["กิน", "eat"], ["เยอะๆ", "lots"], ["เลย", "(emphasis)"]], cultural: "เกรงใจ is a central Thai value: a considerate reluctance to trouble or impose on others. A host says \"ไม่ต้องเกรงใจ\" to release a guest from that politeness so they'll eat freely." },
  { num: 983, display: 7, preview: "แบ่งกัน", thai: "สั่งมาหลายอย่าง | แล้วแบ่งกันกินนะครับ", english: "Let's order several dishes and share them.", gloss: [["สั่ง", "order"], ["มา", "(in)"], ["หลายอย่าง", "many dishes"], ["แล้ว", "then"], ["แบ่งกัน", "share"], ["กิน", "eat"], ["นะครับ", "polite(m)"]], cultural: "Thai meals are communal: you order several dishes for the table and share everything, rather than each person ordering their own plate." },
  { num: 984, display: 8, preview: "หลายอย่าง", thai: "กินกันหลายคน | จะได้สั่งหลายอย่างมาแบ่งกันค่ะ", english: "Eating in a group, you can order lots to share.", gloss: [["กิน", "eat"], ["กัน", "together"], ["หลายคน", "many people"], ["จะได้", "so can"], ["สั่ง", "order"], ["หลายอย่าง", "many dishes"], ["มา", "(in)"], ["แบ่งกัน", "share"], ["ค่ะ", "polite(f)"]], cultural: "The more people, the better — a bigger group means more dishes ordered and shared, which is much of the appeal of eating out together." },
  { num: 985, display: 9, preview: "ตัก", thai: "กับข้าววางไว้กลางโต๊ะ | ใครอยากกินอะไรก็ตักเอาเลยครับ", english: "The dishes go in the middle — take whatever you like.", gloss: [["กับข้าว", "dishes"], ["วางไว้", "placed"], ["กลางโต๊ะ", "mid-table"], ["ใคร", "whoever"], ["อยาก", "wants"], ["กิน", "eat"], ["อะไร", "whatever"], ["ก็", "just"], ["ตักเอา", "spoon up"], ["เลย", "(go on)"], ["ครับ", "polite(m)"]], cultural: "Shared dishes sit in the centre; you spoon a little onto your own plate of rice as you go, rather than taking one big portion at once." },
  { num: 986, display: 10, preview: "ช้อนกลาง", thai: "ใช้ช้อนกลางตักด้วยนะคะ", english: "Use the serving spoon, please.", gloss: [["ใช้", "use"], ["ช้อนกลาง", "serving spoon"], ["ตัก", "scoop"], ["ด้วย", "too"], ["นะคะ", "polite(f)"]], cultural: "The ช้อนกลาง (\"central spoon\") is a shared serving spoon for taking food from communal dishes, so personal spoons never touch the shared plates — standard table hygiene, reinforced after COVID." },
  { num: 987, display: 11, preview: "เป็นหลัก", thai: "คนไทยกินข้าวเป็นหลักแทบทุกมื้อเลยค่ะ", english: "Thais eat rice as the staple at almost every meal.", gloss: [["คนไทย", "Thais"], ["กินข้าว", "eat rice"], ["เป็นหลัก", "as staple"], ["แทบ", "almost"], ["ทุกมื้อ", "every meal"], ["เลย", "(emphasis)"], ["ค่ะ", "polite(f)"]], cultural: "Rice is so central that a meal without it can feel incomplete — many Thais don't feel they've truly eaten unless rice was involved." },
  { num: 988, display: 12, preview: "กินข้าว", thai: "คำว่ากินข้าว | จริงๆแปลว่ากินอาหารทั่วไปนะครับ", english: "'Eating rice' really just means 'having a meal'.", gloss: [["คำว่า", "the phrase"], ["กินข้าว", "'eat rice'"], ["จริงๆ", "really"], ["แปลว่า", "means"], ["กิน", "eat"], ["อาหาร", "food"], ["ทั่วไป", "in general"], ["นะครับ", "polite(m)"]], cultural: "\"กินข้าว\" literally means \"eat rice,\" but it's the everyday word for \"have a meal\" whatever the food — a sign of how foundational rice is to Thai life and language." },
  { num: 989, display: 13, preview: "ริมทาง", thai: "แถวนี้มีของกินริมทางเยอะมากเลยค่ะ", english: "There's so much street food around here.", gloss: [["แถวนี้", "around here"], ["มี", "have"], ["ของกิน", "food"], ["ริมทาง", "roadside"], ["เยอะมาก", "loads"], ["เลย", "(emphasis)"], ["ค่ะ", "polite(f)"]], cultural: "Street food is everywhere — roadside stalls and carts are a normal, beloved part of daily eating, not a tourist novelty. Eating out this way is often cheaper than cooking." },
  { num: 990, display: 14, preview: "รถเข็น", thai: "คนไทยชอบซื้อของกินจากรถเข็นริมถนนครับ", english: "Thais love buying food from street carts.", gloss: [["คนไทย", "Thais"], ["ชอบ", "like"], ["ซื้อ", "buy"], ["ของกิน", "food"], ["จาก", "from"], ["รถเข็น", "food carts"], ["ริมถนน", "roadside"], ["ครับ", "polite(m)"]], cultural: "Mobile food carts sell everything from grilled meat to noodles to sweets, often parking in the same spot daily — regulars know exactly where their favourite cart sets up." },
  { num: 991, display: 15, preview: "ตลาดนัด", thai: "ตอนเย็นตลาดนัดมีอาหารให้เลือกเต็มไปหมดเลยค่ะ", english: "In the evening the market is packed with food to choose from.", gloss: [["ตอนเย็น", "evening"], ["ตลาดนัด", "market"], ["มี", "has"], ["อาหาร", "food"], ["ให้เลือก", "to choose"], ["เต็มไปหมด", "packed"], ["เลย", "(emphasis)"], ["ค่ะ", "polite(f)"]], cultural: "A ตลาดนัด is a periodic market (often evenings or weekends) that appears on set days — rows of food stalls where people graze, grab dinner to take home, or eat on the spot." },
  { num: 992, display: 16, preview: "แผงลอย", thai: "คนไทยชอบกินที่แผงลอย | เพราะถูกและสะดวกค่ะ", english: "Thais love eating at food stalls because it's cheap and convenient.", gloss: [["คนไทย", "Thais"], ["ชอบ", "like"], ["กิน", "eat"], ["ที่", "at"], ["แผงลอย", "stalls"], ["เพราะ", "because"], ["ถูก", "cheap"], ["และ", "and"], ["สะดวก", "convenient"], ["ค่ะ", "polite(f)"]], cultural: "แผงลอย are simple roadside stalls with a few stools. Eating at them is usually cheaper and easier than cooking, which is why even people with kitchens eat out daily." },
  { num: 993, display: 17, preview: "เลี้ยง", thai: "มื้อนี้ผมเลี้ยงเองนะครับ", english: "This meal's on me.", gloss: [["มื้อนี้", "this meal"], ["ผม", "I"], ["เลี้ยง", "treat"], ["เอง", "myself"], ["นะครับ", "polite(m)"]], cultural: "Treating others (เลี้ยง) is a common gesture of generosity and seniority — often one person pays for the whole table rather than splitting." },
  { num: 994, display: 18, preview: "แย่งกัน", thai: "คนไทยมักจะแย่งกันจ่ายค่าอาหารกันค่ะ", english: "Thais often fight over who pays the bill.", gloss: [["คนไทย", "Thais"], ["มักจะ", "tend to"], ["แย่งกัน", "fight over"], ["จ่าย", "pay"], ["ค่าอาหาร", "the bill"], ["กัน", "(together)"], ["ค่ะ", "polite(f)"]], cultural: "Rather than splitting, Thais often genuinely compete to pay the whole bill — grabbing it first is a show of generosity and face. Always letting others pay can seem ungracious." },
  { num: 995, display: 19, preview: "เลี้ยง", thai: "ไว้ครั้งหน้าให้ผมเลี้ยงบ้างนะครับ", english: "Let me treat you next time.", gloss: [["ไว้", "(for)"], ["ครั้งหน้า", "next time"], ["ให้", "let"], ["ผม", "me"], ["เลี้ยง", "treat"], ["บ้าง", "my turn"], ["นะครับ", "polite(m)"]], cultural: "The flip side of fighting to pay: if someone treats you, you offer to treat next time. This back-and-forth keeps the friendship balanced over many meals." },
  { num: 996, display: 20, preview: "หาร", thai: "ถ้ามากันหลายคน | ก็หารค่าอาหารคนละเท่าๆกันครับ", english: "If it's a big group, we split the bill evenly.", gloss: [["ถ้า", "if"], ["มา", "come"], ["กัน", "together"], ["หลายคน", "many"], ["ก็", "then"], ["หาร", "split"], ["ค่าอาหาร", "the bill"], ["คนละ", "each"], ["เท่าๆกัน", "equally"], ["ครับ", "polite(m)"]], cultural: "For bigger groups, splitting evenly (หาร) is increasingly common — especially among younger people and colleagues — as a practical alternative to one person treating everyone." },
  { num: 997, display: 21, preview: "พร้อมหน้า", thai: "ครอบครัวผมชอบกินข้าวพร้อมหน้ากันตอนเย็นครับ", english: "My family likes eating all together in the evening.", gloss: [["ครอบครัว", "family"], ["ผม", "my"], ["ชอบ", "like"], ["กินข้าว", "eat"], ["พร้อมหน้า", "all together"], ["กัน", "(together)"], ["ตอนเย็น", "evening"], ["ครับ", "polite(m)"]], cultural: "Eating together as a whole family (พร้อมหน้าพร้อมตา) is valued; the evening meal is often when everyone reconvenes, and eating apart can feel like a small loss." },
  { num: 998, display: 22, preview: "กินด้วยกัน", thai: "เวลาเพื่อนสนิทเจอกัน | ต้องไปหาอะไรกินด้วยกันทุกทีค่ะ", english: "When close friends meet up, they always go eat together.", gloss: [["เวลา", "when"], ["เพื่อนสนิท", "close friends"], ["เจอกัน", "meet up"], ["ต้อง", "must"], ["ไปหา", "go find"], ["อะไร", "something"], ["กิน", "eat"], ["ด้วยกัน", "together"], ["ทุกที", "every time"], ["ค่ะ", "polite(f)"]], cultural: "Meeting up almost always centres on food — \"let's get food\" is the default plan when friends gather; the eating is the activity, not a side note." },
  { num: 999, display: 23, preview: "ล้อมวง", thai: "ล้อมวงกินข้าวกันแบบนี้อบอุ่นดีนะคะ", english: "Sitting around eating together like this is so cosy.", gloss: [["ล้อมวง", "circle up"], ["กินข้าว", "eat"], ["กัน", "together"], ["แบบนี้", "like this"], ["อบอุ่น", "warm"], ["ดี", "nicely"], ["นะคะ", "polite(f)"]], cultural: "ล้อมวง — literally circling up — captures the warmth of everyone gathered close around shared dishes, often on the floor or a low table. The closeness is part of the meal's meaning." },
  { num: 1000, display: 24, preview: "จุบจิบ", thai: "คนไทยชอบกินจุบจิบทั้งวันเลยค่ะ", english: "Thais love snacking all day.", gloss: [["คนไทย", "Thais"], ["ชอบ", "like"], ["กิน", "eat"], ["จุบจิบ", "snack"], ["ทั้งวัน", "all day"], ["เลย", "(emphasis)"], ["ค่ะ", "polite(f)"]], cultural: "Grazing between meals is common — there's usually something to nibble within reach, from fruit to grilled skewers to sweets." },
  { num: 1001, display: 25, preview: "กินเล่น", thai: "ระหว่างมื้อก็หาของกินเล่นตลอดเลยครับ", english: "Between meals they're always finding snacks.", gloss: [["ระหว่างมื้อ", "between meals"], ["ก็", "also"], ["หา", "find"], ["ของกินเล่น", "snacks"], ["ตลอด", "always"], ["เลย", "(emphasis)"], ["ครับ", "polite(m)"]], cultural: "\"กินเล่น\" (eat-for-play) means eating for pleasure rather than hunger — casual snacks and small treats enjoyed between proper meals." },
  { num: 1002, display: 26, preview: "นอกบ้าน", thai: "เดี๋ยวนี้คนเมืองกินข้าวนอกบ้านกันมากขึ้นเรื่อยๆค่ะ", english: "These days city folk eat out more and more.", gloss: [["เดี๋ยวนี้", "nowadays"], ["คนเมือง", "city folk"], ["กินข้าว", "eat"], ["นอกบ้าน", "out"], ["กัน", "(together)"], ["มากขึ้นเรื่อยๆ", "more and more"], ["ค่ะ", "polite(f)"]], cultural: "In cities, busy lives and cheap, plentiful food mean many people rarely cook — eating out or ordering in for most meals is normal, and often cheaper than groceries." },
  { num: 1003, display: 27, preview: "เดลิเวอรี", thai: "เดี๋ยวนี้จะกินที่ร้านไม่ก็สั่งเดลิเวอรีก็ได้ | สะดวกไปหมดครับ", english: "These days you can eat out or just order delivery — it's all so easy.", gloss: [["เดี๋ยวนี้", "nowadays"], ["จะ", "can"], ["กิน", "eat"], ["ที่ร้าน", "out"], ["ไม่ก็", "or"], ["สั่ง", "order"], ["เดลิเวอรี", "delivery"], ["ก็ได้", "too"], ["สะดวกไปหมด", "all easy"], ["ครับ", "polite(m)"]], cultural: "Food-delivery apps (GrabFood, LINE MAN, foodpanda) are huge in Thailand; near-instant delivery of cheap restaurant meals has reshaped how city dwellers eat." },
  { num: 1004, display: 28, preview: "ทำกับข้าว", thai: "ขี้เกียจทำกับข้าว | สั่งมากินที่บ้านดีกว่าค่ะ", english: "Too lazy to cook — let's just order in.", gloss: [["ขี้เกียจ", "too lazy"], ["ทำกับข้าว", "to cook"], ["สั่ง", "order"], ["มา", "in"], ["กิน", "eat"], ["ที่บ้าน", "at home"], ["ดีกว่า", "better"], ["ค่ะ", "polite(f)"]], cultural: "With cheap, fast options everywhere, \"can't be bothered to cook\" easily wins — ordering in is so routine that many city kitchens barely get used." },
  { num: 1005, display: 29, preview: "เหลือ", thai: "กับข้าวเหลือเยอะ | เก็บไว้กินมื้อหน้าก็ได้ค่ะ", english: "There's lots of food left — we can keep it for the next meal.", gloss: [["กับข้าว", "dishes"], ["เหลือ", "left over"], ["เยอะ", "lots"], ["เก็บไว้", "keep"], ["กิน", "eat"], ["มื้อหน้า", "next meal"], ["ก็ได้", "can"], ["ค่ะ", "polite(f)"]], cultural: "Not wasting food is a strong value; leftovers are routinely saved and reheated, and older generations especially dislike throwing food away." },
