  { num: 285, display: 1, preview: "ตื่นนอน", thai: "ผมตื่นนอนหกโมงเช้าครับ", english: "I wake up at six in the morning.", gloss: [["ผม", "I(m)"], ["ตื่นนอน", "wake up"], ["หกโมงเช้า", "6 a.m."], ["ครับ", "polite(m)"]], cultural: "" },
  { num: 286, display: 2, preview: "อาบน้ำ", thai: "ผมไปอาบน้ำก่อนดีกว่าครับ", english: "I'd better go shower first.", gloss: [["ผม", "I(m)"], ["ไป", "go"], ["อาบน้ำ", "shower"], ["ก่อน", "first"], ["ดีกว่า", "better"], ["ครับ", "polite(m)"]], cultural: "Thais often shower twice a day, morning and evening, because of the heat." },

  { num: 309, display: 15, preview: "ปิดไฟ", thai: "ก่อนนอนผมปิดไฟแล้วล็อกประตูครับ", english: "Before bed I turn off the lights and lock the door.", gloss: [["ก่อนนอน", "before bed"], ["ผม", "I(m)"], ["ปิดไฟ", "turn off lights"], ["แล้ว", "then"], ["ล็อกประตู", "lock the door"], ["ครับ", "polite(m)"]], cultural: "" },
