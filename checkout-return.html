<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Returning to ThaiEar…</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#FAFAF8;color:#1A1A1A;text-align:center}
    .b{padding:2rem;max-width:22rem}h1{font-size:1.15rem;margin:0 0 .5rem;font-weight:600}
    p{color:#5A5A5A;line-height:1.6;margin:.25rem 0 1.2rem}
    a{color:#4B41AD;text-decoration:none;font-weight:500}
  </style>
</head>
<body>
  <div class="b">
    <h1>Returning to ThaiEar…</h1>
    <p id="msg">Taking you back to the app.</p>
    <p><a id="manual" href="/account.html?sub=success">Tap here if it doesn’t happen automatically</a></p>
  </div>
  <script>
    (function () {
      // This page is ONLY used as Stripe's return URL when checkout was started inside the app. It
      // bounces to the app's custom-scheme deep link (Stripe won't accept a custom scheme directly),
      // which the app catches in auth.js (appUrlOpen) to close the browser + refresh membership.
      var q = new URLSearchParams(location.search);
      var status = q.get('status') === 'cancel' ? 'cancel' : 'success';
      var webFallback = status === 'cancel' ? '/subscribe.html' : '/account.html?sub=success';
      document.getElementById('manual').setAttribute('href', webFallback);
      if (status === 'cancel') {
        document.getElementById('msg').textContent = 'Checkout cancelled — returning to the app.';
      }
      try { location.href = 'com.thaiear.app://checkout-return?status=' + status; } catch (_) {}
      // If the deep link didn't fire (e.g. this somehow opened on the desktop web), fall back to the
      // normal web pages so the user is never stranded here.
      setTimeout(function () { location.href = webFallback; }, 2500);
    })();
  </script>
</body>
</html>
