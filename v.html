<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1A1A1A; --text-secondary: #5A5A5A; --text-tertiary: #9A9A9A;
    --accent: #261B65; --accent-light: #ECEBFA; --accent-mid: #342682;
    --gold: #F0CC5C; --gold-dark: #C8A030; --purple-mid: #7F77DD;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font-ui: 'Inter', system-ui, sans-serif; --font-thai: 'Sarabun', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
  /* Single-copy accordion (SSR): reveal rows are in the source but collapsed by default
     (answers never flash before JS; non-JS clients get them collapsed). player.js toggles
     st-0..st-3 on click; CSS shows the matching rows. */
  .sentence-card .reveal-row { display: none; }
  .sentence-card.st-0 .sentence-body { display: none; }
  .sentence-card.st-1 .row-thai { display: block; }
  .sentence-card.st-2 .row-thai, .sentence-card.st-2 .row-english { display: block; }
  .sentence-card.st-3 .row-thai, .sentence-card.st-3 .row-english, .sentence-card.st-3 .row-notes { display: block; }
  .sentence-card.st-1 .row-thai, .sentence-card.st-2 .row-english { border-bottom: none; }
  .sentence-card.st-1 .prog-seg:nth-child(1),
  .sentence-card.st-2 .prog-seg:nth-child(-n+2),
  .sentence-card.st-3 .prog-seg { background: var(--accent); }
  /* Reserve the audio player's height so the static cards below don't jump when player.js
     injects it (CLS). Set just under the rendered height so it never leaves a visible gap. */
  /* ⚠ SCALES WITH THE MEASURED TEXT INFLATION (--te-ui-raw, published by nav.js). This
     reserve stops the JS-injected player shoving the static cards down on load, and the
     350/379 figures are MEASURED at default text — so under Android's textZoom, or the
     iOS Dynamic Type scaling, the player outgrew them and the shift came back (measured:
     390px actual vs 379 reserve at default, 464 at 1.12x, 898 at 2x). Resolves to exactly
     350/379px at --te-ui-raw: 1, i.e. unchanged on desktop and at default size. */
  #player-root { min-height: calc(512px * var(--te-ui-raw, 1)); }
  @media (max-width: 600px)    { #player-root { min-height: calc(510px * var(--te-ui-raw, 1)); } }
  @media (max-width: 438.98px) { #player-root { min-height: calc(528px * var(--te-ui-raw, 1)); } }
  @media (max-width: 374.98px) { #player-root { min-height: calc(560px * var(--te-ui-raw, 1)); } }
  /* ⚠ The floor is REMOVED once player.js mounts the real player (it adds .te-player-mounted).
     A reserve can only be wrong in two directions and a too-LARGE one leaves a permanent visible
     gap — which an iPhone PWA showed, because these px were measured in desktop Chrome. After
     mount the player's own height is authoritative, so the guess stops mattering entirely.
     ⚠ Written HERE as well as in player-dyn-mount.css: the first load after a deploy pairs new
     markup with the OLD cached stylesheet, and without this inline copy that load keeps the gap. */
  body.te-player-mounted #player-root { min-height: 0; }
  .page-wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .topic-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .topic-title { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; color: var(--text-primary); margin-bottom: 4px; line-height: 1.2; }
  /* 0.8rem, was 1.75rem (owner, 2026-08-20). The old figure was set when the classic player
     sat under this line; the dyn player begins with its own heading and card, and with the
     progress bar removed from the top of it the two were separated by nearly a finger's
     width on an iPhone. */
  /* Sits LOWER in the same band (owner, 2026-08-20): the margin moves from below the line to
     above it, so the line drops without the space around it growing. Font up 13->14px — at 13
     it read as fine print rather than orientation. */
  .topic-meta { font-size: 14px; line-height: 1.28; color: var(--text-tertiary); margin: 0.2rem 0 0.5rem; }
  .topic-meta strong { color: var(--text-secondary); font-weight: 500; }
  /* Tap/Click: the affordance is a property of the INPUT, not the viewport width, so
     this asks (pointer:fine) rather than a breakpoint -- a touch laptop keeps "Tap".
     In the page's own style block on purpose: quiz.css arriving late would show both. */
  .tm-click { display: none; }
  @media (hover: hover) and (pointer: fine) { .tm-tap { display: none; } .tm-click { display: inline; } }
  /* ⚠ The picker, not a quiz. ?quiz=menu is the same url the band-card strip uses, so
     entitlement is handled where it already is (quiz.js fires the gate in front of
     openMenu()); a premium unit shows the picker and gates on choosing. quiz.js also
     REMOVES this link if the gate ever answers false -- see tmQuizLink(). */
  .topic-meta .tm-quiz { color: var(--accent); text-decoration: underline; }
  .topic-nav { display: flex; justify-content: space-between; align-items: stretch; margin-top: 2.5rem; padding-top: 1.5rem; border-top: 0.5px solid var(--border); gap: 1rem; }
  .topic-nav-btn { display: inline-flex; align-items: center; gap: 6px; max-width: 46%; min-width: 0; overflow-wrap: break-word; font-size: calc(13px * var(--te-ui, 1)); font-family: var(--font-ui); color: var(--accent); text-decoration: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); padding: 7px 14px; transition: background 0.15s, border-color 0.15s; white-space: normal; }
  .topic-nav-btn > span { min-width: 0; overflow-wrap: break-word; }  /* flex item: without min-width:0 its min-content width overflows the 46% cap */
  .topic-nav-btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .topic-nav-btn.disabled { color: var(--text-tertiary); border-color: var(--border); pointer-events: none; opacity: 0.4; }
  .topic-nav-label { font-size: calc(11px * var(--te-ui, 1)); color: var(--text-tertiary); letter-spacing: 0.05em; text-transform: uppercase; }
  .topic-nav-name { font-size: calc(13px * var(--te-ui, 1)); color: var(--text-primary); font-weight: 500; }
  .topic-nav-right { text-align: right; }
  @media (max-width: 800px) { .page-wrap { padding: 1.5rem 1.25rem 3rem; } .topic-title { font-size: 22px; } }
  @media (max-width: 600px) {
    .page-wrap { padding: 1.25rem 1rem 2.5rem; } .topic-eyebrow { font-size: 10px; } .topic-title { font-size: 20px; } .topic-meta { font-size: 13px; margin: 0.2rem 0 0.45rem; }
    .topic-nav-btn { font-size: calc(12px * var(--te-ui, 1)); padding: 6px 10px; }
  }
  @media (max-width: 380px) { .topic-title { font-size: 18px; } }
