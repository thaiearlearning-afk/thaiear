<script>
window.ThaiEarTopic = {

  audioPrefix: "Job_LI1",
  sentences: [
  { num: 832, display: 1, preview: "เอกสาร", thai: "งานหลักๆคือดูแลเรื่องเอกสารครับ", english: "My main job is handling the paperwork.", gloss: [["งานหลักๆ", "main job"], ["ดูแล", "handle / look after"], ["เอกสาร", "documents / paperwork"], ["ครับ", "polite particle (male)"]], cultural: "" },
  { num: 833, display: 2, preview: "หน้าที่", thai: "หน้าที่ของเขาคือคอยตอบอีเมลลูกค้าค่ะ", english: "His job is answering customer emails.", gloss: [["หน้าที่", "duty / role"], ["คอย", "keep (doing)"], ["ตอบอีเมล", "answer emails"], ["ลูกค้า", "customer"], ["ค่ะ", "polite particle (female)"]], cultural: "เขา is a gender-neutral third-person pronoun — 'he', 'she' or 'they' depending on who's meant." },
  { num: 834, display: 3, preview: "ตำแหน่ง", thai: "ตำแหน่งใหม่รับผิดชอบเยอะกว่าเดิมค่ะ", english: "The new position has a lot more responsibility than before.", gloss: [["ตำแหน่ง", "position"], ["รับผิดชอบ", "responsibility"], ["เยอะกว่าเดิม", "more than before"], ["ค่ะ", "polite particle (female)"]], cultural: "" },
  { num: 835, display: 4, preview: "ส่งงาน", thai: "เดี๋ยวผมส่งงานให้เจ้านายตรวจก่อนนะครับ", english: "Let me send the work to my boss to check first.", gloss: [["เดี๋ยว", "in a moment"], ["ส่งงาน", "submit the work"], ["เจ้านาย", "boss"], ["ตรวจ", "check / review"], ["ก่อน", "first"], ["นะครับ", "polite (male)"]], cultural: "เจ้านาย and หัวหน้า both translate as 'boss': เจ้านาย leans toward the employer/big boss, หัวหน้า toward your direct supervisor." },
  { num: 836, display: 5, preview: "เข้างาน", thai: "ปกติเข้างานแปดโมง | เลิกห้าโมงเย็นค่ะ", english: "I usually start work at eight and finish at five.", gloss: [["ปกติ", "usually"], ["เข้างาน", "start work"], ["แปดโมง", "8 a.m."], ["เลิก", "finish"], ["ห้าโมงเย็น", "5 p.m."], ["ค่ะ", "polite (female)"]], cultural: "Thai tells daytime hours with โมง on a smaller clock: แปดโมง(เช้า) = 8 a.m., ห้าโมงเย็น = 5 p.m." },
  { num: 837, display: 6, preview: "โอที", thai: "ช่วงนี้งานเยอะ | ต้องอยู่ทำโอทีเกือบทุกวันเลยครับ", english: "There's a lot of work lately — I have to do overtime almost every day.", gloss: [["ช่วงนี้", "these days"], ["งานเยอะ", "lots of work"], ["โอที", "overtime"], ["เกือบทุกวัน", "almost every day"], ["ครับ", "polite (male)"]], cultural: "" },
  { num: 838, display: 7, preview: "ประชุม", thai: "ประชุมเช้านี้ยาวมาก | กว่าจะเลิกก็เที่ยงเลยค่ะ", english: "This morning's meeting was so long it didn't finish until noon.", gloss: [["ประชุม", "meeting"], ["ยาว", "long"], ["กว่าจะเลิก", "before it finally ended"], ["เที่ยง", "noon"], ["ค่ะ", "polite (female)"]], cultural: "กว่าจะ…ก็ frames 'by the time X happened' — it dragged on longer than expected." },
  { num: 839, display: 8, preview: "ลาป่วย", thai: "วันนี้ขอลาป่วยนะครับ | ไม่ค่อยสบาย", english: "I'd like to take sick leave today — I'm not feeling well.", gloss: [["ขอ", "may I…"], ["ลาป่วย", "take sick leave"], ["ไม่ค่อยสบาย", "not feeling well"]], cultural: "" },
  { num: 840, display: 9, preview: "ลาพักร้อน", thai: "อาทิตย์หน้าผมลาพักร้อนสามวันครับ", english: "Next week I'm taking three days of annual leave.", gloss: [["อาทิตย์หน้า", "next week"], ["ลาพักร้อน", "take annual leave"], ["สามวัน", "three days"], ["ครับ", "polite (male)"]], cultural: "ลาพักร้อน (literally 'leave to rest from the heat') is the everyday word for paid annual/holiday leave." },
  { num: 841, display: 10, preview: "ภายใน", thai: "งานนี้ต้องส่งภายในศุกร์นี้ครับ", english: "This has to be handed in by this Friday.", gloss: [["ต้องส่ง", "must hand in"], ["ภายใน", "within / by"], ["ศุกร์นี้", "this Friday"], ["ครับ", "polite (male)"]], cultural: "" },
  { num: 842, display: 11, preview: "ออฟฟิศ", thai: "ทำงานออฟฟิศมันก็นั่งหน้าคอมทั้งวันแหละครับ", english: "Office work is basically sitting at a computer all day.", gloss: [["ทำงานออฟฟิศ", "office work"], ["นั่งหน้าคอม", "sit at the computer"], ["ทั้งวัน", "all day"], ["แหละ", "(settling emphasis)"]], cultural: "แหละ adds a resigned 'that's just how it is' tone. คอม is short for คอมพิวเตอร์." },
  { num: 843, display: 12, preview: "เร่งงาน", thai: "ช่วงนี้ลูกค้าเร่งงานมาก | เลยต้องรีบหน่อยค่ะ", english: "Clients are really pushing right now, so I have to hurry.", gloss: [["ลูกค้า", "client / customer"], ["เร่งงาน", "push / rush the work"], ["ต้องรีบ", "have to hurry"], ["ค่ะ", "polite (female)"]], cultural: "" },
  { num: 844, display: 13, preview: "ลูกน้อง", thai: "ลูกน้องในทีมมีอยู่ห้าคนค่ะ", english: "I've got five people in my team.", gloss: [["ลูกน้อง", "subordinates / staff"], ["ในทีม", "in the team"], ["ห้าคน", "five (people)"], ["ค่ะ", "polite (female)"]], cultural: "ลูกน้อง (lit. 'junior') are the people under you — the counterpart to หัวหน้า/เจ้านาย above you." },
  { num: 845, display: 14, preview: "เจอคน", thai: "ชอบงานที่ได้เจอคนเยอะๆค่ะ", english: "I like work where I get to meet lots of people.", gloss: [["ชอบ", "like"], ["งานที่...", "work that..."], ["ได้เจอคน", "get to meet people"], ["เยอะๆ", "lots"], ["ค่ะ", "polite (female)"]], cultural: "" },
  { num: 846, display: 15, preview: "โต๊ะทำงาน", thai: "งานยุ่ง | จนต้องกินข้าวที่โต๊ะทำงานเลยค่ะ", english: "So busy I end up eating at my desk.", gloss: [["งานยุ่ง", "busy with work"], ["จน", "so much that"], ["โต๊ะทำงาน", "desk"], ["ค่ะ", "polite (female)"]], cultural: "Here จน means 'to the point that / so…that' (a result), not the other จน meaning 'poor'." },
  { num: 847, display: 16, preview: "พักเที่ยง", thai: "พักเที่ยงปกติออกไปกินข้าวข้างนอกไหมคะ", english: "At lunch, do you usually go out to eat?", gloss: [["พักเที่ยง", "lunch break"], ["ออกไป", "go out"], ["กินข้าวข้างนอก", "eat out"], ["ไหม", "question particle"], ["คะ", "polite (female)"]], cultural: "" },
  { num: 848, display: 17, preview: "ปรินต์", thai: "กระดาษปรินต์หมด | เดี๋ยวไปเอามาเติมนะครับ", english: "We're out of printer paper — I'll go refill it.", gloss: [["กระดาษปรินต์", "printer paper"], ["หมด", "run out"], ["ไปเอามาเติม", "go and refill"], ["นะครับ", "polite (male)"]], cultural: "" },
  { num: 849, display: 18, preview: "เครื่องถ่ายเอกสาร", thai: "เครื่องถ่ายเอกสารใช้ไม่ได้ | ต้องเรียกช่างมาดูค่ะ", english: "The photocopier's not working — we have to call a technician.", gloss: [["เครื่องถ่ายเอกสาร", "photocopier"], ["ใช้ไม่ได้", "not working"], ["เรียกช่าง", "call a technician"], ["ค่ะ", "polite (female)"]], cultural: "ช่าง is the general word for any skilled tradesperson — technician, mechanic, repairman, craftsman." },
  { num: 850, display: 19, preview: "โทรกลับ", thai: "เดี๋ยวโทรกลับนะครับ | ตอนนี้กำลังประชุมอยู่", english: "I'll call you back — I'm in a meeting right now.", gloss: [["โทรกลับ", "call back"], ["นะครับ", "polite (male)"], ["กำลัง...อยู่", "in the middle of"], ["ประชุม", "a meeting"]], cultural: "กำลัง…อยู่ wraps a verb to mean 'currently doing X' — the Thai present continuous." },
  { num: 851, display: 20, preview: "โปรเจกต์", thai: "ตอนนี้ผมดูแลโปรเจกต์ใหม่อยู่ | งานเลยเยอะเป็นพิเศษครับ", english: "I'm running a new project at the moment, so it's especially busy.", gloss: [["ดูแล", "look after / run"], ["โปรเจกต์", "project"], ["งานเยอะ", "lots of work"], ["เป็นพิเศษ", "especially"], ["ครับ", "polite (male)"]], cultural: "" },
  { num: 852, display: 21, preview: "โรงงาน", thai: "พี่เขาทำงานในโรงงาน | เข้ากะดึกตลอดเลยค่ะ", english: "He works in a factory — always on the night shift.", gloss: [["พี่เขา", "he (older person)"], ["โรงงาน", "factory"], ["เข้ากะดึก", "work the night shift"], ["ตลอด", "always"], ["ค่ะ", "polite (female)"]], cultural: "พี่ ('elder sibling') doubles as a respectful pronoun for an older person. เข้ากะ = to work a shift; กะดึก = the night shift." },
  { num: 853, display: 22, preview: "งานเสร็จ", thai: "ถ้างานเสร็จเร็ว | เย็นนี้ก็กลับบ้านได้ครับ", english: "If the work's done early, I can go home this evening.", gloss: [["ถ้า", "if"], ["งานเสร็จ", "work is done"], ["เร็ว", "early / fast"], ["กลับบ้าน", "go home"], ["ครับ", "polite (male)"]], cultural: "" },
  { num: 854, display: 23, preview: "จันทร์ถึงศุกร์", thai: "ที่นี่ทำงานจันทร์ถึงศุกร์ใช่ไหมคะ", english: "You work Monday to Friday here, right?", gloss: [["ที่นี่", "here"], ["จันทร์ถึงศุกร์", "Monday to Friday"], ["ใช่ไหม", "...right?"], ["คะ", "polite (female)"]], cultural: "" },
  { num: 855, display: 24, preview: "บริษัท", thai: "อยู่บริษัทนี้มานานหรือยังครับ", english: "Have you been at this company long?", gloss: [["บริษัท", "company"], ["มานาน", "for a long time"], ["หรือยัง", "...yet?"], ["ครับ", "polite (male)"]], cultural: "…มา…หรือยัง asks 'have you been …-ing for a while (yet)?' — มา marks an action running up to now." },
]
};
