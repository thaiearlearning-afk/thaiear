<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1A1A1A; --text-secondary: #5A5A5A; --text-tertiary: #9A9A9A;
    --accent: #4B41AD; --accent-light: #EEEDFE; --accent-mid: #534AB7;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font-ui: 'Inter', system-ui, sans-serif; --font-thai: 'Sarabun', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
  .lede { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 1.4rem; }
  /* ── modal (pattern copied from account.html's delete-account modal) ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,16,48,0.45); display: flex; align-items: center; justify-content: center; padding: 1.25rem; z-index: 1000; }
  .modal-card { background: var(--surface); border-radius: var(--radius-lg); max-width: 400px; width: 100%; padding: 1.5rem 1.5rem 1.35rem; box-shadow: 0 12px 40px rgba(0,0,0,0.2); }
  .modal-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 0.5rem; }
  .modal-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 1rem; line-height: 1.55; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn { font-family: var(--font-ui); font-size: 14px; font-weight: 500; border-radius: var(--radius-sm); padding: 9px 18px; cursor: pointer; border: 0.5px solid var(--border-strong); transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-mid); }
  .btn-ghost { background: var(--surface); color: var(--text-secondary); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: #B00020; color: #fff; border-color: #B00020; }
  .btn-danger:hover { background: #8a0019; }
</style>

<body>

<div id="site-nav-root" style="min-height:54px;background:var(--surface);border-bottom:0.5px solid var(--border)"></div>

<div class="wrap">
  <div class="eyebrow">Owner test build</div>
  <h1>My Playlists</h1>
  <p class="lede">Build custom sessions from sentences you've added on any topic page. Expand a playlist to play it — the session file is constructed on your device, exactly like a topic.</p>
  <button class="pl-add" id="pl-add" type="button">＋ Add playlist</button>
  <div id="pl-root"><p class="pl-note">Loading…</p></div>
</div>

<script>window.ThaiEarTopic = { test: true };</script>
<script src="player-dyn.js"></script>
<script>
(function () {
  var root = document.getElementById('pl-root');
  var openId = null;
  var instances = {};

  function PL() { return window.ThaiEarAuth && window.ThaiEarAuth.playlists; }
  function user() { return window.ThaiEarAuth && window.ThaiEarAuth.getUser && window.ThaiEarAuth.getUser(); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  // On-brand confirmation modal (pattern copied from account.html's delete-account modal).
  // opts: { title, body(html), confirmText, cancelText, danger, onConfirm }
  function showModal(opts) {
    var ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML =
      '<div class="modal-card" role="dialog" aria-modal="true">' +
        '<h2>' + esc(opts.title) + '</h2>' +
        '<p>' + (opts.body || '') + '</p>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="modal-cancel">' + esc(opts.cancelText || 'Cancel') + '</button>' +
          '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" id="modal-ok">' + esc(opts.confirmText || 'Confirm') + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); }
    ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
    ov.querySelector('#modal-cancel').addEventListener('click', close);
    ov.querySelector('#modal-ok').addEventListener('click', function () { close(); opts.onConfirm(); });
  }

  // Cache-first data source: the loaded server copy, else the localStorage copy — the latter
  // is readable even before auth/the Supabase client resolve (peek never touches plCache),
  // with a direct localStorage fallback for the window before auth.js itself has run.
  function currentLists() {
    var pl = PL();
    var lists = pl && pl.get ? pl.get() : null;
    if (!lists && pl && pl.peek) lists = pl.peek();
    if (!lists) { try { lists = JSON.parse(localStorage.getItem('thaiear_playlists') || 'null'); } catch (_) { lists = null; } }
    return lists || null;
  }
  var paintedJson = null;   // JSON of the playlist data currently painted as boxes (null = message/loading shown)
  function authReady() { return !!(window.ThaiEarAuth && window.ThaiEarAuth.isReady); }
  function showLoading() {
    paintedJson = null;
    root.innerHTML = '<p class="pl-note">Loading playlists<span class="dyn-dots"></span></p>';
  }

  function render() {
    // a re-render invalidates any live batch-remove bar (its instance is being replaced)
    var rb = document.getElementById('dyn-rm-bar');
    if (rb) rb.parentNode.removeChild(rb);
    if (authReady() && !user()) {
      paintedJson = null;
      root.innerHTML = '<p class="pl-note">Sign in (via the Menu) to create and play playlists. Playlists are free for every account.</p>';
      return;
    }
    var lists = currentLists();
    if (!lists) { showLoading(); return; }   // no cache on this device yet → indicator until load resolves
    paintedJson = JSON.stringify(lists);
    if (!lists.length) {
      root.innerHTML = '<p class="pl-note">No playlists yet. Tap <strong>＋ Add playlist</strong>, then add sentences from any topic page (the “＋ Add sentences…” button under its player).</p>';
      return;
    }
    root.innerHTML = lists.map(function (p) {
      return '<div class="pl-box' + (p.id === openId ? ' open' : '') + '" data-id="' + p.id + '">' +
        '<button class="pl-box-head" type="button">' +
          '<span class="pl-box-name">' + esc(p.name) + '</span>' +
          '<span class="pl-box-meta">' + p.items.length + ' sentence' + (p.items.length === 1 ? '' : 's') + '</span>' +
          '<span class="pl-box-chev" aria-hidden="true">⌄</span>' +
        '</button>' +
        '<div class="pl-box-body"><div class="pl-player dyn-wrap"></div>' +
          (p.items.length ? '<button class="pl-remsent" type="button">Remove sentences</button>' : '') +
          '<button class="pl-del" type="button">Delete playlist</button>' +
        '</div></div>';
    }).join('');
    root.querySelectorAll('.pl-box').forEach(function (box) {
      var id = box.getAttribute('data-id');
      var p = lists.filter(function (x) { return x.id === id; })[0];
      box.querySelector('.pl-box-head').addEventListener('click', function () {
        openId = (openId === id) ? null : id;
        render();
      });
      var rs = box.querySelector('.pl-remsent');
      if (rs) rs.addEventListener('click', function () {
        if (openId !== id) { openId = id; render(); }   // player must be mounted for tick mode
        var inst = instances[id];
        if (inst && inst.enterRemoveMode) inst.enterRemoveMode();
      });
      box.querySelector('.pl-del').addEventListener('click', function () {
        showModal({
          title: 'Delete “' + p.name + '”?',
          body: 'This can’t be undone — the sentences themselves are not affected.',
          confirmText: 'Delete playlist', danger: true,
          onConfirm: function () {
            PL().remove(id).then(function () { if (openId === id) openId = null; render(); })
              .catch(function () { alert('Couldn’t delete — check your connection.'); });
          }
        });
      });
      if (p.id === openId) mountPlayer(box, p, lists);
    });
  }

  function mountPlayer(box, p, lists) {
    var mountEl = box.querySelector('.pl-player');
    if (!p.items.length) {
      mountEl.innerHTML = '<p class="pl-note">This playlist is empty.</p>';
      return;
    }
    // Circular wrap over NON-EMPTY playlists only (round-7: skip empties, like the classic
    // player skips non-entitled topics). A single non-empty playlist keeps the buttons hidden.
    var navList = lists.filter(function (x) { return x.items && x.items.length; });
    var nIdx = navList.indexOf(p);
    var wrap = navList.length > 1;
    var prev = wrap ? navList[(nIdx - 1 + navList.length) % navList.length] : null;
    var next = wrap ? navList[(nIdx + 1) % navList.length] : null;
    instances[p.id] = ThaiEarDyn.create(mountEl, {
      name: p.name,
      topicKey: 'playlist',
      persistId: p.id,   // round-8: playlist sessions persist per playlist id
      prefix: '',
      tier: 'free',
      sentences: p.items.map(function (i) {
        return { num: i.num, thai: i.thai, translit: i.translit, english: i.english, prefix: i.prefix, tier: i.tier, topic_key: i.topic_key };
      }),
      features: { removeItem: true, batchRemove: true },
      onRemoveItem: function (s) {
        showModal({
          title: 'Remove this sentence?',
          body: 'It will be removed from “' + esc(p.name) + '”.',
          confirmText: 'Remove', danger: true,
          onConfirm: function () {
            PL().removeItem(p.id, s.topic_key, s.num).then(function () { render(); })
              .catch(function () { alert('Couldn’t remove — check your connection.'); });
          }
        });
      },
      onBatchRemoveItem: function (item) { return PL().removeItem(p.id, item.topic_key, item.num); },
      onBatchRemoveDone: function () { render(); },
      nav: {
        // If audio was playing (incl. lock-screen ⏮/⏭ in the app), keep it playing on the
        // adjacent playlist — expand-only reads as a dead button from the lock screen.
        onPrev: prev ? function () {
          var was = instances[p.id] && instances[p.id].isPlaying();
          openId = prev.id; render();
          if (was && instances[prev.id]) instances[prev.id].play();
        } : null,
        onNext: next ? function () {
          var was = instances[p.id] && instances[p.id].isPlaying();
          openId = next.id; render();
          if (was && instances[next.id]) instances[next.id].play();
        } : null
      }
    });
  }

  document.getElementById('pl-add').addEventListener('click', function () {
    if (!user()) { alert('Sign in first (via the Menu) to create playlists.'); return; }
    var name = prompt('Playlist name:');
    if (!name || !name.trim()) return;
    PL().create(name.trim().slice(0, 60)).then(function (p) { openId = p.id; render(); })
      .catch(function (e) {
        var msg = (e && (e.message || e.details || e.hint)) || JSON.stringify(e);
        alert('Couldn’t create the playlist.\n\nError: ' + msg + '\n\nIf it says the relation does not exist, playlists_schema.sql was likely run in the wrong Supabase project — check the project ref is pyfyyiegmxwmfshgwvze.');
      });
  });

  function boot() {
    // CACHE-FIRST: paint the localStorage copy immediately (no waiting on auth/server);
    // the loading indicator only appears when this device has no cache at all.
    render();
    (function wait() {
      if (!authReady()) { setTimeout(wait, 250); return; }
      if (!PL() || !user()) { render(); return; }
      PL().load(true).then(function (lists) {
        // repaint only when the server copy differs from what's on screen
        if (JSON.stringify(lists || []) !== paintedJson) render();
      }).catch(function () {
        if (paintedJson === null) root.innerHTML = '<p class="pl-note">Couldn’t load playlists — check your connection.</p>';
      });
    })();
  }
  window.addEventListener('thaiear:auth', function () { if (PL()) PL().load(true).then(render); });
  boot();
})();
</script>
<script src="nav.js" defer></script>
</body>
