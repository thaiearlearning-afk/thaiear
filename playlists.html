<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1A1A1A; --text-secondary: #5A5A5A; --text-tertiary: #9A9A9A;

  /* r128: matched to the index .panel-title / read .read-title spec (26px/500, 20px mobile) so the
     three switcher-panel titles are identical in font, size and colour (owner, 2026-08-02). */

  @media (max-width: 600px) { h1 { font-size: 20px; } }

     block, add-card, etc.) has MOVED to pl-list.js (injected once, id-guarded) as part of the
     native-panel refactor — it is now shared with whichever host page mounts the list module.
     What stays here is the base reset/vars/body and .wrap/.eyebrow/h1, which the ?pl= PLAYER
     view's own wrap (#pl-player-wrap) also needs. */

<body>

<div id="site-nav-root" style="min-height:54px;background:var(--surface);border-bottom:0.5px solid var(--border)"></div>

<div class="wrap" id="pl-list-wrap">
  <h1>Playlists</h1>
  <!-- Brought across from index.html's playlists panel, where it was the only subtitle this
       surface ever had (r137 — the panel shipped with no heading at all). .panel-sub is
       declared in index.html, which this page does not load, so its values are inlined:
       11px/500, 0.08em, uppercase, var(--accent). -->
  <div style="font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);margin:6px 0 16px">Learn Thai by Your Ear</div>
  <!-- r130 — the rest of the list experience (lede, meditator caption, layout-B add-card, download
       batch bar, playlist boxes) is now rendered BY pl-list.js's mount() into this container, so the
       exact same module can mount natively into the index Playlists panel. See pl-list.js. -->
  <div id="pl-list-root"></div>
</div>

<!-- Player view (?pl={id}): the playlist rendered AS a dyn topic page — player.js itself,
     injected by the bootstrap below once window.ThaiEarTopic is built from the playlist. -->
<div class="wrap" id="pl-player-wrap" hidden>
  <div class="eyebrow">Playlist</div>
  <h1 id="pl-player-title">Loading…</h1>
  <p style="font-size:12.5px;margin:-2px 0 16px"><a href="playlists" style="color:var(--accent);text-decoration:none;font-weight:500">← All playlists</a></p>
  <div id="player-root"></div>
</div>

<script src="dl-core.js"></script>
<script src="pl-list.js"></script>
<script>
(function () {
  // ?pl={id} → PLAYER VIEW: render this playlist as a dyn topic page via player.js (round-10).
  var PLID = (function () {
    var m = /[?&]pl=([^&]+)/.exec(location.search);
    if (!m) return null;
    try { return decodeURIComponent(m[1]); } catch (_) { return null; }
  })();
  /* Bare playlists.html (no ?pl= player view, no ?embed=1 panel) is not a user-facing destination —
     the index Playlists panel (now a NATIVE part of the index document, r130 — no more iframe) is
     the ONLY entry point. Redirect immediately, before any of the page's own setup runs. ?pl= is
     left alone (the player is still its own top-level page); ?embed=1 is left alone too, purely so
     an old cached copy of the index still iframing this page during the cache-transition window
     keeps working. */
  /* The bare-visit redirect to index.html#playlists is GONE (2026-08-21). It existed because
     the list only ever rendered inside the index switcher panel; with that panel retired this
     page is the destination, so a direct visit must render the list. `PLID` still selects the
     player view below. */

  /* r130 — LIST VIEW: the entire list experience (markup, CSS, download machinery, modals,
     create/rename/delete/remove-sentences flows) now lives in pl-list.js, shared with the index
     panel. This page just mounts it into its own #pl-list-root — see the Page step in CLAUDE.md
     and pl-list.js's own header comment for the full rationale. Kept here ONLY during the
     cache-transition window for the legacy ?embed=1 iframe. */
  if (!PLID) {
    var listRoot = document.getElementById('pl-list-root');
    if (listRoot && window.ThaiEarPlList) window.ThaiEarPlList.mount(listRoot);
    return;
  }

  /* ── Everything below is the ?pl={id} PLAYER view — untouched by the r130 extraction. It needs
     its own small copies of PL()/user()/authReady()/currentLists(): the list module's copies are
     private to its own closure, and per the r130 brief this view's code is not to be touched. ── */
  function PL() { return window.ThaiEarAuth && window.ThaiEarAuth.playlists; }
  function user() { return window.ThaiEarAuth && window.ThaiEarAuth.getUser && window.ThaiEarAuth.getUser(); }
  function authReady() { return !!(window.ThaiEarAuth && window.ThaiEarAuth.isReady); }
  // Cache-first data source: the loaded server copy, else the localStorage copy — the latter
  // is readable even before auth/the Supabase client resolve.
  function currentLists() {
    var pl = PL();
    var lists = pl && pl.get ? pl.get() : null;
    if (!lists && pl && pl.peek) lists = pl.peek();
    if (!lists) { try { lists = JSON.parse(localStorage.getItem('thaiear_playlists') || 'null'); } catch (_) { lists = null; } }
    return lists || null;
  }

  /* ── Player view (?pl={id}): build window.ThaiEarTopic from the playlist, inject player.js ── */
  function findList(lists, id) {
    return (lists || []).filter(function (x) { return String(x.id) === String(id); })[0] || null;
  }
  function launchPlayer(p, lists) {
    document.title = p.name + ' — ThaiEar';
    document.getElementById('pl-player-title').textContent = p.name;
    var nonEmpty = (lists || []).filter(function (x) { return x.items && x.items.length; });
    // Round-11: the CHAIN — every non-empty playlist, in order, circular. Transport/lock
    // prev/next walks this in place; it never navigates.
    var chain = nonEmpty.map(function (q) {
      return { page: 'playlists.html?pl=' + encodeURIComponent(q.id), prefix: '', tier: 'free', name: q.name, dynKey: 'pl-' + q.id };
    });
    window.ThaiEarTopic = {
      dyn: true,
      dynKey: 'pl-' + p.id,        // persistence namespace (sessions per playlist per mode)
      playlistMode: true,          // player.js: no flags, per-item prefixes (r140: progress card YES)
      audioPrefix: '',
      dynChain: chain,
      dynChainWrap: true,
      sentences: p.items.map(function (it, idx) {
        var t = String(it.thai || '').replace(/\s*\|\s*/g, ' ').trim();
        /* The pill hint comes from sentence-hints.json — the SAME authored hint the topic page
           shows, in both languages (2026-08-18). It used to be derived here as the first 4 words
           of the saved Thai, hard-cut at 20 characters, which differed from the topic page on
           2,265 of 2,271 sentences and truncated mid-word (ยินดีที่ได้รู้จักครั). `playlist_items`
           has no hint column, so the lookup is what avoids a database migration; it is keyed by
           the global sentence number, which is what `it.num` holds.
           If the lookup is unavailable (fetch failed, or a sentence since removed from the
           corpus) we fall back to the old derivation, so a pill is never empty. An absent English
           hint simply leaves the Thai showing in both directions — see .pv-only in player.js. */
        var hint = (HINTS && HINTS[it.num]) || null;
        var pv = hint && hint[0];
        if (!pv) {
          pv = t.split(/\s+/).slice(0, 4).join(' ');
          if (pv.length > 20) pv = pv.slice(0, 20);
        }
        return {
          num: 100001 + idx,       // synthetic page-unique id (nums can repeat across topics)
          clipNum: it.num,         // the REAL spreadsheet num — drives the audio filenames
          display: idx + 1,
          preview: pv,
          previewEn: (hint && hint[1]) || '',
          thai: it.thai,
          translit: it.translit || null,
          english: it.english,
          /* r145 — the notes come from the item's own nugget (auth.js/playlists_schema.sql). They
             used to be hardcoded empty here, so a playlist card's third reveal stage had nothing
             to show and the player cycled straight back to closed. An item added before the notes
             columns existed (or one whose sentence genuinely has no chips) still falls back to
             empty, and cycle() skips the empty stage for exactly those — see player.js. */
          gloss: Array.isArray(it.gloss) ? it.gloss : [],
          cultural: it.cultural || '',
          prefix: it.prefix,       // per-sentence audio prefix/tier (a playlist mixes topics)
          tier: it.tier || 'free'
        };
      })
    };
    var s = document.createElement('script');
    s.src = 'player.js';
    document.body.appendChild(s);
  }
  /* sentence-hints.json — the authored pill hints, {num: [thai, english]}, generated by
     gen_sentence_hints.js from the topic pages themselves and precached by sw.js so it resolves
     offline. Loaded ONCE before the player launches, because the hints are baked into
     window.ThaiEarTopic at launch time.
     The wait is BOUNDED (see OFFLINE_PLAYLISTS_PLAN.md: an unbounded await on a WebView fetch
     hangs rather than failing, and hanging the playlist behind a cosmetic lookup would be a far
     worse bug than a pill falling back to its old derivation). Never rejects. */
  var HINTS = null;
  function loadHints() {
    return new Promise(function (resolve) {
      var done = false, finish = function () { if (!done) { done = true; resolve(); } };
      setTimeout(finish, 1500);
      fetch('sentence-hints.json')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { if (j) HINTS = j; })
        .catch(function () {})
        .then(finish);
    });
  }

  function bootPlayer() {
    document.getElementById('pl-list-wrap').hidden = true;
    document.getElementById('pl-player-wrap').hidden = false;
    var cached = currentLists();
    var p = findList(cached, PLID);
    if (p && p.items && p.items.length) { launchPlayer(p, cached); return; }
    // no usable cache → wait for auth + a real load, then launch (player.js injects after cfg)
    (function wait() {
      if (!authReady()) { setTimeout(wait, 250); return; }
      // r130: bare playlists.html is no longer a destination — send failures straight to the panel.
      if (!PL() || !user()) { location.href = 'playlists'; return; }
      PL().load(true).then(function (lists) {
        var p2 = findList(lists, PLID);
        if (!p2 || !p2.items || !p2.items.length) { location.href = 'playlists'; return; }
        launchPlayer(p2, lists);
      }).catch(function () {
        document.getElementById('pl-player-title').textContent = 'Couldn’t load this playlist — check your connection.';
      });
    })();
  }
  loadHints().then(bootPlayer);
})();
</script>
