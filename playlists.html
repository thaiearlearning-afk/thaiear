<script>

  if (!ok && /[?&]k=cu38961y(&|$)/.test(location.search)) ok = true;

})();

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1A1A1A; --text-secondary: #5A5A5A; --text-tertiary: #9A9A9A;
    --accent: #4B41AD; --accent-light: #EEEDFE; --accent-mid: #534AB7;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font-ui: 'Inter', system-ui, sans-serif; --font-thai: 'Sarabun', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
  .lede { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 1.4rem; }
</style>

<body>

<div id="site-nav-root" style="min-height:54px;background:var(--surface);border-bottom:0.5px solid var(--border)"></div>

<div class="wrap">
  <div class="eyebrow">Owner test build</div>
  <h1>My Playlists</h1>
  <p class="lede">Build custom sessions from any sentences you've added with the ♪ button. Expand a playlist to play it — the session file is constructed on your device, exactly like a topic.</p>
  <button class="pl-add" id="pl-add" type="button">＋ Add playlist</button>
  <div id="pl-root"><p class="pl-note">Loading…</p></div>
</div>

<script>window.ThaiEarTopic = { test: true };</script>
<script src="player-dyn.js"></script>
<script>
(function () {
  var root = document.getElementById('pl-root');
  var openId = null;
  var instances = {};

  function PL() { return window.ThaiEarAuth && window.ThaiEarAuth.playlists; }
  function user() { return window.ThaiEarAuth && window.ThaiEarAuth.getUser && window.ThaiEarAuth.getUser(); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  // ── plsel: "Add sentences" topic-selection view ──
  // Test space = the two test topics (hardcoded; mirrors topics.js order).
  var TOPICS = [
    { page: 'topic-test.html', dynKey: 'topic-03', name: 'Communication survival', prefix: 'CommSurvival_BEG', tier: 'free', total: 25 },
    { page: 'topic-test2.html', dynKey: 'topic-11a', name: 'Shopping & money 1', prefix: 'ShoppingAndMoney_BEG', tier: 'member', total: 22 }
  ];
  var plselView = null;   // { id, name } while the topic-selection view is open
  (function () {          // topic pages reopen this view via playlists.html?plsel=…&pln=…
    var m = /[?&]plsel=([^&]+)/.exec(location.search);
    if (!m) return;
    var n = /[?&]pln=([^&]*)/.exec(location.search);
    try { plselView = { id: decodeURIComponent(m[1]), name: n ? decodeURIComponent(n[1]) : '' }; } catch (_) {}
  })();
  function pendRead() {
    try { var p = JSON.parse(sessionStorage.getItem('te_plsel') || 'null'); if (p && p.id && p.adds && p.removes) return p; } catch (_) {}
    return null;
  }
  function pendClear() { try { sessionStorage.removeItem('te_plsel'); } catch (_) {} }
  function exitPlselView() {
    plselView = null;
    try { history.replaceState(null, '', 'playlists.html'); } catch (_) {}
    if (PL()) PL().load(true).then(render); else render();
  }
  function renderTopicSelect() {
    var lists = PL() ? (PL().get() || []) : [];
    var p = lists.filter(function (x) { return String(x.id) === String(plselView.id); })[0];
    if (!p) { pendClear(); exitPlselView(); return; }
    var name = p.name || plselView.name || 'Playlist';
    var pend = pendRead();
    if (pend && String(pend.id) !== String(plselView.id)) pend = null;
    var pendingOps = 0;
    if (pend) {
      for (var a in pend.adds) pendingOps += pend.adds[a].length;
      for (var r in pend.removes) pendingOps += pend.removes[r].length;
    }
    root.innerHTML =
      '<p class="pl-note" style="margin-bottom:0.9rem">Adding sentences to <strong>' + esc(name) + '</strong> — choose a topic:</p>' +
      TOPICS.map(function (t, i) {
        // "X of Y sentences added" = the playlist's items for this topic, adjusted by pending diffs
        var have = {};
        (p.items || []).forEach(function (it) { if (it.topic_key === t.dynKey) have[it.num] = true; });
        if (pend) {
          (pend.adds[t.dynKey] || []).forEach(function (it) { have[it.num] = true; });
          (pend.removes[t.dynKey] || []).forEach(function (num) { delete have[num]; });
        }
        var x = 0; for (var k in have) x++;
        return '<button class="pl-topic-card" type="button" data-i="' + i + '">' +
          '<span class="pl-topic-name">' + esc(t.name) + '</span>' +
          '<span class="pl-topic-meta">' + x + ' of ' + t.total + ' sentences added</span></button>';
      }).join('') +
      '<div class="pl-sel-actions">' +
        '<button class="pl-sel-btn primary" id="pl-sel-done" type="button">Done</button>' +
        '<button class="pl-sel-btn plain" id="pl-sel-cancel" type="button">Cancel</button>' +
      '</div>';
    root.querySelectorAll('.pl-topic-card').forEach(function (card) {
      card.addEventListener('click', function () {
        var t = TOPICS[+card.getAttribute('data-i')];
        location.href = t.page + '?plsel=' + encodeURIComponent(plselView.id) + '&pln=' + encodeURIComponent(name) + '&k=cu38961y';
      });
    });
    // Done here applies any diffs stashed by topic pages (they only exist when the owner came
    // BACK from a topic without pressing that page's Done) — otherwise it just leaves the view.
    document.getElementById('pl-sel-done').addEventListener('click', function () {
      var pend2 = pendRead();
      if (!pend2 || String(pend2.id) !== String(plselView.id)) { pendClear(); exitPlselView(); return; }
      var ops = [], tkk;
      for (tkk in pend2.adds) pend2.adds[tkk].forEach(function (pl) { ops.push({ add: pl }); });
      for (tkk in pend2.removes) {
        (function (tk2) { pend2.removes[tk2].forEach(function (num) { ops.push({ rmTk: tk2, rmNum: num }); }); })(tkk);
      }
      if (!ops.length) { pendClear(); exitPlselView(); return; }
      var btn = this;
      btn.disabled = true;
      var chain = Promise.resolve();
      ops.forEach(function (op, i) {
        chain = chain.then(function () {
          btn.textContent = 'Saving… ' + (i + 1) + ' of ' + ops.length;
          return op.add ? PL().addItem(pend2.id, op.add) : PL().removeItem(pend2.id, op.rmTk, op.rmNum);
        });
      });
      chain.then(function () { pendClear(); exitPlselView(); })
        .catch(function () { btn.disabled = false; btn.textContent = 'Done'; alert('Couldn’t save — check your connection.'); });
    });
    document.getElementById('pl-sel-cancel').addEventListener('click', function () {
      if (pendingOps && !window.confirm('Discard the ' + pendingOps + ' unsaved change' + (pendingOps === 1 ? '' : 's') + '?')) return;
      pendClear();
      exitPlselView();
    });
  }

  function render() {
    var lists = PL() ? (PL().get() || []) : [];
    if (!user()) {
      root.innerHTML = '<p class="pl-note">Sign in (via the Menu) to create and play playlists. Playlists are free for every account.</p>';
      return;
    }
    if (plselView) { renderTopicSelect(); return; }
    if (!lists.length) {
      root.innerHTML = '<p class="pl-note">No playlists yet. Tap <strong>＋ Add playlist</strong>, then use the ♪ button on any sentence to add it here.</p>';
      return;
    }
    root.innerHTML = lists.map(function (p) {
      return '<div class="pl-box' + (p.id === openId ? ' open' : '') + '" data-id="' + p.id + '">' +
        '<button class="pl-box-head" type="button">' +
          '<span class="pl-box-name">' + esc(p.name) + '</span>' +
          '<span class="pl-box-meta">' + p.items.length + ' sentence' + (p.items.length === 1 ? '' : 's') + '</span>' +
          '<span class="pl-box-chev" aria-hidden="true">⌄</span>' +
        '</button>' +
        '<div class="pl-box-body"><div class="pl-player dyn-wrap"></div>' +
          '<button class="pl-addsent" type="button">＋ Add sentences</button>' +
          '<button class="pl-del" type="button">Delete playlist</button>' +
        '</div></div>';
    }).join('');
    root.querySelectorAll('.pl-box').forEach(function (box) {
      var id = box.getAttribute('data-id');
      var p = lists.filter(function (x) { return x.id === id; })[0];
      box.querySelector('.pl-box-head').addEventListener('click', function () {
        openId = (openId === id) ? null : id;
        render();
      });
      box.querySelector('.pl-addsent').addEventListener('click', function () {
        // Open the topic-selection view for this playlist. Pending diffs from a DIFFERENT
        // playlist's abandoned run are cleared; same-playlist pendings are kept (resume).
        var pend = pendRead();
        if (!pend || String(pend.id) !== String(id)) pendClear();
        plselView = { id: id, name: p.name };
        render();
      });
      box.querySelector('.pl-del').addEventListener('click', function () {
        if (!window.confirm('Delete "' + p.name + '"? This can’t be undone — the sentences themselves are not affected.')) return;
        PL().remove(id).then(function () { if (openId === id) openId = null; render(); })
          .catch(function () { alert('Couldn’t delete — check your connection.'); });
      });
      if (p.id === openId) mountPlayer(box, p, lists);
    });
  }

  function mountPlayer(box, p, lists) {
    var mountEl = box.querySelector('.pl-player');
    if (!p.items.length) {
      mountEl.innerHTML = '<p class="pl-note">This playlist is empty — use the ♪ button on any sentence (in the test topics) to add it.</p>';
      return;
    }
    var idx = lists.indexOf(p);
    // Circular wrap (owner round-6): prev of the first = the last, next of the last = the
    // first — no dead lock-screen buttons. A single playlist keeps the buttons hidden.
    var wrap = lists.length > 1;
    var prev = idx > 0 ? lists[idx - 1] : (wrap ? lists[lists.length - 1] : null);
    var next = idx < lists.length - 1 ? lists[idx + 1] : (wrap ? lists[0] : null);
    instances[p.id] = ThaiEarDyn.create(mountEl, {
      name: p.name,
      topicKey: 'playlist',
      prefix: '',
      tier: 'free',
      sentences: p.items.map(function (i) {
        return { num: i.num, thai: i.thai, translit: i.translit, english: i.english, prefix: i.prefix, tier: i.tier, topic_key: i.topic_key };
      }),
      features: { removeItem: true },
      onRemoveItem: function (s) {
        if (!window.confirm('Remove this sentence from "' + p.name + '"?')) return;
        PL().removeItem(p.id, s.topic_key, s.num).then(function () { render(); })
          .catch(function () { alert('Couldn’t remove — check your connection.'); });
      },
      nav: {
        // If audio was playing (incl. lock-screen ⏮/⏭ in the app), keep it playing on the
        // adjacent playlist — expand-only reads as a dead button from the lock screen.
        onPrev: prev ? function () {
          var was = instances[p.id] && instances[p.id].isPlaying();
          openId = prev.id; render();
          if (was && instances[prev.id]) instances[prev.id].play();
        } : null,
        onNext: next ? function () {
          var was = instances[p.id] && instances[p.id].isPlaying();
          openId = next.id; render();
          if (was && instances[next.id]) instances[next.id].play();
        } : null
      }
    });
  }

  document.getElementById('pl-add').addEventListener('click', function () {
    if (!user()) { alert('Sign in first (via the Menu) to create playlists.'); return; }
    var name = prompt('Playlist name:');
    if (!name || !name.trim()) return;
    PL().create(name.trim().slice(0, 60)).then(function (p) { openId = p.id; render(); })
      .catch(function (e) {
        var msg = (e && (e.message || e.details || e.hint)) || JSON.stringify(e);
        alert('Couldn’t create the playlist.\n\nError: ' + msg + '\n\nIf it says the relation does not exist, playlists_schema.sql was likely run in the wrong Supabase project — check the project ref is pyfyyiegmxwmfshgwvze.');
      });
  });

  function boot() {
    if (window.ThaiEarAuth && window.ThaiEarAuth.isReady) {
      if (PL()) PL().load().then(render); else render();
    } else {
      setTimeout(boot, 250);
    }
  }
  window.addEventListener('thaiear:auth', function () { if (PL()) PL().load(true).then(render); });
  boot();
})();
</script>
<script src="nav.js" defer></script>
</body>
