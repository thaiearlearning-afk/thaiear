<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1A1A1A; --text-secondary: #5A5A5A; --text-tertiary: #9A9A9A;
    --accent: #4B41AD; --accent-light: #EEEDFE; --accent-mid: #534AB7;
    --gold: #F0CC5C; --gold-dark: #C8A030; --purple-mid: #7F77DD;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font-ui: 'Inter', system-ui, sans-serif; --font-thai: 'Sarabun', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
  .page-wrap { max-width: 560px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
  .acct-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .acct-title { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 1.5rem; line-height: 1.2; }
  .acct-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem 1.4rem; }
  .acct-card p { color: var(--text-secondary); margin-bottom: 1rem; }
  .acct-card .email { color: var(--text-primary); font-weight: 500; }
  .acct-muted { font-size: 13px; color: var(--text-tertiary); }
  .btn { font-family: var(--font-ui); font-size: 14px; font-weight: 500; border-radius: var(--radius-sm); padding: 9px 18px; cursor: pointer; border: 0.5px solid var(--border-strong); transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-mid); }
  .btn-ghost { background: var(--surface); color: var(--text-secondary); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: #B00020; color: #fff; border-color: #B00020; }
  .btn-danger:hover { background: #8a0019; }
  /* Premium gold call-to-action — matches the premium padlock/scheme. */
  .btn-gold { background: var(--gold); color: #4a3a00; border-color: var(--gold-dark); font-weight: 600; }
  .btn-gold:hover { background: var(--gold-dark); color: #fff; border-color: var(--gold-dark); }
  /* Membership action buttons — flex row so they align and wrap cleanly. */
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  /* ── sign-in ── */
  .login-box { max-width: 340px; margin: 0 auto; text-align: center; }
  .login-btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; padding: 11px 18px; }
  .login-sep { display: flex; align-items: center; gap: 12px; margin: 1.1rem 0; color: var(--text-tertiary); font-size: 12px; }
  .login-sep::before, .login-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .login-input { width: 100%; text-align: left; font-family: var(--font-ui); font-size: 14px; padding: 10px 12px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); margin-bottom: 0.7rem; }
  .login-input:focus { outline: none; border-color: var(--accent); }
  .login-terms { font-size: 12px; margin-top: 1rem; }
  @keyframes tick-pop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .tick-anim { display: inline-block; color: var(--accent); font-weight: 700; animation: tick-pop 0.45s cubic-bezier(0.2,0.8,0.3,1.3) both; }
  /* ── modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,16,48,0.45); display: flex; align-items: center; justify-content: center; padding: 1.25rem; z-index: 1000; }
  .modal-card { background: var(--surface); border-radius: var(--radius-lg); max-width: 400px; width: 100%; padding: 1.5rem 1.5rem 1.35rem; box-shadow: 0 12px 40px rgba(0,0,0,0.2); }
  .modal-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 0.5rem; }
  .modal-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 1rem; line-height: 1.55; }
  .modal-card input { width: 100%; font-family: var(--font-ui); font-size: 14px; padding: 9px 11px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); margin-bottom: 1rem; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  @media (max-width: 600px) {
    .page-wrap { padding: 2rem 1rem 3rem; }
    .acct-title { font-size: 22px; }
    /* Stack the membership buttons full-width so they stay aligned in the
       narrower space instead of squishing side by side. */
    .btn-row .btn { width: 100%; }
  }
</style>
</head>
<body>

<div id="site-nav-root" style="min-height:54px;background:var(--surface);border-bottom:0.5px solid var(--border)"></div>

<div class="page-wrap">
  <div class="acct-eyebrow">ThaiEar</div>
  <h1 class="acct-title">Your account</h1>
  <div class="acct-card" id="account-body"><p class="acct-muted">Loading…</p></div>
</div>

<script>
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function openPortal() {
  if (offlineGuard('portal-status', 'You’re offline — reconnect to manage payment.')) return;
  var a = window.ThaiEarAuth;
  var token = a && a.getAccessToken && a.getAccessToken();
  if (!token) return;
  var el = document.getElementById('portal-status');
  if (el) el.textContent = 'Opening…';
  fetch('/api/portal', { method: 'POST', headers: { Authorization: 'Bearer ' + token } })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j && j.url) window.location.href = j.url;
      else if (el) el.textContent = 'Could not open the billing portal. Please try again.';
    })
    .catch(function () { if (el) el.textContent = 'Could not open the billing portal. Please try again.'; });
}
// On-brand confirmation modal (replaces the gray browser popups).
// opts: { title, body(html), confirmText, cancelText, danger, requireText, onConfirm }
function showModal(opts) {
  var ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML =
    '<div class="modal-card" role="dialog" aria-modal="true">' +
      '<h2>' + esc(opts.title) + '</h2>' +
      '<p>' + (opts.body || '') + '</p>' +
      (opts.requireText ? '<input id="modal-input" autocomplete="off" placeholder="Type ' + esc(opts.requireText) + '">' : '') +
      '<div class="modal-actions">' +
        '<button class="btn btn-ghost" id="modal-cancel">' + esc(opts.cancelText || 'Cancel') + '</button>' +
        '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" id="modal-ok">' + esc(opts.confirmText || 'Confirm') + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
  function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); }
  ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
  ov.querySelector('#modal-cancel').addEventListener('click', close);
  var inp = ov.querySelector('#modal-input');
  if (inp) inp.focus();
  ov.querySelector('#modal-ok').addEventListener('click', function () {
    if (opts.requireText) {
      if ((inp.value || '').trim().toUpperCase() !== opts.requireText.toUpperCase()) { inp.style.borderColor = '#B00020'; inp.focus(); return; }
    }
    close();
    opts.onConfirm();
  });
}
function deleteAccount() {
  if (!navigator.onLine) {
    var st = document.getElementById('delete-status');
    if (st) { st.style.color = '#B00020'; st.textContent = 'You’re offline — reconnect to delete your account.'; }
    return;
  }
  showModal({
    title: 'Delete your account?',
    body: 'This cancels any membership immediately and permanently erases your data. It cannot be undone.',
    requireText: 'DELETE', confirmText: 'Delete account', cancelText: 'Keep account', danger: true,
    onConfirm: doDeleteAccount,
  });
}
function doDeleteAccount() {
  var a = window.ThaiEarAuth;
  var token = a && a.getAccessToken && a.getAccessToken();
  if (!token) return;
  var st = document.getElementById('delete-status');
  if (st) st.textContent = 'Deleting your account…';
  fetch('/api/delete-account', { method: 'POST', headers: { Authorization: 'Bearer ' + token } })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var j = {}; try { j = JSON.parse(t); } catch (_) {}
      if (j && j.ok) {
        if (st) st.textContent = 'Account deleted. Signing you out…';
        var go = function () { window.location.replace('deleted.html'); };
        setTimeout(go, 2500); // fallback if signOut hangs
        Promise.resolve(a.signOut()).catch(function () {}).then(go); // wait for the session to clear
        return;
      }
      if (j && j.error === 'forbidden') { Promise.resolve(a.signOut()).catch(function () {}); if (st) st.textContent = 'Your session expired — please sign in again, then retry.'; return; }
      if (st) st.textContent = 'Error: ' + (j.detail || j.error || t || 'unknown');
    })
    .catch(function (e) { if (st) st.textContent = 'Error: ' + e; });
}
// Shared offline guard for the network-only membership actions. navigator.onLine can lie in the
// webview, but when it's accurate this cleanly blocks the action with a message instead of failing.
function offlineGuard(statusId, msg) {
  if (navigator.onLine) return false;
  var st = document.getElementById(statusId);
  if (st) { st.style.color = '#B00020'; st.textContent = msg || 'You’re offline — reconnect to do this.'; }
  return true;
}
function cancelMembership() {
  if (offlineGuard('cancel-status', 'You’re offline — reconnect to change your membership.')) return;
  showModal({
    title: 'Cancel membership?',
    body: 'You’ll keep access until the end of the current paid period — after that it won’t renew.',
    confirmText: 'Cancel membership', cancelText: 'Keep membership', danger: true,
    onConfirm: function () { postCancel(false); },
  });
}
function resumeMembership() {
  if (offlineGuard('cancel-status', 'You’re offline — reconnect to change your membership.')) return;
  showModal({
    title: 'Resume membership?',
    body: 'It will keep renewing at your current rate on your current card. You can cancel again anytime before then.',
    confirmText: 'Resume', cancelText: 'Not now',
    onConfirm: function () { postCancel(true); },
  });
}
function postCancel(resume) {
  var a = window.ThaiEarAuth;
  var token = a && a.getAccessToken && a.getAccessToken();
  if (!token) return;
  var st = document.getElementById('cancel-status');
  if (st) st.textContent = resume ? 'Resuming…' : 'Cancelling…';
  fetch('/api/cancel', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ resume: !!resume }),
  })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var j = {}; try { j = JSON.parse(t); } catch (_) {}
      if (j && j.ok) { if (st) st.textContent = 'Done. Updating…'; setTimeout(loadMembership, 900); }
      else if (st) { st.textContent = 'Error: ' + (j.detail || j.error || t || 'unknown'); }
    })
    .catch(function (e) { if (st) st.textContent = 'Error: ' + e; });
}
// Render the membership box from a subscription-state object. Shared by the instant
// cache render and the Stripe refine, so both paths produce identical markup.
function renderMembershipBox(s) {
  var box = document.getElementById('membership');
  if (!box) return;
  // In the app, hide every payment/management CTA (Google Play reader-app rule: no in-app purchase or
  // steering to web payment). Subscribers manage their membership (cancel / update card / resume) on
  // the WEBSITE; the app just shows a neutral pointer box. Web keeps the full controls.
  var native = !!(window.ThaiEarAuth && window.ThaiEarAuth.isNative && window.ThaiEarAuth.isNative());
  var manageBox = '<div style="margin-top:1rem;padding:0.85rem 1rem;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-md);font-size:13.5px;color:var(--text-secondary);line-height:1.5">To manage your premium membership, visit <strong style="color:var(--text-primary);font-weight:500">thaiear.com</strong> in your web browser.</div>';
  {
      if (s && s.subscribed) {
        var endStr = '';
        if (s.current_period_end) { try { endStr = new Date(s.current_period_end).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (_) {} }
        var line = s.cancel_at_period_end
          ? 'Membership: <strong style="color:#B29234">Premium</strong> — active until ' + endStr + ', won’t renew'
          : 'Membership: <strong style="color:#B29234">Premium</strong> (active)';
        // App → neutral "manage on the website" box (no in-app cancel/update/resume).
        // Web → full controls: cancelling offers Resume; active offers Cancel + Update payment method.
        var action = native
          ? manageBox
          : (s.cancel_at_period_end
              ? '<div class="btn-row"><button class="btn btn-gold" onclick="resumeMembership()">Resume membership</button></div>'
              : '<div class="btn-row"><button class="btn btn-ghost" onclick="cancelMembership()">Cancel membership</button>' +
                '<button class="btn btn-ghost" onclick="openPortal()">Update payment method</button></div>');
        box.innerHTML = '<p class="acct-muted" style="margin-top:1rem">' + line + '</p>' +
          action +
          '<p id="cancel-status" class="acct-muted" style="margin-top:8px;min-height:1em"></p>' +
          '<span id="portal-status" class="acct-muted"></span>';
      } else if (s && s.needsPayment) {
        box.innerHTML = '<p class="acct-muted" style="margin-top:1rem">Membership: <strong style="color:#B00020">Payment problem</strong> — your last payment didn’t go through.</p>' +
          '<p class="acct-muted" style="font-size:13px;margin-bottom:0.6rem">Update your card to keep your membership — access resumes automatically once it clears. No need to sign up again.</p>' +
          (native
            ? manageBox
            : '<button class="btn btn-primary" onclick="openPortal()">Update payment method</button>' +
              '<span id="portal-status" class="acct-muted" style="margin-left:10px"></span>');
      } else {
        box.innerHTML = '<p class="acct-muted" style="margin-top:1rem">Membership: <strong>Free member</strong></p>' +
          (native ? '' : '<a class="btn btn-gold" href="subscribe.html" style="display:inline-block;text-decoration:none">Upgrade to Premium</a>');
      }
  }
}
// Build a membership-state object from the cached Supabase subscription (instant).
function persistMembership(s) {
  try {
    var u = window.ThaiEarAuth && window.ThaiEarAuth.getUser && window.ThaiEarAuth.getUser();
    if (u && s) localStorage.setItem('thaiear_membership', JSON.stringify({ uid: u.id, s: s }));
  } catch (_) {}
}
function cacheSub() {
  var a = window.ThaiEarAuth;
  var sub = (a && a.getSubscription && a.getSubscription()) || null;
  var subscribedNow = !!(a && a.isSubscribed && a.isSubscribed());
  if (sub || subscribedNow) {
    return {
      subscribed: subscribedNow,
      needsPayment: !!(sub && (sub.status === 'past_due' || sub.status === 'unpaid')),
      status: sub && sub.status,
      cancel_at_period_end: sub && sub.cancel_at_period_end,
      current_period_end: sub && sub.current_period_end
    };
  }
  // Offline / not yet loaded: return the last-known AUTHORITATIVE membership from a prior online visit
  // (persisted from /api/subscription) so a premium member still sees "Premium — active until …".
  try {
    var u = a && a.getUser && a.getUser();
    var c = JSON.parse(localStorage.getItem('thaiear_membership') || 'null');
    if (c && c.s && (!u || c.uid === u.id)) return c.s;
  } catch (_) {}
  return { subscribed: false };
}
function subSig() {
  var s = cacheSub();
  return s.subscribed + '|' + s.needsPayment + '|' + s.status + '|' + s.cancel_at_period_end + '|' + s.current_period_end;
}
// Refine the box with the authoritative Stripe state (no webhook lag), in place.
function loadMembership() {
  var a = window.ThaiEarAuth;
  var token = a && a.getAccessToken && a.getAccessToken();
  if (!document.getElementById('membership') || !token) return;
  var sim = '';
  try { var s2 = new URLSearchParams(location.search).get('simulate'); if (s2) sim = '?simulate=' + encodeURIComponent(s2); } catch (_) {}
  fetch('/api/subscription' + sim, { headers: { Authorization: 'Bearer ' + token } })
    .then(function (r) { return r.json(); })
    .then(function (s) { renderMembershipBox(s); persistMembership(s); })
    .catch(function () {
      var box = document.getElementById('membership');
      // keep the cached display if we already have one; only message if it's empty

// Maintenance: cancel ALL of the user's subscriptions across every Stripe customer

function cancelAll() {
  if (!confirm('Cancel ALL your subscriptions (across every Stripe customer) and reset? This cancels immediately.')) return;
  var a = window.ThaiEarAuth;
  var token = a && a.getAccessToken && a.getAccessToken();
  if (!token) return;
  var st = document.getElementById('reset-status');
  if (st) st.textContent = 'Cancelling everything…';
  fetch('/api/cancel-subscriptions', { method: 'POST', headers: { Authorization: 'Bearer ' + token } })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var j = {}; try { j = JSON.parse(t); } catch (_) {}
      if (j && j.ok) {
        if (st) st.textContent = 'Done — cancelled ' + j.canceled + ' subscription(s) across ' + j.customers + ' customer(s). Reloading…';
        setTimeout(function () { window.location.href = 'account.html'; }, 1600);
      } else if (st) {
        st.textContent = 'Error: ' + (j.detail || j.error || t || 'unknown');
      }
    })
    .catch(function (e) { if (st) st.textContent = 'Error: ' + e; });
}
function subscribeEmail() { setEmailConsent(true, 'sub-btn'); }
function unsubscribeEmail() { setEmailConsent(false, 'unsub-btn'); }
function setEmailConsent(optIn, btnId) {
  var st = document.getElementById('consent-status');
  var btn = document.getElementById(btnId);
  var a = window.ThaiEarAuth;
  if (!navigator.onLine) {
    if (st) { st.style.color = '#B00020'; st.textContent = 'You’re offline — reconnect to change this.'; }
    return;
  }
  if (!a || typeof a.setMarketingConsent !== 'function') {
    if (st) st.textContent = 'Please hard-refresh the page and try again.'; return;
  }
  if (btn) { btn.disabled = true; btn.textContent = optIn ? 'Subscribing…' : 'Unsubscribing…'; }
  if (st) { st.style.color = 'var(--text-tertiary)'; st.textContent = ''; }
  a.setMarketingConsent(optIn).then(function () {
    if (st) {
      st.style.color = 'var(--accent)';
      if (optIn) st.innerHTML = '<span class="tick-anim">✓</span> Subscribed — check your inbox for a welcome email.';
      else st.textContent = 'You’ve been unsubscribed.';
    }
    // brief confirmation, then swap just the consent block to the opposite action
    // (updateConsentArea, not renderAccount — so the membership box doesn't reload).
    setTimeout(updateConsentArea, 1300);
  }).catch(function (e) {
    if (st) { st.style.color = '#B00020'; st.textContent = 'Could not save: ' + ((e && e.message) || e); }
    if (btn) { btn.disabled = false; btn.textContent = optIn ? 'Subscribe to email updates' : 'Unsubscribe'; }
  });
}
function sendLoginLink() {
  var a = window.ThaiEarAuth;
  var input = document.getElementById('login-email-input');
  var status = document.getElementById('login-email-status');
  var btn = document.getElementById('login-link-btn');
  var email = ((input && input.value) || '').trim();
  function fail(msg) { if (status) { status.style.color = '#B00020'; status.textContent = msg; } }
  if (!email || email.indexOf('@') < 1 || email.indexOf('.') < 0) { fail('Please enter a valid email address.'); return; }
  if (!a || !a.sendMagicLink) { fail('Still loading — try again in a moment.'); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  if (status) { status.style.color = 'var(--text-tertiary)'; status.textContent = ''; }
  a.sendMagicLink(email).then(function (res) {
    if (res && res.error) throw res.error;
    if (status) { status.style.color = 'var(--accent)'; status.textContent = 'Check your inbox — we sent a sign-in link to ' + email + '.'; }
    if (btn) { btn.textContent = 'Link sent'; }
  }).catch(function (err) {
    fail('Couldn’t send a link: ' + ((err && err.message) || 'please try again.'));
    if (btn) { btn.disabled = false; btn.textContent = 'Email me a sign-in link'; }
  });
}
function consentSig() {
  var a = window.ThaiEarAuth;
  var known = !!(a && a.isMarketingConsentLoaded && a.isMarketingConsentLoaded());
  var consent = !!(a && a.getMarketingConsent && a.getMarketingConsent());
  return known + '|' + consent;
}
function consentInner() {
  var a = window.ThaiEarAuth;

  if (!(a && a.isMarketingConsentLoaded && a.isMarketingConsentLoaded())) return '';
  var consent = !!(a.getMarketingConsent && a.getMarketingConsent());
  return (consent
    ? '<p style="margin-bottom:0.7rem;font-size:14px;color:var(--text-secondary)"><span style="color:var(--accent);font-weight:700">✓</span> You’re subscribed to email updates — we’ll let you know when new topics go live.</p>' +
      '<button class="btn btn-ghost" id="unsub-btn" onclick="unsubscribeEmail()" style="font-size:13px">Unsubscribe</button>'
    : '<p style="margin-bottom:0.7rem;font-size:14px;color:var(--text-secondary)">Get an email when new topics go live. No spam, unsubscribe anytime.</p>' +
      '<button class="btn btn-primary" id="sub-btn" onclick="subscribeEmail()">Subscribe to email updates</button>'
  ) + '<p id="consent-status" class="acct-muted" style="margin-top:8px;min-height:1em"></p>';
}
var _acctRenderedUid = false, _acctConsentSig = null, _acctRenderedSubSig = null;
function updateConsentArea() {
  var area = document.getElementById('consent-area');
  if (!area) return;
  _acctConsentSig = consentSig();
  area.innerHTML = consentInner();
}
function renderAccount() {

    el.innerHTML =
      '<div class="login-box">' +
        '<p style="margin-bottom:1.2rem">Sign in or create your account to manage your membership and unlock premium topics.</p>' +
        '<button class="btn btn-primary login-btn" onclick="ThaiEarAuth.signInWithGoogle()">Continue with Google</button>' +
        '<div class="login-sep">or</div>' +
        '<input id="login-email-input" class="login-input" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">' +
        '<button class="btn btn-ghost login-btn" id="login-link-btn" onclick="sendLoginLink()">Email me a sign-in link</button>' +
        '<p class="acct-muted" style="margin-top:8px;font-size:12.5px;line-height:1.5">New here? No separate sign-up needed — just enter your email and we’ll create your account automatically. No password to remember.</p>' +
        '<p id="login-email-status" class="acct-muted" style="margin-top:8px;min-height:1em"></p>' +
        '<p class="acct-muted login-terms">By continuing you agree to our ' +
          '<a href="terms.html" style="color:var(--accent);text-decoration:none">Terms</a> and ' +
          '<a href="privacy.html" style="color:var(--accent);text-decoration:none">Privacy Policy</a>.</p>' +
      '</div>';
    return;
  }
  var consentHtml =
    '<div id="consent-area" style="margin-top:1.25rem;padding-top:1.25rem;border-top:0.5px solid var(--border);min-height:96px">' +
      consentInner() +
    '</div>';

  var doReset = false;
  try { doReset = !!new URLSearchParams(location.search).get('reset'); } catch (_) {}
  var resetHtml = doReset
    ? '<div style="margin-top:1.25rem;padding-top:1.25rem;border-top:0.5px solid var(--border)">' +
        '<button class="btn btn-ghost" onclick="cancelAll()" style="font-size:13px">Cancel ALL my subscriptions (reset)</button>' +
        '<p id="reset-status" class="acct-muted" style="margin-top:6px;min-height:1em"></p>' +
        '<pre id="reset-debug" style="margin-top:10px;font-size:11px;background:var(--bg);border:0.5px solid var(--border);border-radius:8px;padding:10px;overflow:auto;white-space:pre-wrap">Loading current Stripe state…</pre>' +
      '</div>'
    : '';
  el.innerHTML =
    '<p>Signed in as <span class="email">' + esc(user.email || user.username) + '</span></p>' +
    '<div id="membership" style="min-height:80px"></div>' +
    consentHtml +
    resetHtml +
    '<p style="margin-top:1.25rem"><button class="btn btn-ghost" onclick="ThaiEarAuth.signOut()">Log out</button></p>' +
    '<div style="margin-top:1.5rem;padding-top:1rem;border-top:0.5px solid var(--border)">' +
      '<button class="btn" onclick="deleteAccount()" style="font-size:12px;color:#B00020;background:none;border-color:rgba(176,0,32,0.35)">Delete my account</button>' +
      '<p id="delete-status" class="acct-muted" style="margin-top:6px;min-height:1em"></p>' +
    '</div>';
  renderMembershipBox(cacheSub()); // instant from the cached Supabase state
  _acctRenderedSubSig = subSig();
  loadMembership();                // then refine with the authoritative Stripe state
  if (doReset) loadResetDebug();
}
function loadResetDebug() {
  var a = window.ThaiEarAuth;
  var token = a && a.getAccessToken && a.getAccessToken();

  if (!pre || !token) return;
  fetch('/api/subscription?debug=1', { headers: { Authorization: 'Bearer ' + token } })
    .then(function (r) { return r.text(); })

    .catch(function (e) { if (pre) pre.textContent = 'debug error: ' + e; });

// auth.js (loaded by nav.js) fires this when the session resolves or changes
window.addEventListener('thaiear:auth', renderAccount);
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderAccount);
else renderAccount();
</script>
