     Reserved ONLY while the request is outstanding, then released — so a free member never carries

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #FFFFFF; --border: rgba(0,0,0,0.10); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1A1A1A; --text-secondary: #5A5A5A; --text-tertiary: #9A9A9A;
    --accent: #4B41AD; --accent-light: #EEEDFE; --accent-mid: #534AB7;
    --gold: #F0CC5C; --gold-dark: #C8A030; --purple-mid: #7F77DD;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font-ui: 'Inter', system-ui, sans-serif; --font-thai: 'Sarabun', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
  .page-wrap { max-width: 560px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
  .acct-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .acct-title { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 1.5rem; line-height: 1.2; }
  .acct-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem 1.4rem; }
  .acct-card p { color: var(--text-secondary); margin-bottom: 1rem; }
  .acct-card .email { color: var(--text-primary); font-weight: 500; overflow-wrap: anywhere; }
  .acct-muted { font-size: 13px; color: var(--text-tertiary); }
  .btn { font-family: var(--font-ui); font-size: 14px; font-weight: 500; border-radius: var(--radius-sm); padding: 9px 18px; cursor: pointer; border: 0.5px solid var(--border-strong); transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-mid); }
  .btn-ghost { background: var(--surface); color: var(--text-secondary); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: #B00020; color: #fff; border-color: #B00020; }
  .btn-danger:hover:not([disabled]) { background: #8a0019; }
  /* r96: a confirm guarded by a typed word stays DULLED until the word is exact, then lights up —
     the same behaviour as the two "Remove all downloads" dialogs. Previously this button looked
     fully armed from the moment the dialog opened and only turned the input's border red when you
     pressed it with the wrong text: the affordance said READY while the action was refused. */
  .btn[disabled] { opacity: .45; cursor: default; }
  /* Premium gold call-to-action — matches the premium padlock/scheme. */
  .btn-gold { background: var(--gold); color: #4a3a00; border-color: var(--gold-dark); font-weight: 600; }
  .btn-gold:hover { background: var(--gold-dark); color: #fff; border-color: var(--gold-dark); }
  /* Membership action buttons — flex row so they align and wrap cleanly. */
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }

  /* ── ONE BUTTON VOCABULARY (owner, 2026-08-22: "buttons in similar categories should look
     the same"). Four kinds, and the kind is the MEANING, not the place:
       .btn-primary      the one thing this block is for (Confirm, Subscribe)
       .btn-gold         spend money (Upgrade, Resume) — the premium palette
       .btn-ghost        reversible housekeeping (Change, Log out, Cancel membership)
       .btn-destructive  removes data and asks you to type a word first
     ⚠ .btn-destructive REPLACES A STYLE THAT WAS INLINED TWICE — "Remove all downloads" and
     "Delete my account" each carried their own copy of the same four declarations, which is
     how they drift. They are the same KIND of action and must keep reading as one. */
  /* ⚠ COLOUR ONLY — NO font-size HERE. It used to carry 12px, which made the two most
     dangerous buttons on the page the SMALLEST targets on it. Owner, 2026-08-22: "keep its
     red styling but change font size and box size to match the others." Being red is what
     marks it out; being small was never the signal, only an accident of how it was written. */
  .btn-destructive { color: #B00020; background: none; border-color: rgba(176,0,32,0.35); }
  .btn-destructive:hover:not([disabled]) { border-color: #B00020; background: rgba(176,0,32,0.05); }
  /* Full width — every action on this card is one of these now (owner, 2026-08-22: "this will
     all look much neater"). One width, one height, one type size; the only thing that varies
     between them is COLOUR, which is what tells you a destructive one apart. */
  .btn-wide { display: block; width: 100%; text-align: center; }

  /* ⚠ THE ACTIONS ARE A COLUMN WITH A GAP, NOT BUTTONS CARRYING THEIR OWN MARGINS. The old
     page spaced them with a margin-top typed at each call site, which is why the gaps were
     all slightly different and why "Update payment method" appeared to lose its bottom
     border: it sat in a wrapping flex ROW whose height came out fractional, and the 0.5px
     border landed on a half-device-pixel and was dropped by the compositor. A column of
     full-width blocks has no fractional row height to land on. */
  /* ⚠ THE THINGS THAT TAKE SOMETHING AWAY LIVE IN THEIR OWN CARD (owner, 2026-08-22). Not
     decoration: the gap between two cards is a stronger boundary than any gap inside one, and
     it is the boundary that matters here — everything above it is reversible, everything in
     here ends a membership or deletes data. A wider margin AND a separate ground say the same
     thing twice, which is what makes it read at a glance rather than needing to be read.
     :empty keeps it from drawing an empty box for a signed-out visitor, who has none of these
     actions. */
  .acct-danger { margin-top: 1.75rem; }
  #account-danger:empty { display: none; }

  .acct-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  /* In the danger card the stack IS the card, so it needs no top offset of its own. */
  .acct-danger .acct-stack { margin-top: 0; }
  .acct-stack .btn { margin: 0; }
  /* ⚠⚠ AN EMPTY STATUS PARAGRAPH IS STILL A FLEX ITEM, AND STILL TAKES A GAP. This is what
     made the spacing uneven (owner, 2026-08-22: "the spacing between them is uneven!!!!"):
     four of the buttons are followed by a status <p> that is empty almost always, so those
     four gaps were 20px while the rest were 10px. Zero height is not zero space in a gapped
     column — the ITEM has to go, not just its content. Every status line on this card is
     inside the stack, so one descendant rule covers all of them, and they reappear the
     instant they have text. */
  .acct-stack p:empty { display: none; }
  /* Membership's buttons are written into the stack by renderMembershipBox, which runs late.
     :empty keeps it from contributing a phantom 10px gap before it does. */
  #membership-actions { display: flex; flex-direction: column; gap: 10px; }
  #membership-actions:empty { display: none; }
  /* Same reason: the consent answer arrives from Supabase after first paint, and an empty
     wrapper in a gap:10px column is a visible 10px of nothing until it does. */
  #consent-area { display: flex; flex-direction: column; gap: 10px; }
  #consent-area:empty { display: none; }

  /* ⚠ THE TWO IDENTITY LINES MATCH, AND SIT TOGETHER. "Membership: Premium (active)" is the
     same KIND of statement as "Signed in as …" — a fact about the account, not an action —
     so it reads at the same size directly under it instead of heading a block of buttons
     halfway down (owner, 2026-08-22: "it's disrupting the flow of the buttons"). */
  /* ⚠ `.acct-card p` SETS margin-bottom: 1rem AND BEATS A BARE `.acct-line` ON SPECIFICITY
     (0,1,1 against 0,1,0). That is why the fact lines sat a whole rem apart while this rule
     claimed 0.35 — the rule never applied. Scoped to the card so it wins, and the spacing
     between the three lines is now the SAME number in one place. */
  .acct-card p.acct-line { color: var(--text-secondary); margin: 0 0 7px; }
  .acct-card p.acct-line:last-child { margin-bottom: 0; }
  .acct-lines { margin-bottom: 0; }

  /* The name is a FACT, so it lives with the other two fact lines; changing it is an ACTION,
     so that lives in the stack with the other actions. Splitting them that way is what let
     both halves become evenly spaced — as one row it had to be a special case in both. */
  .acct-line .val { font-weight: 600; color: var(--text-primary); }

  /* ⚠ 16px IS NOT A TYPE CHOICE, IT IS THE iOS ZOOM THRESHOLD. Safari auto-zooms the whole
     page when a focused input's text is under 16px, and there is no way to decline it short
     of meeting the threshold — a maximum-scale viewport would also stop the user pinching,
     which is a WCAG failure. The owner hit this on the iPhone PWA: tapping Change display
     name zoomed the page. Any input added to this page must be 16px for the same reason. */
  /* Typed as `input.no-zoom` on purpose: `.login-input` sets 14px and is a single class, so a
     single-class .no-zoom TIES with it and loses on source order — measured, the input came
     out at 14px and still zoomed. The element selector breaks the tie. */
  input.no-zoom { font-size: 16px; }

  /* ⚠ SECTION RHYTHM IS ONE RULE, NOT A MARGIN TYPED AT EACH CALL SITE. The blocks on this
     page had picked up 1.25rem/1.5rem tops and 1rem/1.25rem padding in whatever combination
     each was written in, which is why the gap between "Remove all downloads" and "Delete my
     account" was visibly bigger than every other gap (owner, 2026-08-22). Same rule, same
     gap, everywhere. */
  /* ⚠ RESERVE THE CARD BEFORE IT RENDERS, AND RESERVE THE RIGHT AMOUNT. The card is built in
     one pass once auth resolves, so until then it is a one-line "Loading…" — and everything
     after it jumped when the real content landed (owner, 2026-08-22: "elements popping up one
     by one and shifting everything").

     The trick is that ONE reserve cannot be right: the signed-in card is ~150px taller than
     the sign-in box, so a single figure either leaves a hole for signed-out visitors or fails
     to cover signed-in ones. It does not have to be one figure, because identity.js ALREADY
     KNOWS which it will be, synchronously, before first paint — the same durable identity the
     nav and the home greeting paint from. The head script below stamps the answer on the card
     and the right reserve applies from the first frame.

     ⚠ MEASURED, NOT GUESSED, AND RE-MEASURED AFTER THE 2026-08-22 RESTRUCTURE — which is
     exactly why the numbers are worth stating: the first set (656/632/609 signed in) went
     stale the moment the card became a button stack, and a stale reserve holds a gap open
     just as surely as no reserve lets a jump through. Re-measured after the even-spacing pass, and
     AGAIN after the danger card took three buttons out of this one — three times in three
     commits, which is the whole argument for writing them down rather than trusting them.
     Now: signed in 353 under 400px and 329 above; signed out 507 and 445, so the signed-in
     card is now much the SHORTER of the two. The signed-in figure covers the FREE card,
     which is the taller tier HERE: free shows "Upgrade to Premium" in this card, while
     premium's Cancel button has moved out to the danger card. Over-reserving costs a moment
     before render; under-reserving costs a jump.
     ⚠ The danger card needs NO reserve of its own — it is filled in the same synchronous
     pass as the body, so it has never not been there when the page paints. Re-measure whenever the copy
     or the button list changes.
     ⚠ AND IT IS min-height, SO AN UNDER-ESTIMATE STILL DEGRADES TO TODAY'S BEHAVIOUR rather
     than clipping anything. */
  #account-body.acct-wait-in  { min-height: 353px; }
  #account-body.acct-wait-out { min-height: 507px; }
  @media (min-width: 400px) {
    #account-body.acct-wait-in  { min-height: 329px; }
    #account-body.acct-wait-out { min-height: 445px; }
  }

  .acct-section { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 0.5px solid var(--border); }
  .acct-section h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }

  /* ── the mascot, exactly as app.html / socials.html / read.html do it ──────────────────
     ⚠ width + height ATTRIBUTES ON THE <img> AND aspect-ratio HERE, both. The attributes let
     the browser reserve the box before the bytes arrive; aspect-ratio keeps that reservation
     true when CSS resizes it. Ship one without the other and the mascot's arrival shoves the
     whole card down — which is the exact fault the reserves elsewhere on this page exist to
     stop. Sized off phi.png's real 480×532. */
  .acct-lede { color: var(--text-secondary); font-size: 14.5px; line-height: 1.6; margin: 0 0 0.5rem; }
  .fluency-block { text-align: center; margin: 1rem 0 1.5rem; }
  .fluency-img { width: 158px; max-width: 42%; height: auto; aspect-ratio: 480 / 532; display: block; margin: 0 auto 0.4rem; }
  .fluency-text { font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: 0.02em; }
  .fluency-text .dots { display: inline-block; width: 1.1em; text-align: left; }
  .fluency-text .dots::after {
    content: '...'; display: inline-block; width: 0; overflow: hidden;
    vertical-align: bottom; animation: fluency-dots 1.5s steps(3, start) infinite;
  }
  @keyframes fluency-dots { from { width: 0; } to { width: 1.05em; } }
  /* Motion is decoration here; someone who has asked the OS for less of it gets the dots
     without the animation rather than nothing. */
  @media (prefers-reduced-motion: reduce) {
    .fluency-text .dots::after { animation: none; width: 1.05em; }
  }
  /* ── sign-in ── */
  .login-box { max-width: 340px; margin: 0 auto; text-align: center; }
  .login-btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; padding: 11px 18px; }
  .login-sep { display: flex; align-items: center; gap: 12px; margin: 1.1rem 0; color: var(--text-tertiary); font-size: 12px; }
  .login-sep::before, .login-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .login-input { width: 100%; text-align: left; font-family: var(--font-ui); font-size: 14px; padding: 10px 12px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); margin-bottom: 0.7rem; }
  .login-input:focus { outline: none; border-color: var(--accent); }
  .login-terms { font-size: 12px; margin-top: 1rem; }
  @keyframes tick-pop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .tick-anim { display: inline-block; color: var(--accent); font-weight: 700; animation: tick-pop 0.45s cubic-bezier(0.2,0.8,0.3,1.3) both; }
  /* ── modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,16,48,0.45); display: flex; align-items: center; justify-content: center; padding: 1.25rem; z-index: 1000; }
  .modal-card { background: var(--surface); border-radius: var(--radius-lg); max-width: 400px; width: 100%; padding: 1.5rem 1.5rem 1.35rem; box-shadow: 0 12px 40px rgba(0,0,0,0.2); }
  .modal-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 0.5rem; }
  .modal-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 1rem; line-height: 1.55; }
  .modal-card input { width: 100%; font-family: var(--font-ui); font-size: 14px; padding: 9px 11px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); margin-bottom: 1rem; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  @media (max-width: 600px) {
    .page-wrap { padding: 2rem 1rem 3rem; }
    .acct-title { font-size: 22px; }
    /* .btn-row is only the modal's action row now; the account's own buttons are all
       .btn-wide in a column, at every width. */
    .btn-row .btn { width: 100%; }
  }
</style>
<!-- identity.js: who is this, synchronously, before Supabase answers. Must be a plain
     blocking script in the head — nav.js mounts before auth.js is even appended, so
     anything deferred is too late to stop the first frame painting the wrong state. ~1 KB,
     precached. -->
<script src="/identity.js"></script>

<body>

<div id="site-nav-root" style="min-height:54px;background:var(--surface);border-bottom:0.5px solid var(--border)"></div>

<div class="page-wrap">
  <div class="acct-eyebrow">ThaiEar</div>
  <h1 class="acct-title">Your account</h1>

<script>
function esc(s) {

    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

   PREFERRED break point after the @, so it splits as tobygeorgeralph@ / gmail.com instead of
   through the middle of a name. Applied AFTER esc() on purpose: it injects real markup, and @
   never appears inside an HTML entity, so escaping first is safe and order-independent.
   `.email { overflow-wrap: anywhere }` is the backstop when even that will not fit. */
function escEmail(s) { return esc(s).replace('@', '@<wbr>'); }

// On-brand confirmation modal (replaces the gray browser popups).

function showModal(opts) {

  ov.innerHTML =

      '<h2>' + esc(opts.title) + '</h2>' +
      '<p>' + (opts.body || '') + '</p>' +

      '<div class="modal-actions">' +

        '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" id="modal-ok">' + esc(opts.confirmText || 'Confirm') + '</button>' +

       1. it compared with .toUpperCase() on BOTH sides, so "delete", "Delete" — any casing — passed.
          Typing the word in caps IS the deliberate act; accepting any casing gives away the friction
          the guard exists to create. (A near-miss like "DELETES" was already refused, and still is.)
       2. the confirm button was ALWAYS pressable and merely reddened the input on a wrong entry, so
          it looked armed while the action was refused.

     `.value` stayed lowercase, refusing the user while looking correct to them. */

     action and disables itself when there is nothing to remove, which says "nothing stored"
     more economically than a sentence — and the count was the only thing on this card that
     needed re-rendering when a download finished. */
  var n = dlCount();
  return '<button class="btn btn-destructive btn-wide" id="offline-dl-btn" ' +
      'onclick="removeAllDownloads()"' + (n ? '' : ' disabled') +
      '>Remove all downloads</button>' +
    '<p id="offline-dl-status" class="acct-muted" style="margin:0;min-height:0"></p>';
}
/* The same call the index's batch bar made, including the typed-REMOVE modal — dl-core owns
   both, so the dialog a user sees is word for word the one they saw before. The cache name
   must match player.js's. */
function removeAllDownloads() {
  if (!dlAvailable()) return;
  var btn = document.getElementById('offline-dl-btn');
  var status = document.getElementById('offline-dl-status');
  window.ThaiEarDL.removeAllModal(dlCount(), function () {
    if (btn) btn.disabled = true;
    if (status) status.textContent = 'Removing all downloads…';
    window.ThaiEarDL.removeAllDownloads(window.ThaiEarDL.capabilities(), 'thaiear-audio-dl')
      .then(function () {
        var c = document.getElementById('offline-dl-count');
        if (c) c.textContent = 'Nothing downloaded on this device.';
        if (status) status.textContent = 'All downloads removed.';
      })
      .catch(function (e) {
        if (btn) btn.disabled = false;
        if (status) status.textContent = 'Could not remove everything: ' + (e && e.message ? e.message : e);
      });
  });
}

function loadResetDebug() {
  var a = window.ThaiEarAuth;
  var token = a && a.getAccessToken && a.getAccessToken();
  var pre = document.getElementById('reset-debug');
  if (!pre || !token) return;
  fetch('/api/subscription?debug=1', { headers: { Authorization: 'Bearer ' + token } })
    .then(function (r) { return r.text(); })
    .then(function (t) { if (pre) pre.textContent = t; })
    .catch(function (e) { if (pre) pre.textContent = 'debug error: ' + e; });
}
/* ══ DESKTOP DOWNLOAD ADMIN (2026-08-07) ══════════════════════════════════════════════════════
   Lets a trusted person enable the desktop MP3 download for someone else without going through
   the owner. Renders ONLY for accounts in desktop_dl_admins — and that is a convenience, not the
   permission: /api/desktop-dl re-checks the caller on every request, so this panel existing or
   not existing changes nothing about what the server will accept.

   ⚠ ADDING BY EMAIL WORKS BEFORE THE PERSON HAS AN ACCOUNT. That is why "granted" and "granted,
   no account yet" are different messages rather than one being an error — addresses are collected
   on paper, in person, and typed in later. The "no account yet" line is also the typo-catcher: it
   is what someone sees when they mistype an address, and the thing that catches a monk who signed
   in with a different Google address from the one they wrote down.

   ⚠ DOWNLOADS AND LIFETIME ARE TWO DIFFERENT GRANTS. Downloads decide whether a file may leave
   the browser; lifetime decides whether they pay. They are deliberately separate buttons with
   separate confirmations — someone who should get one does not automatically get the other. */
var _dlPanelBuilt = false;

function dlApi(method, body) {
  var a = window.ThaiEarAuth;
  var token = a && a.getAccessToken && a.getAccessToken();
  if (!token) return Promise.reject(new Error('not signed in'));
  return fetch('/api/desktop-dl', {
    method: method,
    headers: body
      ? { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }
      : { Authorization: 'Bearer ' + token },
    cache: 'no-store',
    body: body ? JSON.stringify(body) : undefined,
  }).then(function (r) { return r.json(); });
}

function renderDesktopDlAdmin() {
  var host = document.getElementById('desktop-dl-admin');
  var a = window.ThaiEarAuth;
  if (!host) return;
  if (!a || !a.isDesktopDlAdmin || !a.isDesktopDlAdmin()) {
    host.innerHTML = ''; _dlPanelBuilt = false; return;
  }
  // Build the chrome once. Rebuilding on every auth notify would wipe a half-typed address.
  if (_dlPanelBuilt) { dlLoadList(); return; }
  _dlPanelBuilt = true;
  host.innerHTML =
    '<div style="margin-top:1.5rem;padding-top:1.25rem;border-top:0.5px solid var(--border)">' +
      '<h2 style="font-size:16px;font-weight:600;margin-bottom:4px">Desktop downloads</h2>' +
      '<p class="acct-muted" style="margin-bottom:12px;line-height:1.55">Lets someone save the ' +
        'constructed Dynamic mp3 as a file on their computer. You can add an address before they ' +
        'have a ThaiEar account — access starts as soon as they sign up with it.</p>' +
      '<input id="dl-email" class="login-input" type="email" inputmode="email" autocomplete="off" ' +
        'placeholder="their@email.com" style="max-width:320px">' +
      '<input id="dl-note" class="login-input" type="text" autocomplete="off" ' +
        'placeholder="Note (optional) — e.g. Wat Suan Mokkh" style="max-width:320px;margin-top:8px">' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="dl-grant-btn">Enable downloads</button>' +
        '<button class="btn btn-gold" id="dl-life-btn">Grant lifetime membership</button>' +
      '</div>' +
      '<p id="dl-status" class="acct-muted" style="margin-top:10px;min-height:1.2em"></p>' +
      '<div id="dl-list" style="margin-top:14px"></div>' +
      '<details style="margin-top:12px">' +
        '<summary class="acct-muted" style="cursor:pointer">Recent activity</summary>' +
        '<div id="dl-audit" style="margin-top:8px"></div>' +
      '</details>' +
    '</div>';
  document.getElementById('dl-grant-btn').addEventListener('click', dlGrant);
  document.getElementById('dl-life-btn').addEventListener('click', dlLifetime);
  dlLoadList();
}

function dlSay(msg, kind) {
  var el = document.getElementById('dl-status');
  if (!el) return;
  el.textContent = msg;
  el.style.color = kind === 'bad' ? '#B00020' : (kind === 'good' ? '#2E7D52' : 'var(--text-tertiary)');
}

function dlGrant() {
  var em = (document.getElementById('dl-email').value || '').trim();
  var note = (document.getElementById('dl-note').value || '').trim();
  if (!em) { dlSay('Type an email address first.', 'bad'); return; }
  dlSay('Working…');
  dlApi('POST', { action: 'grant', email: em, note: note || null })
    .then(function (d) {
      // Four outcomes, four different sentences. A single "done" would hide the two that matter:
      // the address that has no account (possible typo) and the one already enabled (no-op).
      if (d.result === 'granted') dlSay('User found — downloads enabled for ' + em + '.', 'good');
      else if (d.result === 'granted_no_account') dlSay('Enabled for ' + em + ' — but there is no ThaiEar account with that address yet. Downloads will turn on automatically when they sign up. Check the spelling if that is unexpected.', 'good');
      else if (d.result === 'already') dlSay(em + ' already has desktop downloads enabled.');
      else if (d.result === 'bad_email') dlSay('That does not look like an email address.', 'bad');
      else dlSay('Could not enable downloads: ' + (d.error || d.result || 'unknown error'), 'bad');
      if (d.result === 'granted' || d.result === 'granted_no_account') {
        document.getElementById('dl-email').value = '';
        document.getElementById('dl-note').value = '';
      }
      dlLoadList();
      if (window.ThaiEarAuth.refreshDesktopDl) window.ThaiEarAuth.refreshDesktopDl();
    })
    .catch(function () { dlSay('Network error — nothing was changed. Try again.', 'bad'); });
}

function dlLifetime() {
  var em = (document.getElementById('dl-email').value || '').trim();
  if (!em) { dlSay('Type an email address first.', 'bad'); return; }
  showModal({
    title: 'Grant lifetime membership?',
    body: 'This gives <strong>' + esc(em) + '</strong> full premium access, free, with no end date. ' +
          'It is separate from desktop downloads and does not enable them.',
    confirmText: 'Grant lifetime',
    onConfirm: function () {
      dlSay('Working…');
      dlApi('POST', { action: 'grant_lifetime', email: em })
        .then(function (d) {
          // Unlike downloads, this one genuinely needs an account: it writes a subscription row
          // keyed by user id, and there is no user id to key it to until they have signed in once.
          if (d.result === 'lifetime_granted') dlSay('Lifetime membership granted to ' + em + '.', 'good');
          else if (d.result === 'already_lifetime') dlSay(em + ' already has lifetime membership — nothing was changed.');
          else if (d.result === 'no_account') dlSay('No ThaiEar account with that address yet. They need to sign in once first — then grant it.', 'bad');
          else if (d.result === 'bad_email') dlSay('That does not look like an email address.', 'bad');
          else dlSay('Could not grant lifetime: ' + (d.error || d.result || 'unknown error'), 'bad');
          dlLoadList();
        })
        .catch(function () { dlSay('Network error — nothing was changed. Try again.', 'bad'); });
    },
  });
}

function dlRevoke(em) {
  showModal({
    title: 'Turn off desktop downloads?',
    body: '<strong>' + esc(em) + '</strong> will no longer be able to save MP3 files to a computer. ' +
          'Files they have already downloaded stay on their computer — those cannot be taken back. ' +
          'Their ThaiEar membership is not affected.',
    confirmText: 'Turn off',
    danger: true,
    onConfirm: function () {
      dlSay('Working…');
      dlApi('POST', { action: 'revoke', email: em })
        .then(function (d) {
          dlSay(d.result === 'revoked' ? 'Downloads turned off for ' + em + '.' : 'Nothing to change for ' + em + '.');
          dlLoadList();
          if (window.ThaiEarAuth.refreshDesktopDl) window.ThaiEarAuth.refreshDesktopDl();
        })
        .catch(function () { dlSay('Network error — nothing was changed. Try again.', 'bad'); });
    },
  });
}

function dlLoadList() {
  dlApi('GET').then(function (d) {
    var wrap = document.getElementById('dl-list');
    if (!wrap) return;
    var rows = d.list || [];
    if (!rows.length) { wrap.innerHTML = '<p class="acct-muted">Nobody is enabled yet.</p>'; return; }
    var on = rows.filter(function (r) { return r.enabled; }).length;
    wrap.innerHTML =
      '<p class="acct-muted" style="margin-bottom:6px">' + on + ' enabled' +
        (rows.length > on ? ' · ' + (rows.length - on) + ' turned off' : '') + '</p>' +
      '<div style="display:flex;flex-direction:column;gap:6px">' +
      rows.map(function (r) {
        var when = r.added_at ? new Date(r.added_at).toLocaleDateString('en-GB',
          { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        return '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;' +
            'border:0.5px solid var(--border);border-radius:8px;background:' +
            (r.enabled ? 'var(--surface)' : 'transparent') + '">' +
            // overflow-wrap here as well as the <wbr>: this span is a FLEX ITEM, so allowing the
            // break also drops its min-content width and lets the row shrink instead of forcing
            // itself wide. Owner-only screen, same defect class as the signed-in-as line.
            '<span style="font-size:13.5px;overflow-wrap:anywhere;' + (r.enabled ? '' : 'text-decoration:line-through;opacity:.6') + '">' +
              escEmail(r.email) + '</span>' +
            (r.note ? '<span class="acct-muted">' + esc(r.note) + '</span>' : '') +
            '<span class="acct-muted" style="margin-left:auto;font-size:12px">' +
              (r.added_by_email ? 'by ' + esc(r.added_by_email) + ' · ' : '') + esc(when) + '</span>' +
            (r.enabled
              ? '<button class="btn btn-ghost" data-dl-off="' + esc(r.email) + '" style="font-size:12px;padding:5px 10px">Turn off</button>'
              : '<button class="btn btn-ghost" data-dl-on="' + esc(r.email) + '" style="font-size:12px;padding:5px 10px">Re-enable</button>') +
          '</div>';
      }).join('') + '</div>';
    wrap.querySelectorAll('[data-dl-off]').forEach(function (b) {
      b.addEventListener('click', function () { dlRevoke(b.getAttribute('data-dl-off')); });
    });
    wrap.querySelectorAll('[data-dl-on]').forEach(function (b) {
      b.addEventListener('click', function () {
        var em = b.getAttribute('data-dl-on');
        dlSay('Working…');
        dlApi('POST', { action: 'grant', email: em })
          .then(function () { dlSay('Downloads re-enabled for ' + em + '.', 'good'); dlLoadList(); })
          .catch(function () { dlSay('Network error — nothing was changed. Try again.', 'bad'); });
      });
    });

    var au = document.getElementById('dl-audit');
    if (au) {
      var log = d.audit || [];
      au.innerHTML = log.length
        ? '<div style="display:flex;flex-direction:column;gap:3px">' + log.map(function (x) {
            var t = x.at ? new Date(x.at).toLocaleString('en-GB',
              { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
            return '<div class="acct-muted" style="font-size:12px">' + esc(t) + ' — ' +
              esc(x.actor_email || '?') + ' ' + esc(String(x.action || '').replace(/_/g, ' ')) + ' ' +
              esc(x.target_email || '') + (x.detail ? ' <span style="opacity:.7">(' + esc(x.detail) + ')</span>' : '') +
              '</div>';
          }).join('') + '</div>'
        : '<p class="acct-muted">Nothing yet.</p>';
    }
  }).catch(function () {});
}

// auth.js (loaded by nav.js) fires this when the session resolves or changes
window.addEventListener('thaiear:auth', renderAccount);
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderAccount);
else renderAccount();
</script>
<!-- dl-core owns the download manifest and the typed-REMOVE modal; app-cta owns the ONE
     "can this device download?" predicate. Both are needed by the Offline downloads section
     above, and both are already in sw.js's PRECACHE. -->
<script src="dl-core.js"></script>
<script src="app-cta.js"></script>
<script src="consent.js" defer></script>
<script src="attrib.js" defer></script>
<script src="gtag.js" defer></script>
<script src="nav.js" defer></script>
</body>
