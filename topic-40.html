  { num: 1098, display: 1, preview: "ตัวอะไร", thai: "นั่นตัวอะไรเหรอครับ", english: "What animal is that?", gloss: [["นั่น", "that"], ["ตัว", "(creature)"], ["อะไร", "what"], ["เหรอ", "(question)"], ["ครับ", "polite(m)"]], cultural: "ตัวอะไร = 'what creature?' — ตัว, the everyday animal classifier, doubles as the noun 'creature' here." },
  { num: 1099, display: 2, preview: "ตุ๊กแก", thai: "นั่นน่าจะเป็นตุ๊กแก ร้องเสียงดังเลย", english: "That's probably a tokay — it calls really loudly.", gloss: [["นั่น", "that"], ["น่าจะ", "probably"], ["เป็น", "is"], ["ตุ๊กแก", "tokay"], ["ร้อง", "calls"], ["เสียงดัง", "loudly"], ["เลย", "(emphasis)"]], cultural: "The tokay gecko (ตุ๊กแก) is named for its loud night-time 'TUK-kae' call, heard all over Thailand; folklore says you can count the calls for luck. น่าจะ = 'probably', softening a guess." },
  { num: 1100, display: 3, preview: "จิ้งจก", thai: "ตรงกำแพงมีจิ้งจกตัวเล็กๆ", english: "There's a little house gecko on the wall.", gloss: [["ตรง", "at"], ["กำแพง", "wall"], ["มี", "there's"], ["จิ้งจก", "house gecko"], ["ตัว", "(classifier)"], ["เล็กๆ", "tiny"]], cultural: "จิ้งจก, the little house gecko, is a welcome guest in Thai homes — it eats insects, and its soft clicking is a familiar household sound." },

  { num: 1102, display: 5, preview: "แมว", thai: "ว่าแต่ คุณมีแมวกี่ตัวคะ", english: "By the way, how many cats do you have?", gloss: [["ว่าแต่", "by the way"], ["คุณ", "you"], ["มี", "have"], ["แมว", "cat"], ["กี่", "how many"], ["ตัว", "(classifier)"], ["คะ", "polite(f)"]], cultural: "ว่าแต่ = 'by the way' — a casual marker for switching topic." },

  { num: 1107, display: 10, preview: "ไม่เคยลืม", thai: "ช้างตัวใหญ่จริงๆ และไม่เคยลืมอะไรเลย", english: "Elephants are really big, and they never forget a thing.", gloss: [["ช้าง", "elephant"], ["ตัว", "(classifier)"], ["ใหญ่", "big"], ["จริงๆ", "really"], ["และ", "and"], ["ไม่เคย", "never"], ["ลืม", "forget"], ["อะไร", "anything"], ["เลย", "at all"]], cultural: "The elephant (ช้าง) is Thailand's national animal and a revered symbol in history, Buddhism and royal imagery. ไม่เคย = 'never (have)', the negative of เคย." },

  { num: 1112, display: 15, preview: "ควาย", thai: "ควายเชื่อง ไม่ดุเลย", english: "Water buffaloes are tame, not fierce at all.", gloss: [["ควาย", "buffalo"], ["เชื่อง", "tame"], ["ไม่", "not"], ["ดุ", "fierce"], ["เลย", "at all"]], cultural: "The water buffalo (ควาย) is the classic partner of the Thai rice farmer — calm and hardworking. Careful, though: calling a person ควาย is a common insult meaning 'stupid'." },

  { num: 1116, display: 19, preview: "กบ", thai: "กบรีบกระโดดลงบ่อน้ำนิ่ง", english: "The frog quickly jumps into the still pond.", gloss: [["กบ", "frog"], ["รีบ", "quickly"], ["กระโดด", "jump"], ["ลง", "down into"], ["บ่อน้ำ", "pond"], ["นิ่ง", "still"]], cultural: "" },
  { num: 1117, display: 20, preview: "จระเข้", thai: "จระเข้มีฟันแหลมคม และกัดแรงมาก", english: "Crocodiles have sharp teeth and a powerful bite.", gloss: [["จระเข้", "crocodile"], ["มี", "has"], ["ฟัน", "teeth"], ["แหลมคม", "sharp"], ["และ", "and"], ["กัด", "bite"], ["แรง", "hard"], ["มาก", "very"]], cultural: "" },

  { num: 1120, display: 23, preview: "เต่า", thai: "เต่าเดินช้ามาก", english: "The turtle walks very slowly.", gloss: [["เต่า", "turtle"], ["เดิน", "walk"], ["ช้า", "slow"], ["มาก", "very"]], cultural: "" },

  { num: 1123, display: 26, preview: "โดนมดกัด", thai: "โดนมดกัดเจ็บนิดหน่อย", english: "Getting bitten by an ant stings a little.", gloss: [["โดน", "get-(passive)"], ["มด", "ant"], ["กัด", "bite"], ["เจ็บ", "hurts"], ["นิดหน่อย", "a little"]], cultural: "โดน marks an adversative passive — 'to get [something done to you]', usually unwanted. โดนมดกัด = 'to get bitten by an ant'." },
